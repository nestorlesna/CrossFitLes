<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="monospace" font-size="10" fill="#475569">ANKLE MOBILITY ROCK</text>

<!-- F1: Half-kneeling neutral position, front shin vertical -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="85" cy="60" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="85" y1="73" x2="85" y2="135"/>
  <!-- Arms forward for balance -->
  <line x1="85" y1="88" x2="118" y2="100"/>
  <line x1="85" y1="88" x2="68" y2="118"/>
  <!-- Front leg: thigh horizontal, shin vertical (90°) -->
  <line x1="85" y1="135" x2="125" y2="155"/>
  <line x1="125" y1="155" x2="125" y2="205"/>
  <circle cx="125" cy="155" r="5" fill="#64748b" stroke="none"/>
  <!-- Front foot -->
  <line x1="120" y1="205" x2="140" y2="205"/>
  <!-- Back leg: thigh back, knee on ground -->
  <line x1="85" y1="135" x2="60" y2="178"/>
  <line x1="60" y1="178" x2="40" y2="205"/>
  <circle cx="60" cy="178" r="5" fill="#64748b" stroke="none"/>
  <line x1="35" y1="205" x2="55" y2="205"/>
</g>

<!-- F2: Rocking forward, front knee past toes -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="62" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="75" x2="98" y2="138"/>
  <!-- Arms forward for balance -->
  <line x1="100" y1="90" x2="132" y2="108"/>
  <line x1="100" y1="90" x2="82" y2="120"/>
  <!-- Front leg: knee drives forward over toes -->
  <line x1="98" y1="138" x2="148" y2="172"/>
  <line x1="148" y1="172" x2="130" y2="205"/>
  <circle cx="148" cy="172" r="5" fill="#64748b" stroke="none"/>
  <line x1="120" y1="205" x2="140" y2="205"/>
  <!-- Back leg: knee on ground -->
  <line x1="98" y1="138" x2="70" y2="180"/>
  <line x1="70" y1="180" x2="50" y2="205"/>
  <circle cx="70" cy="180" r="5" fill="#64748b" stroke="none"/>
  <line x1="45" y1="205" x2="65" y2="205"/>
</g>

<!-- F3: Rocking back, knee behind toes -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="78" cy="58" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="78" y1="71" x2="82" y2="135"/>
  <!-- Arms forward -->
  <line x1="80" y1="86" x2="115" y2="100"/>
  <line x1="80" y1="86" x2="62" y2="115"/>
  <!-- Front leg: knee pulled back, shin angle back -->
  <line x1="82" y1="135" x2="115" y2="148"/>
  <line x1="115" y1="148" x2="130" y2="205"/>
  <circle cx="115" cy="148" r="5" fill="#64748b" stroke="none"/>
  <line x1="125" y1="205" x2="145" y2="205"/>
  <!-- Back leg: knee on ground -->
  <line x1="82" y1="135" x2="55" y2="178"/>
  <line x1="55" y1="178" x2="35" y2="205"/>
  <circle cx="55" cy="178" r="5" fill="#64748b" stroke="none"/>
  <line x1="30" y1="205" x2="50" y2="205"/>
</g>
</svg>
