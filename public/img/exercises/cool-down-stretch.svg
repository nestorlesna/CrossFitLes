<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="240" height="200" fill="#111827" rx="12"/>
  <line x1="20" y1="170" x2="220" y2="170" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="188" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">ESTIRAMIENTO</text>
  <!-- Frame 1: standing tall -->
  <g class="f1">
    <circle cx="120" cy="46" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="120" y1="58" x2="120" y2="114"/>
      <line x1="120" y1="72" x2="104" y2="104"/><line x1="120" y1="72" x2="136" y2="104"/>
      <line x1="120" y1="114" x2="112" y2="168"/><line x1="120" y1="114" x2="128" y2="168"/>
    </g>
    <circle cx="120" cy="114" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: reach overhead -->
  <g class="f2">
    <circle cx="120" cy="46" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="120" y1="58" x2="120" y2="114"/>
      <line x1="120" y1="70" x2="110" y2="36"/><line x1="120" y1="70" x2="130" y2="36"/>
      <line x1="120" y1="114" x2="112" y2="168"/><line x1="120" y1="114" x2="128" y2="168"/>
    </g>
    <circle cx="120" cy="114" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: forward fold to toes -->
  <g class="f3">
    <circle cx="96" cy="120" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="106" y1="126" x2="126" y2="116"/>
      <line x1="112" y1="124" x2="118" y2="160"/><line x1="120" y1="122" x2="120" y2="160"/>
      <line x1="126" y1="116" x2="122" y2="168"/><line x1="126" y1="116" x2="132" y2="168"/>
    </g>
    <circle cx="126" cy="116" r="5" fill="#64748b"/>
  </g>
</svg>
