<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="224" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="700" fill="#475569" letter-spacing="1">DB HANG CLEAN+JERK</text>
  <!-- Frame 1: Hang position, DBs at knee height, hinged -->
  <g class="f1">
    <circle cx="105" cy="60" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="103" y1="72" x2="95" y2="120"/>
      <line x1="80" y1="88" x2="86" y2="150"/>
      <line x1="118" y1="88" x2="112" y2="150"/>
      <line x1="90" y1="120" x2="80" y2="160"/><line x1="80" y1="160" x2="72" y2="205"/>
      <line x1="100" y1="120" x2="106" y2="160"/><line x1="106" y1="160" x2="112" y2="205"/>
    </g>
    <rect x="76" y="146" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="102" y="146" width="20" height="8" rx="2" fill="#475569"/>
  </g>
  <!-- Frame 2: Rack position after clean, small dip for jerk -->
  <g class="f2">
    <circle cx="100" cy="56" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="68" x2="100" y2="128"/>
      <line x1="82" y1="80" x2="94" y2="80"/>
      <line x1="118" y1="80" x2="106" y2="80"/>
      <line x1="90" y1="128" x2="84" y2="168"/><line x1="84" y1="168" x2="80" y2="205"/>
      <line x1="110" y1="128" x2="116" y2="168"/><line x1="116" y1="168" x2="120" y2="205"/>
    </g>
    <rect x="74" y="70" width="18" height="8" rx="2" fill="#475569"/>
    <rect x="108" y="70" width="18" height="8" rx="2" fill="#475569"/>
  </g>
  <!-- Frame 3: DBs locked overhead - jerk finish -->
  <g class="f3">
    <circle cx="100" cy="48" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="60" x2="100" y2="120"/>
      <line x1="78" y1="72" x2="122" y2="72"/>
      <line x1="78" y1="72" x2="66" y2="26"/>
      <line x1="122" y1="72" x2="134" y2="26"/>
      <line x1="94" y1="120" x2="82" y2="160"/><line x1="82" y1="160" x2="76" y2="205"/>
      <line x1="106" y1="120" x2="118" y2="160"/><line x1="118" y1="160" x2="124" y2="205"/>
    </g>
    <circle cx="82" cy="160" r="5" fill="#64748b"/>
    <circle cx="118" cy="160" r="5" fill="#64748b"/>
    <rect x="56" y="22" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="124" y="22" width="20" height="8" rx="2" fill="#475569"/>
  </g>
</svg>
