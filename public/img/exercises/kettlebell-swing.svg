<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 7.8s linear infinite}.f2{animation:sh2 7.8s linear infinite}.f3{animation:sh3 7.8s linear infinite}.f4{animation:sh4 7.8s linear infinite}.f5{animation:sh5 7.8s linear infinite}.f6{animation:sh6 7.8s linear infinite}
    @keyframes sh1{0%,13.3%{opacity:1}16.7%,96.7%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,16.7%{opacity:0}20%,30%{opacity:1}33.3%,100%{opacity:0}}
    @keyframes sh3{0%,33.3%{opacity:0}36.7%,46.7%{opacity:1}50%,100%{opacity:0}}
    @keyframes sh4{0%,50%{opacity:0}53.3%,63.3%{opacity:1}66.7%,100%{opacity:0}}
    @keyframes sh5{0%,66.7%{opacity:0}70%,80%{opacity:1}83.3%,100%{opacity:0}}
    @keyframes sh6{0%,83.3%{opacity:0}86.7%,96.7%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">KB SWING</text>
  <!-- Frame 1: Hike, kettlebell atras entre las piernas -->
  <g class="f1">
    <circle cx="110.6" cy="104.5" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="49.5" y1="142.7" x2="93.6" y2="115.1"/>
      <line x1="93.6" y1="115.1" x2="75.7" y2="159.6"/>
      <polyline points="49.5,142.7 90.2,164.2 80,205"/>
      <line x1="74" y1="205" x2="98" y2="205"/>
    </g>
    <circle cx="90.2" cy="164.2" r="5" fill="#64748b"/>
    <line x1="75.7" y1="159.6" x2="71.5" y2="169.8" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="71.5" cy="169.8" r="10" fill="none" stroke="#475569" stroke-width="4"/>
  </g>
  <!-- Frame 2: Empuje de cadera -->
  <g class="f2">
    <circle cx="94.9" cy="51" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="70.3" y1="118.6" x2="88.1" y2="69.8"/>
      <line x1="88.1" y1="69.8" x2="108.4" y2="113.3"/>
      <polyline points="70.3,118.6 82.2,163.1 80,205"/>
      <line x1="74" y1="205" x2="98" y2="205"/>
    </g>
    <circle cx="82.2" cy="163.1" r="5" fill="#64748b"/>
    <line x1="108.4" y1="113.3" x2="113" y2="123.2" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="113" cy="123.2" r="10" fill="none" stroke="#475569" stroke-width="4"/>
  </g>
  <!-- Frame 3: Kettlebell sube a la altura de la cintura -->
  <g class="f3">
    <circle cx="81.4" cy="45.2" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="77.6" y1="117.1" x2="80.3" y2="65.1"/>
      <line x1="80.3" y1="65.1" x2="121.9" y2="89.1"/>
      <polyline points="77.6,117.1 80,163 80,205"/>
      <line x1="74" y1="205" x2="98" y2="205"/>
    </g>
    <circle cx="80" cy="163" r="5" fill="#64748b"/>
    <line x1="121.9" y1="89.1" x2="131.4" y2="94.6" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="131.4" cy="94.6" r="10" fill="none" stroke="#475569" stroke-width="4"/>
  </g>
  <!-- Frame 4: Arriba, brazos horizontales -->
  <g class="f4">
    <circle cx="76.2" cy="45.1" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="80" y1="117" x2="77.3" y2="65.1"/>
      <line x1="77.3" y1="65.1" x2="125.2" y2="66.7"/>
      <polyline points="80,117 80,163 80,205"/>
      <line x1="74" y1="205" x2="98" y2="205"/>
    </g>
    <circle cx="80" cy="163" r="5" fill="#64748b"/>
    <line x1="125.2" y1="66.7" x2="136.2" y2="67.1" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="136.2" cy="67.1" r="10" fill="none" stroke="#475569" stroke-width="4"/>
  </g>
  <!-- Frame 5: Cae por delante -->
  <g class="f5">
    <circle cx="85" cy="46.5" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="74.9" y1="117.8" x2="82.2" y2="66.3"/>
      <line x1="82.2" y1="66.3" x2="121.5" y2="93.8"/>
      <polyline points="74.9,117.8 82.9,163.1 80,205"/>
      <line x1="74" y1="205" x2="98" y2="205"/>
    </g>
    <circle cx="82.9" cy="163.1" r="5" fill="#64748b"/>
    <line x1="121.5" y1="93.8" x2="130.5" y2="100.1" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="130.5" cy="100.1" r="10" fill="none" stroke="#475569" stroke-width="4"/>
  </g>
  <!-- Frame 6: Vuelve a la bisagra de cadera -->
  <g class="f6">
    <circle cx="99.3" cy="66.6" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="58" y1="125.5" x2="87.8" y2="83"/>
      <line x1="87.8" y1="83" x2="97.8" y2="129.9"/>
      <polyline points="58,125.5 84.4,163.2 80,205"/>
      <line x1="74" y1="205" x2="98" y2="205"/>
    </g>
    <circle cx="84.4" cy="163.2" r="5" fill="#64748b"/>
    <line x1="97.8" y1="129.9" x2="100.1" y2="140.7" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100.1" cy="140.7" r="10" fill="none" stroke="#475569" stroke-width="4"/>
  </g>
</svg>
