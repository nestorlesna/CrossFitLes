<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">BOTTOM HALF SQUAT</text>
  <!-- Frame 1: Paralelo (tope alto del rango) -->
  <g class="f1">
    <circle cx="100" cy="60" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="74" x2="97" y2="132"/><line x1="78" y1="86" x2="122" y2="86"/>
      <line x1="78" y1="86" x2="62" y2="118"/><line x1="122" y1="86" x2="138" y2="118"/>
      <line x1="93" y1="132" x2="68" y2="164"/><line x1="68" y1="164" x2="72" y2="205"/>
      <line x1="101" y1="132" x2="132" y2="164"/><line x1="132" y1="164" x2="128" y2="205"/>
      <line x1="56" y1="205" x2="84" y2="205"/><line x1="116" y1="205" x2="142" y2="205"/>
    </g>
    <circle cx="68" cy="164" r="5.5" fill="#64748b"/><circle cx="132" cy="164" r="5.5" fill="#64748b"/>
  </g>
  <!-- Frame 2: Fondo profundo -->
  <g class="f2">
    <circle cx="100" cy="90" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="104" x2="97" y2="154"/><line x1="78" y1="116" x2="122" y2="116"/>
      <line x1="78" y1="116" x2="62" y2="146"/><line x1="122" y1="116" x2="138" y2="146"/>
      <line x1="93" y1="154" x2="66" y2="172"/><line x1="66" y1="172" x2="70" y2="205"/>
      <line x1="101" y1="154" x2="134" y2="172"/><line x1="134" y1="172" x2="130" y2="205"/>
      <line x1="54" y1="205" x2="82" y2="205"/><line x1="118" y1="205" x2="144" y2="205"/>
    </g>
    <circle cx="66" cy="172" r="5.5" fill="#64748b"/><circle cx="134" cy="172" r="5.5" fill="#64748b"/>
  </g>
  <!-- Frame 3: Vuelve a medio rango (nunca se extiende del todo) -->
  <g class="f3">
    <circle cx="100" cy="70" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="84" x2="97" y2="140"/><line x1="78" y1="96" x2="122" y2="96"/>
      <line x1="78" y1="96" x2="62" y2="126"/><line x1="122" y1="96" x2="138" y2="126"/>
      <line x1="93" y1="140" x2="68" y2="167"/><line x1="68" y1="167" x2="72" y2="205"/>
      <line x1="101" y1="140" x2="132" y2="167"/><line x1="132" y1="167" x2="128" y2="205"/>
      <line x1="56" y1="205" x2="84" y2="205"/><line x1="116" y1="205" x2="142" y2="205"/>
    </g>
    <circle cx="68" cy="167" r="5.5" fill="#64748b"/><circle cx="132" cy="167" r="5.5" fill="#64748b"/>
  </g>
</svg>
