<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
    .f1{animation:sh1 4s linear infinite}
    .f2{animation:sh2 4s linear infinite}
    .f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style></defs>
<rect width="200" height="230" fill="#111827" rx="12" stroke="none"/>
<line x1="25" y1="192" x2="175" y2="192" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: Acostado, rodillas abiertas hacia afuera con plantas de los pies juntas (mariposa), peso sobre el pecho -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="36" cy="168" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="49" y1="168" x2="112" y2="172"/>
    <line x1="70" y1="168" x2="68" y2="158"/>
    <line x1="88" y1="170" x2="86" y2="160"/>
    <circle cx="77" cy="155" r="10" stroke="#64748b" stroke-width="3" fill="#1f2937"/>
    <line x1="112" y1="172" x2="128" y2="150"/>
    <line x1="128" y1="150" x2="148" y2="176"/>
    <line x1="112" y1="172" x2="128" y2="194"/>
    <line x1="128" y1="194" x2="148" y2="176"/>
  </g>

  <!-- f2: Mitad del incorporado -->
  <g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="51" cy="153" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="63.3" y1="156.8" x2="112" y2="174.3"/>
    <line x1="79" y1="156.8" x2="77" y2="146"/>
    <line x1="94" y1="162.5" x2="92" y2="151.8"/>
    <circle cx="83.8" cy="142.3" r="10" stroke="#64748b" stroke-width="3" fill="#1f2937"/>
    <line x1="112" y1="174.3" x2="129.5" y2="153"/>
    <line x1="129.5" y1="153" x2="149.5" y2="177.5"/>
    <line x1="112" y1="174.3" x2="129.5" y2="195.5"/>
    <line x1="129.5" y1="195.5" x2="149.5" y2="177.5"/>
  </g>

  <!-- f3: Incorporado completo -->
  <g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="84" cy="122" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="84" y1="135" x2="107" y2="178"/>
    <line x1="84" y1="148" x2="72" y2="128"/>
    <line x1="84" y1="148" x2="96" y2="126"/>
    <circle cx="84" cy="115" r="10" stroke="#64748b" stroke-width="3" fill="#1f2937"/>
    <line x1="107" y1="178" x2="126" y2="158"/>
    <line x1="126" y1="158" x2="148" y2="180"/>
    <line x1="107" y1="178" x2="126" y2="198"/>
    <line x1="126" y1="198" x2="148" y2="180"/>
  </g>

<text x="100" y="212" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">BUTTERFLY SIT-UP</text>
</svg>
