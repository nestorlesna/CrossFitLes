<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">BAND PASS-THROUGH</text>
  <!-- Frame 1: Banda adelante, brazos extendidos a la altura de la cadera -->
  <g class="f1">
    <circle cx="100" cy="34" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="47" x2="100" y2="112"/>
      <line x1="100" y1="60" x2="66" y2="106"/>
      <line x1="100" y1="60" x2="134" y2="106"/>
      <line x1="94" y1="112" x2="90" y2="162"/><line x1="90" y1="162" x2="88" y2="208"/>
      <line x1="106" y1="112" x2="110" y2="162"/><line x1="110" y1="162" x2="112" y2="208"/>
    </g>
    <circle cx="90" cy="162" r="5" fill="#64748b"/>
    <circle cx="110" cy="162" r="5" fill="#64748b"/>
    <!-- Banda tensa entre las manos, por delante del cuerpo -->
    <path d="M66 106 q34 16 68 0" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Frame 2: La banda pasa por encima de la cabeza, brazos extendidos -->
  <g class="f2">
    <circle cx="100" cy="34" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="47" x2="100" y2="112"/>
      <line x1="100" y1="60" x2="58" y2="30"/>
      <line x1="100" y1="60" x2="142" y2="30"/>
      <line x1="94" y1="112" x2="90" y2="162"/><line x1="90" y1="162" x2="88" y2="208"/>
      <line x1="106" y1="112" x2="110" y2="162"/><line x1="110" y1="162" x2="112" y2="208"/>
    </g>
    <circle cx="90" cy="162" r="5" fill="#64748b"/>
    <circle cx="110" cy="162" r="5" fill="#64748b"/>
    <!-- Banda estirada justo por encima de la cabeza -->
    <path d="M58 30 q42 -18 84 0" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Frame 3: Banda detrás, brazos extendidos hacia atrás y abajo -->
  <g class="f3">
    <circle cx="100" cy="34" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="47" x2="100" y2="112"/>
      <line x1="100" y1="60" x2="62" y2="96"/>
      <line x1="100" y1="60" x2="138" y2="96"/>
      <line x1="94" y1="112" x2="90" y2="162"/><line x1="90" y1="162" x2="88" y2="208"/>
      <line x1="106" y1="112" x2="110" y2="162"/><line x1="110" y1="162" x2="112" y2="208"/>
    </g>
    <circle cx="90" cy="162" r="5" fill="#64748b"/>
    <circle cx="110" cy="162" r="5" fill="#64748b"/>
    <!-- Banda por detrás del cuerpo: la curva cae al otro lado -->
    <path d="M62 96 q38 -22 76 0" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>
  </g>
</svg>
