<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="207" x2="170" y2="207" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">MARCH IN PLACE</text>

  <!-- Frame 1: rodilla derecha arriba, brazo izquierdo al frente -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="26" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="39" x2="100" y2="110"/>
    <polyline points="100,110 94,160 94,204"/>
    <line x1="84" y1="204" x2="104" y2="204"/>
    <polyline points="100,110 128,124 122,152"/>
    <polyline points="100,54 124,66 132,48"/>
    <polyline points="100,54 76,70 72,92"/>
    <circle cx="94" cy="160" r="4" fill="#64748b" stroke="none"/>
    <circle cx="128" cy="124" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: transición, ambos pies apoyados -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="26" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="39" x2="100" y2="110"/>
    <polyline points="100,110 92,158 92,204"/>
    <line x1="82" y1="204" x2="100" y2="204"/>
    <polyline points="100,110 108,158 108,204"/>
    <line x1="100" y1="204" x2="118" y2="204"/>
    <polyline points="100,54 78,72 76,96"/>
    <polyline points="100,54 122,72 124,96"/>
    <circle cx="92" cy="158" r="4" fill="#64748b" stroke="none"/>
    <circle cx="108" cy="158" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: rodilla izquierda arriba, brazo derecho al frente -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="26" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="39" x2="100" y2="110"/>
    <polyline points="100,110 106,160 106,204"/>
    <line x1="96" y1="204" x2="116" y2="204"/>
    <polyline points="100,110 72,124 78,152"/>
    <polyline points="100,54 76,66 68,48"/>
    <polyline points="100,54 124,70 128,92"/>
    <circle cx="106" cy="160" r="4" fill="#64748b" stroke="none"/>
    <circle cx="72" cy="124" r="4" fill="#64748b" stroke="none"/>
  </g>
</svg>
