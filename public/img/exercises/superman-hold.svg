<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="240" height="180" fill="#111827" rx="12"/>
  <line x1="20" y1="148" x2="220" y2="148" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="165" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">SUPERMAN HOLD</text>
  <!-- Frame 1: Boca abajo, plano en el piso -->
  <g class="f1">
    <circle cx="200" cy="135" r="11" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Torso plano -->
      <line x1="192" y1="140" x2="50" y2="142"/>
      <!-- Brazos extendidos al frente, en el piso -->
      <line x1="200" y1="135" x2="220" y2="138"/>
      <!-- Piernas extendidas, en el piso -->
      <line x1="50" y1="142" x2="32" y2="143"/>
    </g>
  </g>
  <!-- Frame 2: Elevación parcial -->
  <g class="f2">
    <circle cx="200" cy="125" r="11" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Torso ligeramente arqueado, parte central pegada al piso -->
      <line x1="192" y1="132" x2="120" y2="140"/>
      <line x1="120" y1="140" x2="50" y2="135"/>
      <!-- Brazos elevados al frente -->
      <line x1="200" y1="125" x2="222" y2="118"/>
      <!-- Piernas elevadas -->
      <line x1="50" y1="135" x2="28" y2="128"/>
    </g>
  </g>
  <!-- Frame 3: Superman completo - arqueado, brazos y piernas elevados -->
  <g class="f3">
    <circle cx="200" cy="115" r="11" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Torso bien arqueado, sólo cadera en contacto con el piso -->
      <line x1="192" y1="122" x2="120" y2="140"/>
      <line x1="120" y1="140" x2="50" y2="122"/>
      <!-- Brazos extendidos al frente y arriba -->
      <line x1="200" y1="115" x2="228" y2="100"/>
      <!-- Piernas extendidas y elevadas -->
      <line x1="50" y1="122" x2="22" y2="108"/>
    </g>
  </g>
</svg>
