<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="16" y1="188" x2="184" y2="188" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">BIRD DOG HOLD</text>

  <!-- Frame 1: cuadrupedia neutra -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="58" cy="112" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="74" y1="120" x2="142" y2="120"/>
    <line x1="76" y1="120" x2="74" y2="186"/>
    <line x1="142" y1="120" x2="146" y2="186"/>
    <line x1="146" y1="186" x2="172" y2="186"/>
    <circle cx="74" cy="186" r="4" fill="#64748b" stroke="none"/>
    <circle cx="146" cy="186" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: brazo y pierna contrarios extendidos -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="58" cy="110" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="74" y1="118" x2="142" y2="118"/>
    <line x1="76" y1="118" x2="74" y2="186"/>
    <line x1="142" y1="118" x2="146" y2="186"/>
    <line x1="146" y1="186" x2="172" y2="186"/>
    <line x1="74" y1="118" x2="22" y2="100"/>
    <line x1="142" y1="118" x2="192" y2="102"/>
    <circle cx="74" cy="186" r="4" fill="#64748b" stroke="none"/>
    <circle cx="146" cy="186" r="4" fill="#64748b" stroke="none"/>
    <circle cx="22" cy="100" r="4" fill="#64748b" stroke="none"/>
    <circle cx="192" cy="102" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: hold sostenido -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="58" cy="110" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="74" y1="118" x2="142" y2="118"/>
    <line x1="76" y1="118" x2="74" y2="186"/>
    <line x1="142" y1="118" x2="146" y2="186"/>
    <line x1="146" y1="186" x2="172" y2="186"/>
    <line x1="74" y1="118" x2="22" y2="100"/>
    <line x1="142" y1="118" x2="192" y2="102"/>
    <circle cx="74" cy="186" r="4" fill="#64748b" stroke="none"/>
    <circle cx="146" cy="186" r="4" fill="#64748b" stroke="none"/>
    <circle cx="96" cy="106" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="108" cy="106" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="120" cy="106" r="3" fill="#6ee7b7" stroke="none"/>
  </g>
</svg>
