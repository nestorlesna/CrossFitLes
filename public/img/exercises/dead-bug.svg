<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="16" y1="190" x2="184" y2="190" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">DEAD BUG</text>

  <!-- Frame 1: posición inicial, brazos y rodillas a 90° -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="34" cy="170" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="48" y1="178" x2="118" y2="180"/>
    <line x1="58" y1="178" x2="56" y2="112"/>
    <line x1="70" y1="178" x2="68" y2="112"/>
    <polyline points="118,180 122,120 166,116"/>
    <polyline points="118,180 132,124 172,128"/>
    <circle cx="122" cy="120" r="4" fill="#64748b" stroke="none"/>
    <circle cx="56" cy="112" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: brazo y pierna contrarios bajando -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="34" cy="170" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="48" y1="178" x2="118" y2="180"/>
    <line x1="58" y1="178" x2="22" y2="140"/>
    <line x1="70" y1="178" x2="68" y2="112"/>
    <polyline points="118,180 152,166 186,172"/>
    <polyline points="118,180 132,124 172,128"/>
    <circle cx="152" cy="166" r="4" fill="#64748b" stroke="none"/>
    <circle cx="22" cy="140" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: la otra diagonal -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="34" cy="170" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="48" y1="178" x2="118" y2="180"/>
    <line x1="58" y1="178" x2="56" y2="112"/>
    <line x1="70" y1="178" x2="34" y2="142"/>
    <polyline points="118,180 122,120 166,116"/>
    <polyline points="118,180 150,172 186,178"/>
    <circle cx="150" cy="172" r="4" fill="#64748b" stroke="none"/>
    <circle cx="34" cy="142" r="4" fill="#64748b" stroke="none"/>
  </g>
</svg>
