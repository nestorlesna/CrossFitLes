<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>

  <!-- Frame 1: Push-up bajo, pecho casi al piso -->
  <g class="f1" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
    <circle cx="100" cy="148" r="13" fill="#94a3b8" stroke="none"/>
    <!-- Torso bajo y casi horizontal -->
    <line x1="100" y1="161" x2="100" y2="182"/>
    <!-- Brazos flexionados, codos cerca del cuerpo -->
    <line x1="100" y1="168" x2="65" y2="200"/>
    <line x1="100" y1="168" x2="135" y2="200"/>
    <!-- Piernas extendidas atrás, casi al piso -->
    <line x1="100" y1="182" x2="78" y2="205"/>
    <line x1="100" y1="182" x2="122" y2="205"/>
    <line x1="78" y1="205" x2="76" y2="210"/>
    <line x1="122" y1="205" x2="124" y2="210"/>
    <circle cx="65" cy="200" r="4" fill="#64748b" stroke="none"/>
    <circle cx="135" cy="200" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: Cobra / upward dog, pecho arriba y piernas apoyadas en el piso -->
  <g class="f2" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
    <circle cx="100" cy="85" r="13" fill="#94a3b8" stroke="none"/>
    <!-- Torso arqueado, cadera baja cerca del piso -->
    <line x1="100" y1="98" x2="100" y2="193"/>
    <!-- Brazos extendidos apoyados -->
    <line x1="100" y1="110" x2="58" y2="198"/>
    <line x1="100" y1="110" x2="142" y2="198"/>
    <!-- Piernas apoyadas en el piso -->
    <line x1="100" y1="193" x2="75" y2="206"/>
    <line x1="100" y1="193" x2="125" y2="206"/>
    <line x1="68" y1="209" x2="82" y2="209"/>
    <line x1="118" y1="209" x2="132" y2="209"/>
    <circle cx="58" cy="198" r="4" fill="#64748b" stroke="none"/>
    <circle cx="142" cy="198" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: Downward dog / "carpita", cadera al cielo -->
  <g class="f3" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
    <circle cx="100" cy="68" r="13" fill="#94a3b8" stroke="none"/>
    <!-- Torso inclinado formando V invertida -->
    <line x1="100" y1="81" x2="100" y2="110"/>
    <!-- Brazos hacia el suelo -->
    <line x1="100" y1="90" x2="60" y2="148"/>
    <line x1="100" y1="90" x2="140" y2="148"/>
    <!-- Piernas hacia atrás/suelo -->
    <line x1="100" y1="110" x2="68" y2="158"/>
    <line x1="100" y1="110" x2="132" y2="158"/>
    <!-- Pies en suelo -->
    <line x1="60" y1="196" x2="74" y2="196"/>
    <line x1="126" y1="196" x2="140" y2="196"/>
    <line x1="68" y1="158" x2="67" y2="196"/>
    <line x1="132" y1="158" x2="133" y2="196"/>
    <!-- Manos en suelo -->
    <line x1="52" y1="196" x2="66" y2="196"/>
    <line x1="52" y1="193" x2="52" y2="197"/>
    <line x1="134" y1="193" x2="134" y2="197"/>
    <line x1="128" y1="196" x2="142" y2="196"/>
    <circle cx="60" cy="148" r="4" fill="#64748b" stroke="none"/>
    <circle cx="140" cy="148" r="4" fill="#64748b" stroke="none"/>
  </g>

  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle" letter-spacing="0.5">YOGA PUSH-UP</text>
</svg>
