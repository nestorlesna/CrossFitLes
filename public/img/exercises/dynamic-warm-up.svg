<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="240" height="200" fill="#111827" rx="12"/>
  <line x1="20" y1="170" x2="220" y2="170" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="188" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">CALENTAMIENTO</text>
  <!-- Frame 1: arms down -->
  <g class="f1">
    <circle cx="120" cy="46" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="120" y1="58" x2="120" y2="112"/>
      <line x1="120" y1="70" x2="100" y2="104"/><line x1="120" y1="70" x2="140" y2="104"/>
      <line x1="120" y1="112" x2="106" y2="150"/><line x1="106" y1="150" x2="102" y2="168"/>
      <line x1="120" y1="112" x2="134" y2="150"/><line x1="134" y1="150" x2="138" y2="168"/>
    </g>
    <circle cx="120" cy="112" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: arms out to sides -->
  <g class="f2">
    <circle cx="120" cy="46" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="120" y1="58" x2="120" y2="112"/>
      <line x1="120" y1="70" x2="90" y2="64"/><line x1="120" y1="70" x2="150" y2="64"/>
      <line x1="120" y1="112" x2="106" y2="150"/><line x1="106" y1="150" x2="102" y2="168"/>
      <line x1="120" y1="112" x2="134" y2="150"/><line x1="134" y1="150" x2="138" y2="168"/>
    </g>
    <circle cx="120" cy="112" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: arms overhead -->
  <g class="f3">
    <circle cx="120" cy="46" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="120" y1="58" x2="120" y2="112"/>
      <line x1="120" y1="70" x2="102" y2="38"/><line x1="120" y1="70" x2="138" y2="38"/>
      <line x1="120" y1="112" x2="106" y2="150"/><line x1="106" y1="150" x2="102" y2="168"/>
      <line x1="120" y1="112" x2="134" y2="150"/><line x1="134" y1="150" x2="138" y2="168"/>
    </g>
    <circle cx="120" cy="112" r="5" fill="#64748b"/>
  </g>
</svg>
