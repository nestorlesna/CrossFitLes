<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">BANDED GLUTE KICKBACK</text>
  <!-- Anclaje de la banda (delante del atleta) -->
  <line x1="42" y1="196" x2="42" y2="210" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <!-- Frame 1: De pie, pierna de trabajo apoyada, banda floja -->
  <g class="f1">
    <circle cx="112" cy="26" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="112" y1="40" x2="110" y2="108"/><line x1="92" y1="52" x2="130" y2="52"/>
      <line x1="92" y1="52" x2="86" y2="94"/><line x1="130" y1="52" x2="136" y2="94"/>
      <line x1="106" y1="108" x2="104" y2="160"/><line x1="104" y1="160" x2="104" y2="205"/>
      <line x1="114" y1="108" x2="116" y2="160"/><line x1="116" y1="160" x2="116" y2="205"/>
      <line x1="90" y1="205" x2="116" y2="205"/><line x1="104" y1="205" x2="130" y2="205"/>
    </g>
    <path d="M42 200 Q 74 206 104 203" stroke="#64748b" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>
  </g>
  <!-- Frame 2: Pierna a media extensión -->
  <g class="f2">
    <circle cx="112" cy="26" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="112" y1="40" x2="110" y2="108"/><line x1="92" y1="52" x2="130" y2="52"/>
      <line x1="92" y1="52" x2="86" y2="94"/><line x1="130" y1="52" x2="136" y2="94"/>
      <line x1="106" y1="108" x2="104" y2="160"/><line x1="104" y1="160" x2="104" y2="205"/>
      <line x1="114" y1="108" x2="128" y2="154"/><line x1="128" y1="154" x2="140" y2="188"/>
      <line x1="90" y1="205" x2="116" y2="205"/><line x1="136" y1="190" x2="152" y2="184"/>
    </g>
    <circle cx="128" cy="154" r="5.5" fill="#64748b"/>
    <path d="M42 200 Q 88 200 140 188" stroke="#64748b" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>
  </g>
  <!-- Frame 3: Extensión completa de cadera -->
  <g class="f3">
    <circle cx="112" cy="26" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="112" y1="40" x2="110" y2="108"/><line x1="92" y1="52" x2="130" y2="52"/>
      <line x1="92" y1="52" x2="86" y2="94"/><line x1="130" y1="52" x2="136" y2="94"/>
      <line x1="106" y1="108" x2="104" y2="160"/><line x1="104" y1="160" x2="104" y2="205"/>
      <line x1="114" y1="108" x2="142" y2="140"/><line x1="142" y1="140" x2="164" y2="164"/>
      <line x1="90" y1="205" x2="116" y2="205"/><line x1="160" y1="166" x2="172" y2="156"/>
    </g>
    <circle cx="142" cy="140" r="5.5" fill="#64748b"/>
    <path d="M42 200 Q 100 196 164 164" stroke="#64748b" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>
  </g>
</svg>
