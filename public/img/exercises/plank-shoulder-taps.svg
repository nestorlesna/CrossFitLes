<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">PLANK SHOULDER TAPS</text>

<!-- F1: High plank, both hands on floor -->
<g class="f1" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="150" cy="138" r="11" fill="#94a3b8" stroke="none"/>
  <!-- Body line shoulders to ankles -->
  <line x1="138" y1="144" x2="100" y2="158"/>
  <line x1="100" y1="158" x2="58" y2="196"/>
  <!-- Both arms supporting -->
  <line x1="138" y1="144" x2="138" y2="200"/>
  <line x1="132" y1="148" x2="132" y2="200"/>
  <!-- Feet -->
  <line x1="52" y1="200" x2="64" y2="196"/>
</g>

<!-- F2: Right hand lifted, tapping opposite shoulder -->
<g class="f2" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="150" cy="138" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="138" y1="144" x2="100" y2="158"/>
  <line x1="100" y1="158" x2="58" y2="196"/>
  <!-- Support arm -->
  <line x1="138" y1="146" x2="135" y2="200"/>
  <!-- Lifted arm to shoulder -->
  <line x1="138" y1="146" x2="146" y2="150"/>
  <!-- Feet -->
  <line x1="52" y1="200" x2="64" y2="196"/>
</g>

<!-- F3: Left hand lifted, tapping opposite shoulder -->
<g class="f3" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="150" cy="138" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="138" y1="144" x2="100" y2="158"/>
  <line x1="100" y1="158" x2="58" y2="196"/>
  <!-- Support arm -->
  <line x1="138" y1="146" x2="141" y2="200"/>
  <!-- Lifted arm crossing to shoulder -->
  <line x1="138" y1="146" x2="130" y2="152"/>
  <!-- Feet -->
  <line x1="52" y1="200" x2="64" y2="196"/>
</g>
</svg>
