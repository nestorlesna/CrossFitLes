<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<!-- Anchor point (band attached high on wall on the right) -->
<line x1="172" y1="30" x2="172" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<circle cx="172" cy="48" r="3" fill="#64748b"/>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#475569">HALF KNEEL BANDED LAT</text>

<!-- F1: Half kneel, arms reaching forward, torso upright -->
<g class="f1" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="80" cy="80" r="11" fill="#94a3b8" stroke="none"/>
  <!-- Torso upright -->
  <line x1="80" y1="91" x2="80" y2="150"/>
  <!-- Front leg (right, foot flat) -->
  <line x1="80" y1="150" x2="105" y2="170"/>
  <line x1="105" y1="170" x2="105" y2="200"/>
  <line x1="98" y1="200" x2="115" y2="200"/>
  <!-- Back leg kneeling -->
  <line x1="80" y1="150" x2="60" y2="180"/>
  <line x1="60" y1="180" x2="65" y2="200"/>
  <!-- Arms reaching toward anchor (up-right) -->
  <line x1="80" y1="105" x2="130" y2="70"/>
  <line x1="130" y1="70" x2="165" y2="55"/>
  <!-- Band as dashed line -->
  <line x1="165" y1="55" x2="172" y2="48" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="105" cy="170" r="4" fill="#64748b" stroke="none"/>
  <circle cx="60" cy="180" r="4" fill="#64748b" stroke="none"/>
</g>

<!-- F2: Slight lean to opposite side, lat starts stretching -->
<g class="f2" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="76" cy="82" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="78" y1="93" x2="84" y2="150"/>
  <line x1="84" y1="150" x2="105" y2="170"/>
  <line x1="105" y1="170" x2="105" y2="200"/>
  <line x1="98" y1="200" x2="115" y2="200"/>
  <line x1="84" y1="150" x2="62" y2="180"/>
  <line x1="62" y1="180" x2="67" y2="200"/>
  <!-- Arms more extended, torso tilting away -->
  <line x1="76" y1="105" x2="135" y2="62"/>
  <line x1="135" y1="62" x2="168" y2="50"/>
  <line x1="168" y1="50" x2="172" y2="48" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="105" cy="170" r="4" fill="#64748b" stroke="none"/>
  <circle cx="62" cy="180" r="4" fill="#64748b" stroke="none"/>
</g>

<!-- F3: Maximum lean, deep lat stretch -->
<g class="f3" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="68" cy="92" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="72" y1="100" x2="88" y2="150"/>
  <line x1="88" y1="150" x2="105" y2="170"/>
  <line x1="105" y1="170" x2="105" y2="200"/>
  <line x1="98" y1="200" x2="115" y2="200"/>
  <line x1="88" y1="150" x2="64" y2="180"/>
  <line x1="64" y1="180" x2="69" y2="200"/>
  <!-- Arms fully stretched toward anchor -->
  <line x1="68" y1="103" x2="140" y2="55"/>
  <line x1="140" y1="55" x2="170" y2="50"/>
  <line x1="170" y1="50" x2="172" y2="48" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="105" cy="170" r="4" fill="#64748b" stroke="none"/>
  <circle cx="64" cy="180" r="4" fill="#64748b" stroke="none"/>
</g>
</svg>
