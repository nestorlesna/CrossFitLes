<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<!-- Pared atrás -->
<line x1="40" y1="20" x2="40" y2="215" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: Sentadilla isométrica espalda en pared, kettlebells al costado -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="58" cy="90" r="13" fill="#94a3b8" stroke="none"/>
  <!-- Torso vertical pegado a pared -->
  <line x1="50" y1="103" x2="50" y2="155"/>
  <!-- Brazos colgando con kettlebells -->
  <line x1="50" y1="115" x2="80" y2="158"/>
  <line x1="50" y1="115" x2="20" y2="158"/>
  <!-- Cadera (codo del muslo) -->
  <!-- Muslo horizontal hacia el frente -->
  <line x1="50" y1="155" x2="120" y2="155"/>
  <!-- Pantorrilla vertical (90°) -->
  <line x1="120" y1="155" x2="120" y2="205"/>
  <line x1="120" y1="205" x2="135" y2="205"/>
  <!-- Kettlebells -->
  <path d="M 14,158 Q 14,167 20,170 Q 26,167 26,158 L 23,158 L 23,154 L 17,154 L 17,158 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 74,158 Q 74,167 80,170 Q 86,167 86,158 L 83,158 L 83,154 L 77,154 L 77,158 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="50" cy="155" r="5" fill="#64748b" stroke="none"/>
  <circle cx="120" cy="155" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- f2: Misma posición, leve tensión (kettlebells un poco más bajas por la gravedad) -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="58" cy="88" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="50" y1="101" x2="50" y2="154"/>
  <line x1="50" y1="113" x2="80" y2="160"/>
  <line x1="50" y1="113" x2="20" y2="160"/>
  <line x1="50" y1="154" x2="120" y2="154"/>
  <line x1="120" y1="154" x2="121" y2="205"/>
  <line x1="121" y1="205" x2="136" y2="205"/>
  <path d="M 14,160 Q 14,169 20,172 Q 26,169 26,160 L 23,160 L 23,156 L 17,156 L 17,160 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 74,160 Q 74,169 80,172 Q 86,169 86,160 L 83,160 L 83,156 L 77,156 L 77,160 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="50" cy="154" r="5" fill="#64748b" stroke="none"/>
  <circle cx="120" cy="154" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- f3: Igual posición (es isométrica) -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="58" cy="92" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="50" y1="105" x2="50" y2="156"/>
  <line x1="50" y1="117" x2="80" y2="159"/>
  <line x1="50" y1="117" x2="20" y2="159"/>
  <line x1="50" y1="156" x2="120" y2="156"/>
  <line x1="120" y1="156" x2="119" y2="205"/>
  <line x1="119" y1="205" x2="134" y2="205"/>
  <path d="M 14,159 Q 14,168 20,171 Q 26,168 26,159 L 23,159 L 23,155 L 17,155 L 17,159 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 74,159 Q 74,168 80,171 Q 86,168 86,159 L 83,159 L 83,155 L 77,155 L 77,159 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="50" cy="156" r="5" fill="#64748b" stroke="none"/>
  <circle cx="120" cy="156" r="5" fill="#64748b" stroke="none"/>
</g>

<text x="100" y="225" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">WALL SQUAT HOLD</text>
</svg>
