<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

  <!-- Frame 1: posicion de oso, cadera neutra -->
  <g class="f1">
    <circle cx="150" cy="130" r="12" fill="#94a3b8"/>
    <line x1="141" y1="138" x2="80" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="135" y1="150" x2="130" y2="200" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="150" x2="85" y2="195" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="80" y1="150" x2="60" y2="195" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="115" y1="150" x2="100" y2="195" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="60" cy="195" r="4" fill="#64748b"/>
    <circle cx="100" cy="195" r="4" fill="#64748b"/>
    <circle cx="130" cy="200" r="4" fill="#64748b"/>
    <circle cx="85" cy="195" r="4" fill="#64748b"/>
  </g>

  <!-- Frame 2: rodillas levemente elevadas, tension isometrica -->
  <g class="f2">
    <circle cx="150" cy="126" r="12" fill="#94a3b8"/>
    <line x1="141" y1="134" x2="80" y2="146" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="135" y1="146" x2="128" y2="200" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="146" x2="83" y2="192" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="80" y1="146" x2="58" y2="192" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="112" y1="146" x2="98" y2="192" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="58" cy="192" r="4" fill="#64748b"/>
    <circle cx="98" cy="192" r="4" fill="#64748b"/>
    <circle cx="128" cy="200" r="4" fill="#64748b"/>
    <circle cx="83" cy="192" r="4" fill="#64748b"/>
  </g>

  <!-- Frame 3: mismo hold, leve balanceo de manos -->
  <g class="f3">
    <circle cx="150" cy="130" r="12" fill="#94a3b8"/>
    <line x1="141" y1="138" x2="80" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="135" y1="150" x2="132" y2="200" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="150" x2="88" y2="195" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="80" y1="150" x2="65" y2="195" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="115" y1="150" x2="105" y2="195" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="65" cy="195" r="4" fill="#64748b"/>
    <circle cx="105" cy="195" r="4" fill="#64748b"/>
    <circle cx="132" cy="200" r="4" fill="#64748b"/>
    <circle cx="88" cy="195" r="4" fill="#64748b"/>
  </g>

  <text x="100" y="222" font-size="10" fill="#475569" text-anchor="middle" font-family="sans-serif">BEAR CRAWL HOLD</text>
</svg>
