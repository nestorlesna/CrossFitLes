<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="220" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="700" fill="#475569" letter-spacing="2">WALL BALL BOX OVER</text>
  <!-- Caja (visible en los 3 frames) -->
  <rect x="86" y="162" width="48" height="48" rx="2" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <!-- Frame 1: De pie a un costado del cajón, wall ball en el pecho -->
  <g class="f1">
    <circle cx="50" cy="118" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="50" y1="130" x2="50" y2="170"/>
      <!-- Brazos sosteniendo wall ball al pecho -->
      <line x1="50" y1="138" x2="36" y2="152"/>
      <line x1="50" y1="138" x2="64" y2="152"/>
      <!-- Piernas -->
      <line x1="50" y1="170" x2="42" y2="208"/>
      <line x1="50" y1="170" x2="58" y2="208"/>
    </g>
    <!-- Wall ball -->
    <circle cx="50" cy="148" r="14" fill="#ef4444" opacity="0.7"/>
    <circle cx="50" cy="148" r="14" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
  </g>
  <!-- Frame 2: Saltando por encima de la caja con la pelota -->
  <g class="f2">
    <circle cx="110" cy="70" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="110" y1="82" x2="110" y2="120"/>
      <!-- Brazos sosteniendo wall ball -->
      <line x1="110" y1="90" x2="96" y2="104"/>
      <line x1="110" y1="90" x2="124" y2="104"/>
      <!-- Piernas flexionadas en vuelo -->
      <line x1="110" y1="120" x2="92" y2="140"/><line x1="92" y1="140" x2="80" y2="155"/>
      <line x1="110" y1="120" x2="128" y2="140"/><line x1="128" y1="140" x2="140" y2="155"/>
    </g>
    <!-- Wall ball al pecho -->
    <circle cx="110" cy="100" r="14" fill="#ef4444" opacity="0.7"/>
    <circle cx="110" cy="100" r="14" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
  </g>
  <!-- Frame 3: Aterrizó del otro lado del cajón con la pelota -->
  <g class="f3">
    <circle cx="170" cy="118" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="170" y1="130" x2="170" y2="170"/>
      <!-- Brazos sosteniendo wall ball al pecho -->
      <line x1="170" y1="138" x2="156" y2="152"/>
      <line x1="170" y1="138" x2="184" y2="152"/>
      <!-- Piernas -->
      <line x1="170" y1="170" x2="162" y2="208"/>
      <line x1="170" y1="170" x2="178" y2="208"/>
    </g>
    <!-- Wall ball -->
    <circle cx="170" cy="148" r="14" fill="#ef4444" opacity="0.7"/>
    <circle cx="170" cy="148" r="14" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
  </g>
</svg>
