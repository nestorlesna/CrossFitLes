<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569">KB JUMPING LUNGE</text>

<!-- F1: Right leg forward lunge, KBs at sides -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="28" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="41" x2="100" y2="110"/>
  <!-- Arms with KBs at sides -->
  <line x1="86" y1="58" x2="76" y2="100"/>
  <circle cx="76" cy="108" r="8" fill="#64748b" stroke="none"/>
  <rect x="72" y="98" width="8" height="5" rx="2" fill="#475569" stroke="none"/>
  <line x1="114" y1="58" x2="124" y2="100"/>
  <circle cx="124" cy="108" r="8" fill="#64748b" stroke="none"/>
  <rect x="120" y="98" width="8" height="5" rx="2" fill="#475569" stroke="none"/>
  <!-- Right leg forward -->
  <line x1="100" y1="110" x2="128" y2="152"/>
  <line x1="128" y1="152" x2="138" y2="205"/>
  <circle cx="128" cy="152" r="5" fill="#64748b" stroke="none"/>
  <!-- Left leg back (rear knee near ground) -->
  <line x1="100" y1="110" x2="80" y2="148"/>
  <line x1="80" y1="148" x2="72" y2="205"/>
  <circle cx="80" cy="148" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- F2: Airborne – scissor jump, legs in mid-air -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="18" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="31" x2="100" y2="98"/>
  <!-- Arms slightly raised with KBs -->
  <line x1="86" y1="48" x2="76" y2="88"/>
  <circle cx="76" cy="96" r="8" fill="#64748b" stroke="none"/>
  <rect x="72" y="86" width="8" height="5" rx="2" fill="#475569" stroke="none"/>
  <line x1="114" y1="48" x2="124" y2="88"/>
  <circle cx="124" cy="96" r="8" fill="#64748b" stroke="none"/>
  <rect x="120" y="86" width="8" height="5" rx="2" fill="#475569" stroke="none"/>
  <!-- Legs in scissor – both bent, airborne -->
  <line x1="100" y1="98" x2="126" y2="132"/>
  <line x1="126" y1="132" x2="132" y2="168"/>
  <circle cx="126" cy="132" r="5" fill="#64748b" stroke="none"/>
  <line x1="100" y1="98" x2="74" y2="132"/>
  <line x1="74" y1="132" x2="68" y2="168"/>
  <circle cx="74" cy="132" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- F3: Left leg forward lunge (mirror of F1) -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="28" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="41" x2="100" y2="110"/>
  <!-- Arms with KBs at sides -->
  <line x1="86" y1="58" x2="76" y2="100"/>
  <circle cx="76" cy="108" r="8" fill="#64748b" stroke="none"/>
  <rect x="72" y="98" width="8" height="5" rx="2" fill="#475569" stroke="none"/>
  <line x1="114" y1="58" x2="124" y2="100"/>
  <circle cx="124" cy="108" r="8" fill="#64748b" stroke="none"/>
  <rect x="120" y="98" width="8" height="5" rx="2" fill="#475569" stroke="none"/>
  <!-- Left leg forward -->
  <line x1="100" y1="110" x2="72" y2="152"/>
  <line x1="72" y1="152" x2="62" y2="205"/>
  <circle cx="72" cy="152" r="5" fill="#64748b" stroke="none"/>
  <!-- Right leg back -->
  <line x1="100" y1="110" x2="120" y2="148"/>
  <line x1="120" y1="148" x2="128" y2="205"/>
  <circle cx="120" cy="148" r="5" fill="#64748b" stroke="none"/>
</g>
</svg>
