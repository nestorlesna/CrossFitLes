<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="220" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="700" fill="#475569" letter-spacing="2">DB BURPEE SNATCH</text>
  <!-- Frame 1: Plancha baja (push-up del burpee), mancuerna en el piso -->
  <g class="f1">
    <circle cx="40" cy="165" r="11" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Torso horizontal en plancha -->
      <line x1="48" y1="170" x2="160" y2="180"/>
      <!-- Brazo apoyado vertical -->
      <line x1="58" y1="172" x2="60" y2="200"/>
      <!-- Brazo agarrando mancuerna en el piso -->
      <line x1="40" y1="165" x2="22" y2="200"/>
      <!-- Piernas extendidas -->
      <line x1="160" y1="180" x2="190" y2="205"/>
    </g>
    <!-- Mancuerna en el piso -->
    <rect x="14" y="194" width="16" height="10" rx="2" fill="#64748b"/>
    <rect x="10" y="190" width="6" height="18" rx="1" fill="#475569"/>
    <rect x="28" y="190" width="6" height="18" rx="1" fill="#475569"/>
  </g>
  <!-- Frame 2: De pie con mancuerna a la cadera (transición) -->
  <g class="f2">
    <circle cx="100" cy="50" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="62" x2="100" y2="120"/>
      <!-- Brazo derecho colgando con mancuerna -->
      <line x1="100" y1="72" x2="100" y2="130"/>
      <!-- Brazo izquierdo al costado -->
      <line x1="100" y1="72" x2="78" y2="120"/>
      <!-- Piernas casi extendidas -->
      <line x1="100" y1="120" x2="86" y2="165"/><line x1="86" y1="165" x2="82" y2="208"/>
      <line x1="100" y1="120" x2="114" y2="165"/><line x1="114" y1="165" x2="118" y2="208"/>
    </g>
    <!-- Mancuerna a la altura del muslo -->
    <rect x="92" y="128" width="16" height="10" rx="2" fill="#64748b"/>
    <rect x="88" y="124" width="6" height="18" rx="1" fill="#475569"/>
    <rect x="106" y="124" width="6" height="18" rx="1" fill="#475569"/>
  </g>
  <!-- Frame 3: Snatch finish - mancuerna overhead con un solo brazo -->
  <g class="f3">
    <circle cx="100" cy="60" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="72" x2="100" y2="130"/>
      <!-- Brazo derecho extendido overhead con mancuerna -->
      <line x1="100" y1="76" x2="115" y2="30"/>
      <!-- Brazo izquierdo al costado para equilibrio -->
      <line x1="100" y1="76" x2="70" y2="100"/>
      <!-- Piernas con cadera extendida, ligera flexión -->
      <line x1="100" y1="130" x2="86" y2="170"/><line x1="86" y1="170" x2="82" y2="208"/>
      <line x1="100" y1="130" x2="114" y2="170"/><line x1="114" y1="170" x2="118" y2="208"/>
    </g>
    <!-- Mancuerna overhead -->
    <rect x="107" y="14" width="16" height="10" rx="2" fill="#64748b"/>
    <rect x="103" y="10" width="6" height="18" rx="1" fill="#475569"/>
    <rect x="121" y="10" width="6" height="18" rx="1" fill="#475569"/>
  </g>
</svg>
