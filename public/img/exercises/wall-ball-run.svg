<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="224" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="1">WALL BALL RUN</text>
  <!-- Frame 1: Mid stride, right leg forward, ball at chest -->
  <g class="f1">
    <circle cx="96" cy="30" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="98" y1="43" x2="100" y2="106"/>
      <line x1="100" y1="60" x2="82" y2="72"/>
      <line x1="100" y1="60" x2="118" y2="72"/>
      <line x1="100" y1="106" x2="122" y2="140"/><line x1="122" y1="140" x2="130" y2="205"/>
      <line x1="100" y1="106" x2="80" y2="130"/><line x1="80" y1="130" x2="66" y2="180"/>
    </g>
    <circle cx="100" cy="80" r="16" fill="#64748b"/>
  </g>
  <!-- Frame 2: Airborne stride switch, ball at chest -->
  <g class="f2">
    <circle cx="100" cy="26" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="39" x2="100" y2="102"/>
      <line x1="100" y1="56" x2="82" y2="68"/>
      <line x1="100" y1="56" x2="118" y2="68"/>
      <line x1="100" y1="102" x2="80" y2="120"/><line x1="80" y1="120" x2="66" y2="150"/>
      <line x1="100" y1="102" x2="118" y2="118"/><line x1="118" y1="118" x2="132" y2="148"/>
    </g>
    <circle cx="100" cy="76" r="16" fill="#64748b"/>
  </g>
  <!-- Frame 3: Mid stride, left leg forward, ball at chest -->
  <g class="f3">
    <circle cx="104" cy="30" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="102" y1="43" x2="100" y2="106"/>
      <line x1="100" y1="60" x2="82" y2="72"/>
      <line x1="100" y1="60" x2="118" y2="72"/>
      <line x1="100" y1="106" x2="78" y2="140"/><line x1="78" y1="140" x2="70" y2="205"/>
      <line x1="100" y1="106" x2="120" y2="130"/><line x1="120" y1="130" x2="134" y2="180"/>
    </g>
    <circle cx="100" cy="80" r="16" fill="#64748b"/>
  </g>
</svg>
