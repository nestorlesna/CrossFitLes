<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="240" height="200" fill="#111827" rx="12"/>
  <line x1="20" y1="170" x2="220" y2="170" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="188" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">BICYCLE CRUNCH</text>
  <!-- Frame 1: right elbow to left knee, right leg extended -->
  <g class="f1">
    <circle cx="78" cy="128" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- torso along floor, shoulders lifted -->
      <line x1="88" y1="124" x2="120" y2="132"/>
      <!-- right elbow crossing toward left knee -->
      <line x1="94" y1="124" x2="108" y2="116"/>
      <!-- left knee tucked in -->
      <line x1="120" y1="132" x2="118" y2="108"/><line x1="118" y1="108" x2="106" y2="120"/>
      <!-- right leg extended -->
      <line x1="120" y1="132" x2="152" y2="140"/><line x1="152" y1="140" x2="184" y2="146"/>
    </g>
    <circle cx="120" cy="132" r="5" fill="#64748b"/>
    <circle cx="118" cy="108" r="5" fill="#64748b"/>
    <circle cx="152" cy="140" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: neutral, both knees mid -->
  <g class="f2">
    <circle cx="78" cy="130" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="88" y1="128" x2="120" y2="134"/>
      <line x1="94" y1="126" x2="104" y2="112"/>
      <line x1="120" y1="134" x2="140" y2="116"/><line x1="140" y1="116" x2="150" y2="140"/>
      <line x1="120" y1="134" x2="140" y2="124"/><line x1="140" y1="124" x2="158" y2="140"/>
    </g>
    <circle cx="120" cy="134" r="5" fill="#64748b"/>
    <circle cx="140" cy="116" r="5" fill="#64748b"/>
    <circle cx="140" cy="124" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: left elbow to right knee, left leg extended -->
  <g class="f3">
    <circle cx="78" cy="128" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="88" y1="124" x2="120" y2="132"/>
      <line x1="94" y1="124" x2="108" y2="118"/>
      <!-- right knee tucked in -->
      <line x1="120" y1="132" x2="120" y2="106"/><line x1="120" y1="106" x2="108" y2="118"/>
      <!-- left leg extended -->
      <line x1="120" y1="132" x2="152" y2="142"/><line x1="152" y1="142" x2="184" y2="150"/>
    </g>
    <circle cx="120" cy="132" r="5" fill="#64748b"/>
    <circle cx="120" cy="106" r="5" fill="#64748b"/>
    <circle cx="152" cy="142" r="5" fill="#64748b"/>
  </g>
</svg>
