<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="16" y1="192" x2="184" y2="192" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">CLAMSHELL HOLD</text>

  <!-- Frame 1: de costado, rodillas juntas -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="30" cy="150" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="44" y1="162" x2="108" y2="166"/>
    <polyline points="108,166 154,180 122,190"/>
    <line x1="50" y1="164" x2="86" y2="184"/>
    <circle cx="154" cy="180" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: rodilla de arriba abriéndose -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="30" cy="150" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="44" y1="162" x2="108" y2="166"/>
    <polyline points="108,166 154,180 122,190"/>
    <polyline points="108,162 152,150 124,186"/>
    <line x1="50" y1="164" x2="86" y2="184"/>
    <circle cx="152" cy="150" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: apertura máxima sostenida -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="30" cy="150" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="44" y1="162" x2="108" y2="166"/>
    <polyline points="108,166 154,180 122,190"/>
    <polyline points="108,160 150,128 124,184"/>
    <line x1="50" y1="164" x2="86" y2="184"/>
    <circle cx="150" cy="128" r="4" fill="#64748b" stroke="none"/>
    <circle cx="146" cy="102" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="156" cy="106" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="166" cy="112" r="3" fill="#6ee7b7" stroke="none"/>
  </g>
</svg>
