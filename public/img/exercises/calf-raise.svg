<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="204" x2="170" y2="204" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">CALF RAISE</text>

<!-- F1: Talones apoyados, pie plano -->
<g class="f1" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="100" cy="46" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="58" x2="100" y2="124"/>
  <line x1="100" y1="70" x2="80" y2="118"/>
  <line x1="100" y1="70" x2="120" y2="118"/>
  <line x1="100" y1="124" x2="88" y2="166"/>
  <line x1="88" y1="166" x2="84" y2="204"/>
  <line x1="100" y1="124" x2="112" y2="166"/>
  <line x1="112" y1="166" x2="116" y2="204"/>
  <line x1="78" y1="204" x2="94" y2="204"/>
  <line x1="106" y1="204" x2="122" y2="204"/>
  <circle cx="88" cy="166" r="4" fill="#64748b" stroke="none"/>
  <circle cx="112" cy="166" r="4" fill="#64748b" stroke="none"/>
</g>

<!-- F2: Talones despegando, media subida -->
<g class="f2" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="100" cy="38" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="50" x2="100" y2="116"/>
  <line x1="100" y1="62" x2="80" y2="110"/>
  <line x1="100" y1="62" x2="120" y2="110"/>
  <line x1="100" y1="116" x2="88" y2="158"/>
  <line x1="88" y1="158" x2="84" y2="194"/>
  <line x1="100" y1="116" x2="112" y2="158"/>
  <line x1="112" y1="158" x2="116" y2="194"/>
  <line x1="84" y1="194" x2="96" y2="204"/>
  <line x1="116" y1="194" x2="128" y2="204"/>
  <circle cx="88" cy="158" r="4" fill="#64748b" stroke="none"/>
  <circle cx="112" cy="158" r="4" fill="#64748b" stroke="none"/>
</g>

<!-- F3: Extension completa, de puntas de pie -->
<g class="f3" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="100" cy="28" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="40" x2="100" y2="106"/>
  <line x1="100" y1="52" x2="80" y2="100"/>
  <line x1="100" y1="52" x2="120" y2="100"/>
  <line x1="100" y1="106" x2="88" y2="148"/>
  <line x1="88" y1="148" x2="84" y2="184"/>
  <line x1="100" y1="106" x2="112" y2="148"/>
  <line x1="112" y1="148" x2="116" y2="184"/>
  <line x1="84" y1="184" x2="98" y2="204"/>
  <line x1="116" y1="184" x2="130" y2="204"/>
  <circle cx="88" cy="148" r="4" fill="#64748b" stroke="none"/>
  <circle cx="112" cy="148" r="4" fill="#64748b" stroke="none"/>
</g>
</svg>
