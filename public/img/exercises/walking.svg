<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">WALKING</text>

  <!-- Frame 1: paso neutro, brazos relajados -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="26" r="14" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="40" x2="100" y2="106"/>
    <line x1="100" y1="55" x2="88" y2="88"/>
    <line x1="100" y1="55" x2="112" y2="88"/>
    <line x1="100" y1="106" x2="92" y2="158"/>
    <line x1="92" y1="158" x2="88" y2="205"/>
    <line x1="100" y1="106" x2="108" y2="158"/>
    <line x1="108" y1="158" x2="112" y2="205"/>
  </g>

  <!-- Frame 2: pierna derecha adelante, brazo izquierdo adelante -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="26" r="14" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="40" x2="100" y2="106"/>
    <line x1="100" y1="55" x2="118" y2="80"/>
    <line x1="100" y1="55" x2="82" y2="82"/>
    <line x1="100" y1="106" x2="116" y2="150"/>
    <line x1="116" y1="150" x2="122" y2="205"/>
    <line x1="100" y1="106" x2="84" y2="150"/>
    <line x1="84" y1="150" x2="76" y2="200"/>
  </g>

  <!-- Frame 3: pierna izquierda adelante, brazo derecho adelante -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="26" r="14" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="40" x2="100" y2="106"/>
    <line x1="100" y1="55" x2="82" y2="80"/>
    <line x1="100" y1="55" x2="118" y2="82"/>
    <line x1="100" y1="106" x2="84" y2="150"/>
    <line x1="84" y1="150" x2="78" y2="205"/>
    <line x1="100" y1="106" x2="116" y2="150"/>
    <line x1="116" y1="150" x2="124" y2="200"/>
  </g>
</svg>
