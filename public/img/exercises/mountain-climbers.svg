<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<line x1="25" y1="188" x2="175" y2="188" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: High plank position (side view, facing right) -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <!-- Head -->
  <circle cx="155" cy="96" r="12" fill="#94a3b8" stroke="none"/>
  <!-- Neck to shoulder -->
  <line x1="143" y1="100" x2="136" y2="106"/>
  <!-- Torso diagonal -->
  <line x1="136" y1="106" x2="72" y2="130"/>
  <!-- Near arm (straight down from shoulder) -->
  <line x1="136" y1="106" x2="128" y2="148"/>
  <line x1="128" y1="148" x2="120" y2="162"/>
  <line x1="110" y1="162" x2="130" y2="162"/>
  <!-- Both legs extended back -->
  <line x1="72" y1="130" x2="64" y2="162"/>
  <line x1="64" y1="162" x2="58" y2="188"/>
  <line x1="50" y1="188" x2="66" y2="188"/>
  <!-- Second leg slightly visible -->
  <line x1="76" y1="132" x2="70" y2="165"/>
  <line x1="70" y1="165" x2="64" y2="188"/>
</g>

<!-- f2: Right knee driven to chest (front knee) -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="155" cy="96" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="143" y1="100" x2="136" y2="106"/>
  <line x1="136" y1="106" x2="72" y2="130"/>
  <line x1="136" y1="106" x2="128" y2="148"/>
  <line x1="128" y1="148" x2="120" y2="162"/>
  <line x1="110" y1="162" x2="130" y2="162"/>
  <!-- Front knee driven up toward chest/arm -->
  <line x1="72" y1="130" x2="96" y2="148"/>
  <line x1="96" y1="148" x2="110" y2="148"/>
  <!-- Back leg still extended -->
  <line x1="76" y1="132" x2="66" y2="165"/>
  <line x1="66" y1="165" x2="60" y2="188"/>
  <line x1="52" y1="188" x2="68" y2="188"/>
  <!-- Knee dot -->
  <circle cx="96" cy="148" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- f3: Left knee driven to chest (alternating) -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="155" cy="96" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="143" y1="100" x2="136" y2="106"/>
  <line x1="136" y1="106" x2="72" y2="130"/>
  <line x1="136" y1="106" x2="128" y2="148"/>
  <line x1="128" y1="148" x2="120" y2="162"/>
  <line x1="110" y1="162" x2="130" y2="162"/>
  <!-- Other knee driven up -->
  <line x1="72" y1="130" x2="62" y2="165"/>
  <line x1="62" y1="165" x2="56" y2="188"/>
  <line x1="48" y1="188" x2="64" y2="188"/>
  <!-- This knee driven forward -->
  <line x1="76" y1="132" x2="100" y2="150"/>
  <line x1="100" y1="150" x2="115" y2="150"/>
  <circle cx="100" cy="150" r="5" fill="#64748b" stroke="none"/>
</g>

<text x="100" y="208" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">MOUNTAIN CLIMBERS</text>
</svg>
