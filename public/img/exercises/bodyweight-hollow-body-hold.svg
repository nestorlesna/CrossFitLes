<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="240" height="180" fill="#111827" rx="12"/>
  <line x1="20" y1="148" x2="220" y2="148" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="165" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">HOLLOW BODY HOLD</text>
  <!-- Frame 1: Boca arriba plano, brazos arriba, piernas extendidas -->
  <g class="f1">
    <circle cx="58" cy="138" r="11" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Cuerpo extendido completamente plano -->
      <line x1="66" y1="142" x2="210" y2="143"/>
      <!-- Brazos extendidos por encima de la cabeza, en el piso -->
      <line x1="58" y1="138" x2="32" y2="140"/>
      <line x1="32" y1="140" x2="22" y2="140"/>
      <!-- Pies -->
      <line x1="210" y1="143" x2="220" y2="143"/>
    </g>
  </g>
  <!-- Frame 2: Hollow parcial - extremos ligeramente elevados -->
  <g class="f2">
    <circle cx="58" cy="128" r="11" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Cuerpo levemente cóncavo, baja espalda pegada al piso -->
      <line x1="66" y1="132" x2="130" y2="140"/>
      <line x1="130" y1="140" x2="210" y2="128"/>
      <!-- Brazos extendidos atrás, ligeramente arriba -->
      <line x1="58" y1="128" x2="32" y2="120"/>
      <!-- Piernas elevadas suavemente -->
      <line x1="210" y1="128" x2="222" y2="120"/>
    </g>
  </g>
  <!-- Frame 3: Hollow profundo - cuerpo en plátano invertido -->
  <g class="f3">
    <circle cx="62" cy="118" r="11" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Cuerpo bien cóncavo, lumbar pegada al piso -->
      <line x1="70" y1="122" x2="130" y2="138"/>
      <line x1="130" y1="138" x2="210" y2="118"/>
      <!-- Brazos completamente extendidos arriba y atrás -->
      <line x1="62" y1="118" x2="30" y2="105"/>
      <line x1="30" y1="105" x2="20" y2="100"/>
      <!-- Piernas extendidas y elevadas a 30° -->
      <line x1="210" y1="118" x2="228" y2="105"/>
    </g>
  </g>
</svg>
