<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">BAND ALT PASS THROUGH</text>
  <!-- Frame 1: banda al frente, brazos parejos a la altura del pecho -->
  <g class="f1">
    <circle cx="100" cy="34" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="47" x2="100" y2="112"/>
      <line x1="100" y1="60" x2="68" y2="82"/>
      <line x1="100" y1="60" x2="132" y2="82"/>
      <line x1="94" y1="112" x2="90" y2="162"/><line x1="90" y1="162" x2="88" y2="208"/>
      <line x1="106" y1="112" x2="110" y2="162"/><line x1="110" y1="162" x2="112" y2="208"/>
    </g>
    <circle cx="90" cy="162" r="5" fill="#64748b"/>
    <circle cx="110" cy="162" r="5" fill="#64748b"/>
    <path d="M68 82 q32 14 64 0" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Frame 2: brazo derecho sube y pasa por detras, el izquierdo queda abajo -->
  <g class="f2">
    <circle cx="100" cy="34" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="47" x2="100" y2="112"/>
      <line x1="100" y1="60" x2="70" y2="104"/>
      <line x1="100" y1="60" x2="142" y2="26"/>
      <line x1="94" y1="112" x2="90" y2="162"/><line x1="90" y1="162" x2="88" y2="208"/>
      <line x1="106" y1="112" x2="110" y2="162"/><line x1="110" y1="162" x2="112" y2="208"/>
    </g>
    <circle cx="90" cy="162" r="5" fill="#64748b"/>
    <circle cx="110" cy="162" r="5" fill="#64748b"/>
    <path d="M70 104 q46 -50 72 -78" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Frame 3: se alterna, ahora sube el brazo izquierdo y baja el derecho -->
  <g class="f3">
    <circle cx="100" cy="34" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="47" x2="100" y2="112"/>
      <line x1="100" y1="60" x2="58" y2="26"/>
      <line x1="100" y1="60" x2="130" y2="104"/>
      <line x1="94" y1="112" x2="90" y2="162"/><line x1="90" y1="162" x2="88" y2="208"/>
      <line x1="106" y1="112" x2="110" y2="162"/><line x1="110" y1="162" x2="112" y2="208"/>
    </g>
    <circle cx="90" cy="162" r="5" fill="#64748b"/>
    <circle cx="110" cy="162" r="5" fill="#64748b"/>
    <path d="M58 26 q46 28 72 78" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>
  </g>
</svg>
