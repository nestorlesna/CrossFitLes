<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<!-- Anchor point (band attached high above) -->
<line x1="100" y1="8" x2="100" y2="18" stroke="#374151" stroke-width="3"/>
<circle cx="100" cy="18" r="3" fill="#64748b"/>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#475569">BANDED TRICEPS EXT</text>

<!-- F1: Elbows up high, hands behind head (start, band stretched) -->
<g class="f1" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="100" cy="60" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="72" x2="100" y2="140"/>
  <!-- Upper arms pointing up -->
  <line x1="100" y1="80" x2="82" y2="50"/>
  <line x1="100" y1="80" x2="118" y2="50"/>
  <!-- Forearms bent down behind head -->
  <line x1="82" y1="50" x2="92" y2="78"/>
  <line x1="118" y1="50" x2="108" y2="78"/>
  <!-- Band from hands up to anchor -->
  <line x1="92" y1="78" x2="98" y2="20" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="108" y1="78" x2="102" y2="20" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="82" cy="50" r="4" fill="#64748b" stroke="none"/>
  <circle cx="118" cy="50" r="4" fill="#64748b" stroke="none"/>
  <!-- Legs -->
  <line x1="100" y1="140" x2="88" y2="178"/>
  <line x1="88" y1="178" x2="85" y2="205"/>
  <line x1="100" y1="140" x2="112" y2="178"/>
  <line x1="112" y1="178" x2="115" y2="205"/>
  <line x1="77" y1="205" x2="93" y2="205"/>
  <line x1="107" y1="205" x2="123" y2="205"/>
</g>

<!-- F2: Mid extension, arms at ~135° -->
<g class="f2" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="100" cy="60" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="72" x2="100" y2="140"/>
  <line x1="100" y1="80" x2="82" y2="50"/>
  <line x1="100" y1="80" x2="118" y2="50"/>
  <!-- Forearms half extended -->
  <line x1="82" y1="50" x2="80" y2="28"/>
  <line x1="118" y1="50" x2="120" y2="28"/>
  <!-- Band -->
  <line x1="80" y1="28" x2="98" y2="20" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="120" y1="28" x2="102" y2="20" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="82" cy="50" r="4" fill="#64748b" stroke="none"/>
  <circle cx="118" cy="50" r="4" fill="#64748b" stroke="none"/>
  <line x1="100" y1="140" x2="88" y2="178"/>
  <line x1="88" y1="178" x2="85" y2="205"/>
  <line x1="100" y1="140" x2="112" y2="178"/>
  <line x1="112" y1="178" x2="115" y2="205"/>
  <line x1="77" y1="205" x2="93" y2="205"/>
  <line x1="107" y1="205" x2="123" y2="205"/>
</g>

<!-- F3: Full extension, arms straight overhead (end, band relaxed) -->
<g class="f3" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="100" cy="60" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="72" x2="100" y2="140"/>
  <!-- Arms straight up (extended) -->
  <line x1="100" y1="80" x2="90" y2="30"/>
  <line x1="100" y1="80" x2="110" y2="30"/>
  <!-- Band -->
  <line x1="90" y1="30" x2="98" y2="22" stroke="#64748b" stroke-width="2"/>
  <line x1="110" y1="30" x2="102" y2="22" stroke="#64748b" stroke-width="2"/>
  <line x1="100" y1="140" x2="88" y2="178"/>
  <line x1="88" y1="178" x2="85" y2="205"/>
  <line x1="100" y1="140" x2="112" y2="178"/>
  <line x1="112" y1="178" x2="115" y2="205"/>
  <line x1="77" y1="205" x2="93" y2="205"/>
  <line x1="107" y1="205" x2="123" y2="205"/>
</g>
</svg>
