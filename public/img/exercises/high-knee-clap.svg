<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="240" height="200" fill="#111827" rx="12"/>
  <line x1="20" y1="170" x2="220" y2="170" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="188" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">HIGH KNEE CLAP</text>
  <!-- Frame 1: left knee high, hands clap under thigh -->
  <g class="f1">
    <circle cx="118" cy="44" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="118" y1="56" x2="120" y2="106"/>
      <!-- hands meeting under the raised thigh -->
      <line x1="118" y1="66" x2="104" y2="94"/><line x1="104" y1="94" x2="98" y2="106"/>
      <line x1="118" y1="66" x2="112" y2="96"/><line x1="112" y1="96" x2="98" y2="106"/>
      <!-- right leg planted -->
      <line x1="120" y1="106" x2="130" y2="140"/><line x1="130" y1="140" x2="132" y2="168"/>
      <!-- left knee high -->
      <line x1="120" y1="106" x2="100" y2="100"/><line x1="100" y1="100" x2="92" y2="122"/>
    </g>
    <circle cx="120" cy="106" r="5" fill="#64748b"/>
    <circle cx="100" cy="100" r="5" fill="#64748b"/>
    <circle cx="130" cy="140" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: standing, hands high -->
  <g class="f2">
    <circle cx="120" cy="44" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="120" y1="56" x2="120" y2="108"/>
      <line x1="120" y1="64" x2="106" y2="46"/><line x1="120" y1="64" x2="134" y2="46"/>
      <line x1="120" y1="108" x2="112" y2="140"/><line x1="112" y1="140" x2="110" y2="168"/>
      <line x1="120" y1="108" x2="128" y2="140"/><line x1="128" y1="140" x2="130" y2="168"/>
    </g>
    <circle cx="120" cy="108" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: right knee high, hands clap under thigh -->
  <g class="f3">
    <circle cx="122" cy="44" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="122" y1="56" x2="120" y2="106"/>
      <line x1="122" y1="66" x2="136" y2="94"/><line x1="136" y1="94" x2="142" y2="106"/>
      <line x1="122" y1="66" x2="128" y2="96"/><line x1="128" y1="96" x2="142" y2="106"/>
      <line x1="120" y1="106" x2="110" y2="140"/><line x1="110" y1="140" x2="108" y2="168"/>
      <line x1="120" y1="106" x2="140" y2="100"/><line x1="140" y1="100" x2="148" y2="122"/>
    </g>
    <circle cx="120" cy="106" r="5" fill="#64748b"/>
    <circle cx="140" cy="100" r="5" fill="#64748b"/>
    <circle cx="110" cy="140" r="5" fill="#64748b"/>
  </g>
</svg>
