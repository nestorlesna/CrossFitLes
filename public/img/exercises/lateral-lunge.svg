<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: Standing with dumbbells -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="26" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="40" x2="100" y2="108"/>
  <line x1="100" y1="54" x2="76" y2="80"/>
  <line x1="100" y1="54" x2="124" y2="80"/>
  <line x1="94" y1="108" x2="80" y2="162"/>
  <line x1="80" y1="162" x2="78" y2="210"/>
  <line x1="106" y1="108" x2="120" y2="162"/>
  <line x1="120" y1="162" x2="122" y2="210"/>
  <circle cx="70" cy="80" r="7" fill="#64748b" stroke="none"/>
  <circle cx="130" cy="80" r="7" fill="#64748b" stroke="none"/>
</g>

<!-- f2: Deep lateral lunge to the right -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="104" cy="44" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="104" y1="58" x2="103" y2="120"/>
  <line x1="103" y1="74" x2="82" y2="98"/>
  <line x1="103" y1="74" x2="124" y2="98"/>
  <!-- Right leg: bent far right, knee at floor level -->
  <line x1="108" y1="120" x2="158" y2="168"/>
  <line x1="158" y1="168" x2="162" y2="210"/>
  <!-- Left leg: extended far left, nearly straight -->
  <line x1="98" y1="120" x2="44" y2="180"/>
  <line x1="44" y1="180" x2="40" y2="210"/>
  <circle cx="76" cy="98" r="7" fill="#64748b" stroke="none"/>
  <circle cx="130" cy="98" r="7" fill="#64748b" stroke="none"/>
</g>

<!-- f3: Returning, still mid-lunge -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="101" cy="35" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="101" y1="49" x2="100" y2="114"/>
  <line x1="100" y1="64" x2="79" y2="89"/>
  <line x1="100" y1="64" x2="121" y2="89"/>
  <!-- Right leg: less bent, returning -->
  <line x1="105" y1="114" x2="143" y2="165"/>
  <line x1="143" y1="165" x2="145" y2="210"/>
  <!-- Left leg: still extended, returning -->
  <line x1="95" y1="114" x2="57" y2="174"/>
  <line x1="57" y1="174" x2="53" y2="210"/>
  <circle cx="73" cy="89" r="7" fill="#64748b" stroke="none"/>
  <circle cx="127" cy="89" r="7" fill="#64748b" stroke="none"/>
</g>

<text x="100" y="225" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">LATERAL LUNGE</text>
</svg>
