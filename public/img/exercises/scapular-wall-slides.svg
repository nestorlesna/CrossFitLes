<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<!-- Wall indicator -->
<line x1="168" y1="20" x2="168" y2="215" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: Arms in W position (elbows at shoulder height, hands above elbows) -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="38" r="14" fill="#94a3b8" stroke="none"/>
  <!-- Torso -->
  <line x1="100" y1="52" x2="100" y2="130"/>
  <!-- Legs -->
  <line x1="94" y1="130" x2="86" y2="175"/>
  <line x1="86" y1="175" x2="84" y2="210"/>
  <line x1="106" y1="130" x2="114" y2="175"/>
  <line x1="114" y1="175" x2="116" y2="210"/>
  <!-- Arms in W: elbows out at shoulder height, forearms up -->
  <!-- Left arm: shoulder→elbow (out-left), elbow→hand (up) -->
  <line x1="100" y1="68" x2="68" y2="90"/>
  <line x1="68" y1="90" x2="72" y2="60"/>
  <!-- Right arm: shoulder→elbow (out-right), elbow→hand (up) -->
  <line x1="100" y1="68" x2="132" y2="90"/>
  <line x1="132" y1="90" x2="128" y2="60"/>
  <!-- Elbow dots -->
  <circle cx="68" cy="90" r="5" fill="#64748b" stroke="none"/>
  <circle cx="132" cy="90" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- f2: Arms in Y position (partially raised, mid-slide) -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="38" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="52" x2="100" y2="130"/>
  <line x1="94" y1="130" x2="86" y2="175"/>
  <line x1="86" y1="175" x2="84" y2="210"/>
  <line x1="106" y1="130" x2="114" y2="175"/>
  <line x1="114" y1="175" x2="116" y2="210"/>
  <!-- Arms in Y: raised at ~120° -->
  <line x1="100" y1="65" x2="72" y2="42"/>
  <line x1="100" y1="65" x2="128" y2="42"/>
  <!-- Elbow dots -->
  <circle cx="72" cy="42" r="5" fill="#64748b" stroke="none"/>
  <circle cx="128" cy="42" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- f3: Arms fully overhead (I position) -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="38" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="52" x2="100" y2="130"/>
  <line x1="94" y1="130" x2="86" y2="175"/>
  <line x1="86" y1="175" x2="84" y2="210"/>
  <line x1="106" y1="130" x2="114" y2="175"/>
  <line x1="114" y1="175" x2="116" y2="210"/>
  <!-- Arms straight overhead -->
  <line x1="100" y1="66" x2="85" y2="22"/>
  <line x1="100" y1="66" x2="115" y2="22"/>
</g>

<text x="96" y="225" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">SCAPULAR WALL SLIDES</text>
</svg>
