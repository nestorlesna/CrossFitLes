    <line x1="44" y1="86" x2="176" y2="86" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="78" width="8" height="16" rx="2" fill="#475569"/><rect x="176" y="78" width="8" height="16" rx="2" fill="#475569"/>
    <circle cx="110" cy="66" r="12" fill="#94a3b8"/>
