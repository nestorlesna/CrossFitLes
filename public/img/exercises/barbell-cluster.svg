<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230">
  <style>
    .f1{animation:sh1 9.1s linear infinite}.f2{animation:sh2 9.1s linear infinite}.f3{animation:sh3 9.1s linear infinite}.f4{animation:sh4 9.1s linear infinite}.f5{animation:sh5 9.1s linear infinite}.f6{animation:sh6 9.1s linear infinite}.f7{animation:sh7 9.1s linear infinite}
    @keyframes sh1{0%,11.4%{opacity:1}14.3%,97.1%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,14.3%{opacity:0}17.1%,25.7%{opacity:1}28.6%,100%{opacity:0}}
    @keyframes sh3{0%,28.6%{opacity:0}31.4%,40%{opacity:1}42.9%,100%{opacity:0}}
    @keyframes sh4{0%,42.9%{opacity:0}45.7%,54.3%{opacity:1}57.1%,100%{opacity:0}}
    @keyframes sh5{0%,57.1%{opacity:0}60%,68.6%{opacity:1}71.4%,100%{opacity:0}}
    @keyframes sh6{0%,71.4%{opacity:0}74.3%,82.9%{opacity:1}85.7%,100%{opacity:0}}
    @keyframes sh7{0%,85.7%{opacity:0}88.6%,97.1%{opacity:1}100%,100%{opacity:0}}
  </style>
  <rect width="220" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">CLUSTER</text>
  <!-- Frame 1: setup, barra en el piso -->
  <g class="f1">
    <circle cx="110" cy="74" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="110,86 110,140"/>
      <polyline points="90,98 130,98"/>
      <polyline points="90,98 76,185"/>
      <polyline points="130,98 144,185"/>
      <polyline points="104,140 98,176 88,210"/>
      <polyline points="116,140 122,176 132,210"/>
    </g>
    <circle cx="98" cy="176" r="5" fill="#64748b"/>
    <circle cx="122" cy="176" r="5" fill="#64748b"/>
    <line x1="44" y1="185" x2="176" y2="185" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="177" width="8" height="16" rx="2" fill="#475569"/><rect x="176" y="177" width="8" height="16" rx="2" fill="#475569"/>
  </g>
  <!-- Frame 2: primera tracción, barra a las rodillas -->
  <g class="f2">
