    <circle cx="86" cy="176" r="5" fill="#64748b"/>
    <circle cx="134" cy="176" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 6: bloqueo overhead (thruster) -->
  <g class="f6">
    <circle cx="110" cy="32" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
