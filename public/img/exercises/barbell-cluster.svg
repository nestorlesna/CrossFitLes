    <rect x="36" y="144" width="8" height="16" rx="2" fill="#475569"/><rect x="176" y="144" width="8" height="16" rx="2" fill="#475569"/>
  </g>
  <!-- Frame 3: triple extensión, en puntas de pie -->
  <g class="f3">
