      <polyline points="90,56 130,56"/>
      <polyline points="90,56 84,34 86,14"/>
      <polyline points="130,56 136,34 134,14"/>
      <polyline points="104,110 102,158 94,210"/>
      <polyline points="116,110 118,158 126,210"/>
