    <rect x="36" y="6" width="8" height="16" rx="2" fill="#475569"/><rect x="176" y="6" width="8" height="16" rx="2" fill="#475569"/>
  </g>
  <!-- Frame 7: baja la barra a la cadera -->
  <g class="f7">
    <circle cx="110" cy="32" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="110,44 110,110"/>
      <polyline points="90,56 130,56"/>
      <polyline points="90,56 84,112"/>
      <polyline points="130,56 136,112"/>
      <polyline points="104,110 102,158 94,210"/>
      <polyline points="116,110 118,158 126,210"/>
