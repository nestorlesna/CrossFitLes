<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">SANDBAG CARRY</text>

  <!-- Frame 1: de pie, sandbag contra el pecho, paso neutro -->
  <g class="f1">
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="100" cy="26" r="14" fill="#94a3b8" stroke="none"/>
      <line x1="100" y1="40" x2="100" y2="106"/>
      <line x1="100" y1="60" x2="80" y2="82"/>
      <line x1="100" y1="60" x2="120" y2="82"/>
      <line x1="100" y1="106" x2="90" y2="160"/>
      <line x1="90" y1="160" x2="86" y2="205"/>
      <line x1="100" y1="106" x2="110" y2="160"/>
      <line x1="110" y1="160" x2="114" y2="205"/>
    </g>
    <rect x="76" y="66" width="48" height="34" rx="14" fill="#a16207" stroke="#78350f" stroke-width="2"/>
  </g>

  <!-- Frame 2: zancada adelante, pierna derecha al frente -->
  <g class="f2">
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="102" cy="26" r="14" fill="#94a3b8" stroke="none"/>
      <line x1="102" y1="40" x2="100" y2="106"/>
      <line x1="100" y1="60" x2="80" y2="80"/>
      <line x1="100" y1="60" x2="120" y2="80"/>
      <line x1="100" y1="106" x2="118" y2="150"/>
      <line x1="118" y1="150" x2="128" y2="205"/>
      <line x1="100" y1="106" x2="78" y2="150"/>
      <line x1="78" y1="150" x2="66" y2="200"/>
    </g>
    <rect x="76" y="64" width="48" height="34" rx="14" fill="#a16207" stroke="#78350f" stroke-width="2"/>
  </g>

  <!-- Frame 3: zancada opuesta, pierna izquierda al frente -->
  <g class="f3">
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="98" cy="26" r="14" fill="#94a3b8" stroke="none"/>
      <line x1="98" y1="40" x2="100" y2="106"/>
      <line x1="100" y1="60" x2="80" y2="80"/>
      <line x1="100" y1="60" x2="120" y2="80"/>
      <line x1="100" y1="106" x2="82" y2="150"/>
      <line x1="82" y1="150" x2="72" y2="205"/>
      <line x1="100" y1="106" x2="122" y2="150"/>
      <line x1="122" y1="150" x2="134" y2="200"/>
    </g>
    <rect x="76" y="64" width="48" height="34" rx="14" fill="#a16207" stroke="#78350f" stroke-width="2"/>
  </g>
</svg>
