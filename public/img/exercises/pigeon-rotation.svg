<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230">
  <style>
    .f1{animation:sh1 6.5s linear infinite}.f2{animation:sh2 6.5s linear infinite}.f3{animation:sh3 6.5s linear infinite}.f4{animation:sh4 6.5s linear infinite}.f5{animation:sh5 6.5s linear infinite}
    @keyframes sh1{0%,16%{opacity:1}20%,96%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,20%{opacity:0}24%,36%{opacity:1}40%,100%{opacity:0}}
    @keyframes sh3{0%,40%{opacity:0}44%,56%{opacity:1}60%,100%{opacity:0}}
    @keyframes sh4{0%,60%{opacity:0}64%,76%{opacity:1}80%,100%{opacity:0}}
    @keyframes sh5{0%,80%{opacity:0}84%,96%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="220" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">PIGEON ROTATION</text>
  <!-- Frame 1: pigeon, torso erguido, manos al piso -->
  <g class="f1">
    <circle cx="122" cy="100" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="100,192 118,138"/>
      <polyline points="118,140 132,170 134,204"/>
      <polyline points="100,192 142,184 100,203"/>
      <polyline points="100,192 68,200 34,203"/>
    </g>
    <circle cx="142" cy="184" r="4" fill="#64748b"/>
    <circle cx="132" cy="170" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 2: rotacion, el brazo se abre -->
  <g class="f2">
    <circle cx="124" cy="102" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="100,192 120,140"/>
      <polyline points="120,142 146,126 158,100"/>
      <polyline points="100,192 142,184 100,203"/>
      <polyline points="100,192 68,200 34,203"/>
    </g>
    <circle cx="142" cy="184" r="4" fill="#64748b"/>
    <circle cx="146" cy="126" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 3: rotacion maxima, brazo arriba -->
  <g class="f3">
    <circle cx="126" cy="104" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="100,192 122,142"/>
      <polyline points="122,144 144,112 150,76"/>
      <polyline points="100,192 142,184 100,203"/>
      <polyline points="100,192 68,200 34,203"/>
    </g>
    <circle cx="142" cy="184" r="4" fill="#64748b"/>
    <circle cx="144" cy="112" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 4: rotacion maxima, mirada al brazo -->
  <g class="f4">
    <circle cx="130" cy="100" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="100,192 122,142"/>
      <polyline points="122,144 132,106 126,70"/>
      <polyline points="100,192 142,184 100,203"/>
      <polyline points="100,192 68,200 34,203"/>
    </g>
    <circle cx="142" cy="184" r="4" fill="#64748b"/>
    <circle cx="132" cy="106" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 5: vuelve, el brazo baja -->
  <g class="f5">
    <circle cx="124" cy="102" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="100,192 120,140"/>
      <polyline points="120,142 140,160 140,200"/>
      <polyline points="100,192 142,184 100,203"/>
      <polyline points="100,192 68,200 34,203"/>
    </g>
    <circle cx="142" cy="184" r="4" fill="#64748b"/>
    <circle cx="140" cy="160" r="4" fill="#64748b"/>
  </g>
</svg>
