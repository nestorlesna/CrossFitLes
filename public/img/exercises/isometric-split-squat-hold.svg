<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <rect width="200" height="230" fill="#111827" rx="12" stroke="none"/>
  <style>
    .f1{animation:sh1 4s linear infinite}
    .f2{animation:sh2 4s linear infinite}
    .f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>

  <!-- Frame 1: descenso hacia la posición de split squat -->
  <g class="f1" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
    <circle cx="100" cy="30" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="43" x2="100" y2="100"/>
    <line x1="100" y1="58" x2="70" y2="86"/>
    <line x1="100" y1="58" x2="130" y2="86"/>
    <rect x="62" y="84" width="16" height="6" fill="#64748b" rx="2" stroke="none"/>
    <rect x="122" y="84" width="16" height="6" fill="#64748b" rx="2" stroke="none"/>
    <line x1="100" y1="100" x2="82" y2="148"/>
    <line x1="82" y1="148" x2="80" y2="200"/>
    <line x1="100" y1="100" x2="128" y2="148"/>
    <line x1="128" y1="148" x2="130" y2="200"/>
    <line x1="73" y1="200" x2="87" y2="200"/>
    <line x1="123" y1="200" x2="137" y2="200"/>
  </g>

  <!-- Frame 2: bajando, casi asentado -->
  <g class="f2" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
    <circle cx="100" cy="40.7" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="53.7" x2="100" y2="112"/>
    <line x1="100" y1="67.3" x2="68.7" y2="96.7"/>
    <line x1="100" y1="67.3" x2="131.3" y2="96.7"/>
    <rect x="60.7" y="94.7" width="16" height="6" fill="#64748b" rx="2" stroke="none"/>
    <rect x="123.3" y="94.7" width="16" height="6" fill="#64748b" rx="2" stroke="none"/>
    <line x1="100" y1="112" x2="77.3" y2="154.7"/>
    <line x1="77.3" y1="154.7" x2="74.7" y2="200"/>
    <line x1="100" y1="112" x2="130.7" y2="152.7"/>
    <line x1="130.7" y1="152.7" x2="136.7" y2="193.3"/>
    <line x1="67.7" y1="200" x2="81.7" y2="200"/>
    <circle cx="140" cy="190" r="5" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: hold completo, muslo delantero paralelo al piso -->
  <g class="f3" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
    <circle cx="100" cy="46" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="59" x2="100" y2="118"/>
    <line x1="100" y1="72" x2="68" y2="103"/>
    <line x1="100" y1="72" x2="132" y2="101"/>
    <rect x="60" y="101" width="16" height="6" fill="#64748b" rx="2" stroke="none"/>
    <rect x="124" y="99" width="16" height="6" fill="#64748b" rx="2" stroke="none"/>
    <line x1="100" y1="118" x2="75" y2="159"/>
    <line x1="75" y1="159" x2="72" y2="200"/>
    <line x1="100" y1="118" x2="132" y2="154"/>
    <line x1="132" y1="154" x2="140" y2="189"/>
    <line x1="65" y1="200" x2="79" y2="200"/>
    <circle cx="140" cy="189" r="5" fill="#64748b" stroke="none"/>
  </g>

  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle" letter-spacing="0.5">ISOMETRIC SPLIT SQUAT</text>
</svg>
