<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="180" x2="180" y2="180" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">SIDE PLANK</text>

  <!-- Frame 1: cadera hundida (entrada al ejercicio) -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="42" cy="112" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="22" y1="178" x2="50" y2="178"/>
    <line x1="50" y1="178" x2="52" y2="130"/>
    <polyline points="52,130 108,168 172,176"/>
    <line x1="52" y1="130" x2="70" y2="102"/>
    <circle cx="50" cy="178" r="4" fill="#64748b" stroke="none"/>
    <circle cx="172" cy="176" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: línea recta, brazo libre en la cintura -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="42" cy="104" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="22" y1="178" x2="50" y2="178"/>
    <line x1="50" y1="178" x2="52" y2="122"/>
    <line x1="52" y1="122" x2="172" y2="174"/>
    <polyline points="52,122 82,120 96,142"/>
    <circle cx="50" cy="178" r="4" fill="#64748b" stroke="none"/>
    <circle cx="172" cy="174" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: hold, brazo libre extendido al techo -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="42" cy="104" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="22" y1="178" x2="50" y2="178"/>
    <line x1="50" y1="178" x2="52" y2="122"/>
    <line x1="52" y1="122" x2="172" y2="174"/>
    <line x1="52" y1="122" x2="60" y2="58"/>
    <circle cx="50" cy="178" r="4" fill="#64748b" stroke="none"/>
    <circle cx="172" cy="174" r="4" fill="#64748b" stroke="none"/>
    <circle cx="104" cy="130" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="114" cy="134" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="124" cy="138" r="3" fill="#6ee7b7" stroke="none"/>
  </g>
</svg>
