      <line x1="110" y1="46" x2="114" y2="98"/>
      <line x1="110" y1="112" x2="110" y2="162"/><line x1="110" y1="162" x2="80" y2="202"/>
      <line x1="78" y1="206" x2="92" y2="206"/>
      <line x1="110" y1="112" x2="140" y2="152"/><line x1="140" y1="152" x2="140" y2="202"/>
      <line x1="138" y1="206" x2="152" y2="206"/>
