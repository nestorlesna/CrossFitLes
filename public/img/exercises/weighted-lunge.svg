  <line x1="20" y1="210" x2="180" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569" letter-spacing="0.5">WEIGHTED LUNGE</text>
</svg>
