      <line x1="104" y1="46" x2="108" y2="98"/>
      <line x1="104" y1="112" x2="105.9" y2="162"/><line x1="105.9" y1="162" x2="76" y2="202"/>
      <line x1="74" y1="206" x2="88" y2="206"/>
      <line x1="104" y1="112" x2="133.3" y2="152.5"/><line x1="133.3" y1="152.5" x2="126" y2="202"/>
      <line x1="124" y1="206" x2="138" y2="206"/>
