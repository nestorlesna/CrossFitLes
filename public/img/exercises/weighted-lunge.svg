      <line x1="36" y1="192" x2="46" y2="206"/>
      <line x1="98" y1="156" x2="147.8" y2="152"/><line x1="147.8" y1="152" x2="146" y2="202"/>
      <line x1="144" y1="206" x2="158" y2="206"/>
    </g>
