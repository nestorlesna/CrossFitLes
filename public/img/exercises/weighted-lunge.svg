      <line x1="100" y1="68" x2="104" y2="120"/>
      <line x1="100" y1="134" x2="96.5" y2="183.9"/><line x1="96.5" y1="183.9" x2="48" y2="196"/>
      <line x1="48" y1="196" x2="58" y2="206"/>
      <line x1="100" y1="134" x2="146.6" y2="152"/><line x1="146.6" y1="152" x2="146" y2="202"/>
      <line x1="144" y1="206" x2="158" y2="206"/>
