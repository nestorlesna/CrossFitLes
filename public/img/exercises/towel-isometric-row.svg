<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="16" y1="196" x2="184" y2="196" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">TOWEL ISO ROW</text>

  <!-- Frame 1: sentado, brazos extendidos, toalla tensa -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="56" cy="72" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="56" y1="85" x2="52" y2="168"/>
    <polyline points="52,168 108,150 148,190"/>
    <line x1="56" y1="102" x2="128" y2="150"/>
    <path d="M128,150 L152,188" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="108" cy="150" r="4" fill="#64748b" stroke="none"/>
    <circle cx="128" cy="150" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: tirando, codos hacia atrás -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="56" cy="66" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="56" y1="79" x2="52" y2="168"/>
    <polyline points="52,168 108,150 148,190"/>
    <polyline points="56,96 34,126 96,142"/>
    <path d="M96,142 L152,188" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="34" cy="126" r="4" fill="#64748b" stroke="none"/>
    <circle cx="96" cy="142" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: tensión máxima sostenida -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="56" cy="66" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="56" y1="79" x2="52" y2="168"/>
    <polyline points="52,168 108,150 148,190"/>
    <polyline points="56,96 32,124 94,140"/>
    <path d="M94,140 L152,188" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="32" cy="124" r="4" fill="#64748b" stroke="none"/>
    <circle cx="94" cy="140" r="4" fill="#64748b" stroke="none"/>
    <circle cx="96" cy="60" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="108" cy="60" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="120" cy="60" r="3" fill="#6ee7b7" stroke="none"/>
  </g>
</svg>
