<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

  <!-- Frame 1: sentado, cabeza erguida, inhala -->
  <g class="f1" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="92" cy="130" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="98" y1="188" x2="94" y2="144"/>
    <line x1="98" y1="188" x2="140" y2="176"/>
    <line x1="140" y1="176" x2="146" y2="208"/>
    <line x1="96" y1="152" x2="134" y2="172"/>
    <circle cx="98" cy="188" r="3" fill="#64748b" stroke="none"/>
    <circle cx="140" cy="176" r="3" fill="#64748b" stroke="none"/>
    <text x="120" y="86" font-family="Arial, sans-serif" font-size="16" fill="#475569" font-weight="bold">z</text>
  </g>

  <!-- Frame 2: cabeza baja, descansa -->
  <g class="f2" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="94" cy="138" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="98" y1="188" x2="96" y2="150"/>
    <line x1="98" y1="188" x2="140" y2="176"/>
    <line x1="140" y1="176" x2="146" y2="208"/>
    <line x1="98" y1="156" x2="134" y2="172"/>
    <circle cx="98" cy="188" r="3" fill="#64748b" stroke="none"/>
    <circle cx="140" cy="176" r="3" fill="#64748b" stroke="none"/>
    <text x="118" y="72" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="bold">z</text>
  </g>

  <!-- Frame 3: cabeza vuelve a subir, exhala -->
  <g class="f3" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="92" cy="132" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="98" y1="188" x2="94" y2="146"/>
    <line x1="98" y1="188" x2="140" y2="176"/>
    <line x1="140" y1="176" x2="146" y2="208"/>
    <line x1="96" y1="154" x2="134" y2="172"/>
    <circle cx="98" cy="188" r="3" fill="#64748b" stroke="none"/>
    <circle cx="140" cy="176" r="3" fill="#64748b" stroke="none"/>
    <text x="116" y="58" font-family="Arial, sans-serif" font-size="24" fill="#475569" font-weight="bold">z</text>
  </g>

  <text x="100" y="224" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">DESCANSO</text>
</svg>
