<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<!-- F1: Media rodilla neutral, tronco vertical -->
<g class="f1">
  <circle cx="95" cy="35" r="13" fill="#94a3b8"/>
  <line x1="95" y1="48" x2="95" y2="110" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="66" x2="76" y2="88" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="66" x2="114" y2="88" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- pierna trasera apoyada en rodilla -->
  <line x1="95" y1="110" x2="70" y2="160" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="160" x2="52" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- pierna delantera flexionada 90 -->
  <line x1="95" y1="110" x2="122" y2="152" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="122" y1="152" x2="122" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="118" y1="205" x2="136" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="70" cy="160" r="5" fill="#64748b"/>
  <circle cx="122" cy="152" r="5" fill="#64748b"/>
</g>
<!-- F2: Cadera adelante, estiramiento del flexor -->
<g class="f2">
  <circle cx="103" cy="33" r="13" fill="#94a3b8"/>
  <line x1="103" y1="46" x2="104" y2="110" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="103" y1="64" x2="84" y2="80" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="103" y1="64" x2="122" y2="80" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- pierna trasera extendida hacia atrás -->
  <line x1="104" y1="110" x2="72" y2="168" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="168" x2="46" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- pierna delantera con rodilla adelantada -->
  <line x1="104" y1="110" x2="132" y2="150" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="132" y1="150" x2="124" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="205" x2="138" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="72" cy="168" r="5" fill="#64748b"/>
  <circle cx="132" cy="150" r="5" fill="#64748b"/>
</g>
<!-- F3: Cadera atrás, pierna delantera extendida, estiramiento isquiotibial -->
<g class="f3">
  <circle cx="82" cy="60" r="13" fill="#94a3b8"/>
  <line x1="82" y1="73" x2="76" y2="128" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="82" y1="86" x2="104" y2="120" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="82" y1="86" x2="112" y2="132" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- pierna trasera plegada, cadera sentada sobre el talón -->
  <line x1="76" y1="128" x2="62" y2="170" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="62" y1="170" x2="52" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- pierna delantera extendida, punta arriba -->
  <line x1="76" y1="128" x2="128" y2="196" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="128" y1="196" x2="140" y2="182" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="62" cy="170" r="5" fill="#64748b"/>
  <circle cx="112" cy="176" r="5" fill="#64748b"/>
</g>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569">HIP FLEXOR &amp; HAM</text>
</svg>
