<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<!-- Floor horizontal -->
<line x1="25" y1="192" x2="175" y2="192" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: Lying on back, knees bent, weight on chest -->
<!-- Head at left, feet at right -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="36" cy="168" r="13" fill="#94a3b8" stroke="none"/>
  <!-- Torso flat/slight angle -->
  <line x1="49" y1="168" x2="110" y2="172"/>
  <!-- Arms holding weight at chest -->
  <line x1="70" y1="168" x2="68" y2="158"/>
  <line x1="88" y1="170" x2="86" y2="160"/>
  <!-- Weight (disc) on chest -->
  <circle cx="77" cy="155" r="10" stroke="#64748b" stroke-width="3" fill="#1f2937"/>
  <!-- Right leg bent at knee -->
  <line x1="110" y1="172" x2="132" y2="155"/>
  <line x1="132" y1="155" x2="152" y2="178"/>
  <line x1="142" y1="178" x2="162" y2="178"/>
  <!-- Left leg bent (slightly different) -->
  <line x1="106" y1="173" x2="126" y2="158"/>
  <line x1="126" y1="158" x2="146" y2="182"/>
  <line x1="136" y1="182" x2="156" y2="182"/>
</g>

<!-- f2: Halfway up, 45°, holding weight on chest -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="56" cy="148" r="13" fill="#94a3b8" stroke="none"/>
  <!-- Torso at ~45° -->
  <line x1="68" y1="153" x2="110" y2="175"/>
  <!-- Arms holding weight -->
  <line x1="82" y1="153" x2="80" y2="142"/>
  <line x1="96" y1="160" x2="94" y2="149"/>
  <!-- Weight -->
  <circle cx="86" cy="138" r="10" stroke="#64748b" stroke-width="3" fill="#1f2937"/>
  <!-- Legs still bent, feet anchored -->
  <line x1="110" y1="175" x2="132" y2="158"/>
  <line x1="132" y1="158" x2="152" y2="180"/>
  <line x1="142" y1="180" x2="162" y2="180"/>
  <line x1="106" y1="176" x2="126" y2="162"/>
  <line x1="126" y1="162" x2="145" y2="184"/>
  <line x1="135" y1="184" x2="155" y2="184"/>
</g>

<!-- f3: Fully sitting up, weight overhead or at chest -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="84" cy="122" r="13" fill="#94a3b8" stroke="none"/>
  <!-- Torso near vertical -->
  <line x1="84" y1="135" x2="105" y2="178"/>
  <!-- Arms raised overhead with weight -->
  <line x1="84" y1="148" x2="72" y2="128"/>
  <line x1="84" y1="148" x2="96" y2="126"/>
  <!-- Weight overhead -->
  <circle cx="84" cy="115" r="10" stroke="#64748b" stroke-width="3" fill="#1f2937"/>
  <!-- Legs: bent knees, sitting position -->
  <line x1="105" y1="178" x2="128" y2="162"/>
  <line x1="128" y1="162" x2="150" y2="180"/>
  <line x1="140" y1="180" x2="160" y2="180"/>
  <line x1="102" y1="179" x2="124" y2="165"/>
  <line x1="124" y1="165" x2="143" y2="184"/>
  <line x1="133" y1="184" x2="153" y2="184"/>
</g>

<text x="100" y="212" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">WEIGHTED SIT-UP</text>
</svg>
