<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

  <!-- Frame 1: sentadilla profunda, brazos al frente -->
  <g class="f1" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="96" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="98" y1="109" x2="103" y2="152"/>
    <line x1="100" y1="120" x2="128" y2="112"/>
    <line x1="103" y1="152" x2="82" y2="160"/>
    <line x1="82" y1="160" x2="80" y2="205"/>
    <line x1="103" y1="152" x2="120" y2="162"/>
    <line x1="120" y1="162" x2="122" y2="205"/>
    <circle cx="103" cy="152" r="3" fill="#64748b" stroke="none"/>
    <circle cx="82" cy="160" r="3" fill="#64748b" stroke="none"/>
    <circle cx="120" cy="162" r="3" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: extension explosiva, brazos subiendo -->
  <g class="f2" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="70" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="83" x2="100" y2="128"/>
    <line x1="100" y1="94" x2="122" y2="76"/>
    <line x1="100" y1="128" x2="90" y2="164"/>
    <line x1="90" y1="164" x2="88" y2="206"/>
    <line x1="100" y1="128" x2="110" y2="164"/>
    <line x1="110" y1="164" x2="112" y2="206"/>
    <circle cx="100" cy="128" r="3" fill="#64748b" stroke="none"/>
    <circle cx="90" cy="164" r="3" fill="#64748b" stroke="none"/>
    <circle cx="110" cy="164" r="3" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: despegue, piernas extendidas, brazos arriba -->
  <g class="f3" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="52" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="65" x2="100" y2="112"/>
    <line x1="100" y1="76" x2="116" y2="52"/>
    <line x1="100" y1="112" x2="94" y2="152"/>
    <line x1="94" y1="152" x2="92" y2="192"/>
    <line x1="100" y1="112" x2="106" y2="152"/>
    <line x1="106" y1="152" x2="108" y2="192"/>
    <circle cx="100" cy="112" r="3" fill="#64748b" stroke="none"/>
    <circle cx="94" cy="152" r="3" fill="#64748b" stroke="none"/>
    <circle cx="106" cy="152" r="3" fill="#64748b" stroke="none"/>
  </g>

  <text x="100" y="224" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">JUMP SQUAT</text>
</svg>
