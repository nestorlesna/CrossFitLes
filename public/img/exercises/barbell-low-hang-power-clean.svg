<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="220" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">LOW HANG POWER CLEAN</text>
  <!-- Frame 1: Low hang - barra debajo de la rodilla, cadera atrás y torso inclinado -->
  <g class="f1">
    <line x1="42" y1="176" x2="178" y2="176" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="168" width="8" height="16" rx="2" fill="#475569"/>
    <rect x="176" y="168" width="8" height="16" rx="2" fill="#475569"/>
    <circle cx="128" cy="80" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Torso muy inclinado: los hombros quedan por delante de la barra -->
      <line x1="122" y1="90" x2="104" y2="136"/>
      <line x1="112" y1="100" x2="118" y2="98"/>
      <line x1="115" y1="99" x2="98" y2="176"/>
      <line x1="120" y1="97" x2="140" y2="176"/>
      <!-- Rodillas flexionadas, cadera atrás -->
      <line x1="104" y1="136" x2="96" y2="170"/><line x1="96" y1="170" x2="92" y2="210"/>
      <line x1="104" y1="136" x2="120" y2="170"/><line x1="120" y1="170" x2="126" y2="210"/>
    </g>
    <circle cx="96" cy="170" r="5" fill="#64748b"/>
    <circle cx="120" cy="170" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: Segundo tirón - la barra pasa la rodilla, cadera abriendo -->
  <g class="f2">
    <line x1="42" y1="120" x2="178" y2="120" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="112" width="8" height="16" rx="2" fill="#475569"/>
    <rect x="176" y="112" width="8" height="16" rx="2" fill="#475569"/>
    <circle cx="112" cy="52" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="112" y1="64" x2="110" y2="118"/>
      <line x1="90" y1="76" x2="132" y2="76"/>
      <line x1="90" y1="76" x2="74" y2="120"/>
      <line x1="132" y1="76" x2="146" y2="120"/>
      <line x1="105" y1="118" x2="100" y2="166"/><line x1="100" y1="166" x2="94" y2="210"/>
      <line x1="115" y1="118" x2="120" y2="166"/><line x1="120" y1="166" x2="126" y2="210"/>
    </g>
    <circle cx="100" cy="166" r="5" fill="#64748b"/>
    <circle cx="120" cy="166" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: Recepción en power - front rack, sentadilla corta -->
  <g class="f3">
    <line x1="42" y1="104" x2="178" y2="104" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="96" width="8" height="16" rx="2" fill="#475569"/>
    <rect x="176" y="96" width="8" height="16" rx="2" fill="#475569"/>
    <circle cx="110" cy="52" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="110" y1="64" x2="110" y2="118"/>
      <line x1="90" y1="76" x2="130" y2="76"/>
      <line x1="90" y1="76" x2="76" y2="104"/>
      <line x1="130" y1="76" x2="144" y2="104"/>
      <line x1="104" y1="118" x2="94" y2="158"/><line x1="94" y1="158" x2="86" y2="210"/>
      <line x1="116" y1="118" x2="126" y2="158"/><line x1="126" y1="158" x2="134" y2="210"/>
    </g>
    <circle cx="94" cy="158" r="5" fill="#64748b"/>
    <circle cx="126" cy="158" r="5" fill="#64748b"/>
  </g>
</svg>
