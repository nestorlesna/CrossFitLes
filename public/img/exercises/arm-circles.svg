<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 8s linear infinite}.f2{animation:sh2 8s linear infinite}.f3{animation:sh3 8s linear infinite}.f4{animation:sh4 8s linear infinite}.f5{animation:sh5 8s linear infinite}.f6{animation:sh6 8s linear infinite}.f7{animation:sh7 8s linear infinite}.f8{animation:sh8 8s linear infinite}
    @keyframes sh1{0%,10.2%{opacity:1}12.5%,100%{opacity:0}}
    @keyframes sh2{0%,12.5%{opacity:0}14.8%,22.7%{opacity:1}25%,100%{opacity:0}}
    @keyframes sh3{0%,25%{opacity:0}27.3%,35.2%{opacity:1}37.5%,100%{opacity:0}}
    @keyframes sh4{0%,37.5%{opacity:0}39.8%,47.7%{opacity:1}50%,100%{opacity:0}}
    @keyframes sh5{0%,50%{opacity:0}52.3%,60.2%{opacity:1}62.5%,100%{opacity:0}}
    @keyframes sh6{0%,62.5%{opacity:0}64.8%,72.7%{opacity:1}75%,100%{opacity:0}}
    @keyframes sh7{0%,75%{opacity:0}77.3%,85.2%{opacity:1}87.5%,100%{opacity:0}}
    @keyframes sh8{0%,87.5%{opacity:0}89.8%,97.7%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="207" x2="170" y2="207" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">ARM CIRCLES</text>

  <!-- Trayectoria del círculo (guía) -->
  <circle cx="152" cy="56" r="34" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4 5"/>
  <circle cx="48" cy="56" r="34" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- Cuerpo estático -->
  <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="26" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="39" x2="100" y2="112"/>
    <polyline points="100,112 92,160 92,204"/>
    <polyline points="100,112 108,160 108,204"/>
    <line x1="82" y1="204" x2="100" y2="204"/>
    <line x1="100" y1="204" x2="118" y2="204"/>
  </g>

  <!-- Frame 1: brazos arriba -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="100" y1="56" x2="152" y2="24"/>
    <line x1="100" y1="56" x2="48" y2="24"/>
    <circle cx="152" cy="24" r="4" fill="#64748b" stroke="none"/>
    <circle cx="48" cy="24" r="4" fill="#64748b" stroke="none"/>
  </g>

  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="100" y1="56" x2="160.5" y2="32"/>
    <line x1="100" y1="56" x2="39.5" y2="32"/>
    <circle cx="160.5" cy="32" r="4" fill="#64748b" stroke="none"/>
    <circle cx="39.5" cy="32" r="4" fill="#64748b" stroke="none"/>
  </g>

  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="100" y1="56" x2="169" y2="40"/>
    <line x1="100" y1="56" x2="31" y2="40"/>
    <circle cx="169" cy="40" r="4" fill="#64748b" stroke="none"/>
    <circle cx="31" cy="40" r="4" fill="#64748b" stroke="none"/>
  </g>

  <g class="f4" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="100" y1="56" x2="177.5" y2="48"/>
    <line x1="100" y1="56" x2="22.5" y2="48"/>
    <circle cx="177.5" cy="48" r="4" fill="#64748b" stroke="none"/>
    <circle cx="22.5" cy="48" r="4" fill="#64748b" stroke="none"/>
  </g>

  <g class="f5" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="100" y1="56" x2="186" y2="56"/>
    <line x1="100" y1="56" x2="14" y2="56"/>
    <circle cx="186" cy="56" r="4" fill="#64748b" stroke="none"/>
    <circle cx="14" cy="56" r="4" fill="#64748b" stroke="none"/>
  </g>

  <g class="f6" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="100" y1="56" x2="174.7" y2="66.7"/>
    <line x1="100" y1="56" x2="25.3" y2="66.7"/>
    <circle cx="174.7" cy="66.7" r="4" fill="#64748b" stroke="none"/>
    <circle cx="25.3" cy="66.7" r="4" fill="#64748b" stroke="none"/>
  </g>

  <g class="f7" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="100" y1="56" x2="163.3" y2="77.3"/>
    <line x1="100" y1="56" x2="36.7" y2="77.3"/>
    <circle cx="163.3" cy="77.3" r="4" fill="#64748b" stroke="none"/>
    <circle cx="36.7" cy="77.3" r="4" fill="#64748b" stroke="none"/>
  </g>

  <g class="f8" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="100" y1="56" x2="152" y2="88"/>
    <line x1="100" y1="56" x2="48" y2="88"/>
    <circle cx="152" cy="88" r="4" fill="#64748b" stroke="none"/>
    <circle cx="48" cy="88" r="4" fill="#64748b" stroke="none"/>
  </g>
</svg>
