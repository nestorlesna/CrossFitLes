<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: Standing, arms at sides, about to step forward -->
<g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <circle cx="100" cy="26" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="40" x2="100" y2="108"/>
  <line x1="100" y1="52" x2="84" y2="90"/>
  <line x1="100" y1="52" x2="116" y2="90"/>
  <line x1="96" y1="108" x2="94" y2="162"/><line x1="94" y1="162" x2="92" y2="210"/>
  <line x1="104" y1="108" x2="106" y2="162"/><line x1="106" y1="162" x2="108" y2="210"/>
  <circle cx="94" cy="162" r="5" fill="#64748b" stroke="none"/>
  <circle cx="106" cy="162" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- f2: Low lunge, front knee bent, torso rotated toward front leg, front arm reaching up -->
<g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <circle cx="122" cy="60" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="122" y1="74" x2="116" y2="120"/>
  <!-- Rotated shoulders: back arm down, front arm reaching up toward ceiling -->
  <line x1="116" y1="86" x2="146" y2="46"/>
  <line x1="116" y1="86" x2="98" y2="112"/>
  <!-- Front leg (right): knee bent forward at 90, foot ahead -->
  <line x1="122" y1="120" x2="150" y2="150"/>
  <line x1="150" y1="150" x2="150" y2="210"/>
  <!-- Back leg (left): extended back, knee low near floor -->
  <line x1="110" y1="120" x2="72" y2="170"/>
  <line x1="72" y1="170" x2="60" y2="205"/>
  <circle cx="146" cy="46" r="6" fill="#64748b" stroke="none"/>
  <circle cx="150" cy="150" r="5" fill="#64748b" stroke="none"/>
  <circle cx="72" cy="170" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- f3: Returning toward standing, torso unwinding back to center -->
<g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <circle cx="108" cy="42" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="108" y1="56" x2="104" y2="112"/>
  <line x1="104" y1="68" x2="126" y2="74"/>
  <line x1="104" y1="68" x2="88" y2="98"/>
  <line x1="110" y1="112" x2="128" y2="150"/>
  <line x1="128" y1="150" x2="126" y2="210"/>
  <line x1="98" y1="112" x2="78" y2="160"/>
  <line x1="78" y1="160" x2="72" y2="210"/>
  <circle cx="128" cy="150" r="5" fill="#64748b" stroke="none"/>
  <circle cx="78" cy="160" r="5" fill="#64748b" stroke="none"/>
</g>

<text x="100" y="225" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">LUNGE OPEN ROTATION</text>
</svg>
