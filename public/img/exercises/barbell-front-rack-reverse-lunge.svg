<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="220" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="700" fill="#475569" letter-spacing="2">FR REVERSE LUNGE</text>
  <!-- Frame 1: De pie, barra en front rack -->
  <g class="f1">
    <line x1="42" y1="96" x2="178" y2="96" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="88" width="8" height="16" rx="2" fill="#475569"/>
    <rect x="176" y="88" width="8" height="16" rx="2" fill="#475569"/>
    <circle cx="110" cy="44" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="110" y1="56" x2="110" y2="110"/>
      <line x1="90" y1="68" x2="130" y2="68"/>
      <!-- Codos altos en front rack -->
      <line x1="90" y1="68" x2="74" y2="96"/>
      <line x1="130" y1="68" x2="146" y2="96"/>
      <!-- Ambas piernas juntas, de pie -->
      <line x1="104" y1="110" x2="100" y2="160"/><line x1="100" y1="160" x2="96" y2="210"/>
      <line x1="116" y1="110" x2="120" y2="160"/><line x1="120" y1="160" x2="124" y2="210"/>
    </g>
    <circle cx="100" cy="160" r="5" fill="#64748b"/>
    <circle cx="120" cy="160" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: Paso atrás iniciando -->
  <g class="f2">
    <line x1="42" y1="100" x2="178" y2="100" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="92" width="8" height="16" rx="2" fill="#475569"/>
    <rect x="176" y="92" width="8" height="16" rx="2" fill="#475569"/>
    <circle cx="110" cy="48" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="110" y1="60" x2="110" y2="118"/>
      <line x1="90" y1="72" x2="130" y2="72"/>
      <line x1="90" y1="72" x2="74" y2="100"/>
      <line x1="130" y1="72" x2="146" y2="100"/>
      <!-- Pierna delantera levemente flexionada -->
      <line x1="104" y1="118" x2="96" y2="165"/><line x1="96" y1="165" x2="92" y2="210"/>
      <!-- Pierna trasera estirándose hacia atrás -->
      <line x1="116" y1="118" x2="148" y2="170"/><line x1="148" y1="170" x2="168" y2="208"/>
    </g>
    <circle cx="96" cy="165" r="5" fill="#64748b"/>
    <circle cx="148" cy="170" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: Lunge profundo, rodilla trasera cerca del piso -->
  <g class="f3">
    <line x1="42" y1="108" x2="178" y2="108" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="100" width="8" height="16" rx="2" fill="#475569"/>
    <rect x="176" y="100" width="8" height="16" rx="2" fill="#475569"/>
    <circle cx="110" cy="56" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="110" y1="68" x2="110" y2="128"/>
      <line x1="90" y1="80" x2="130" y2="80"/>
      <line x1="90" y1="80" x2="74" y2="108"/>
      <line x1="130" y1="80" x2="146" y2="108"/>
      <!-- Pierna delantera en 90° -->
      <line x1="104" y1="128" x2="88" y2="170"/><line x1="88" y1="170" x2="86" y2="210"/>
      <!-- Pierna trasera con rodilla casi en el piso -->
      <line x1="116" y1="128" x2="160" y2="190"/><line x1="160" y1="190" x2="180" y2="208"/>
    </g>
    <circle cx="88" cy="170" r="5" fill="#64748b"/>
    <circle cx="160" cy="190" r="5" fill="#64748b"/>
  </g>
</svg>
