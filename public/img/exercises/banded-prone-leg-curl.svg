<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <line x1="168" y1="150" x2="168" y2="210" stroke="#374151" stroke-width="6" stroke-linecap="round"/>

  <g class="f1">
    <circle cx="40" cy="150" r="14" fill="#94a3b8"/>
    <line x1="54" y1="150" x2="120" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="150" x2="70" y2="170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="150" x2="90" y2="170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="150" x2="165" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="165" y1="150" x2="168" y2="185" stroke="#64748b" stroke-width="2"/>
    <circle cx="165" cy="150" r="4" fill="#64748b"/>
  </g>

  <g class="f2">
    <circle cx="40" cy="150" r="14" fill="#94a3b8"/>
    <line x1="54" y1="150" x2="120" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="150" x2="70" y2="170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="150" x2="90" y2="170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="150" x2="150" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="150" x2="145" y2="118" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="145" y1="118" x2="168" y2="185" stroke="#64748b" stroke-width="2"/>
    <circle cx="145" cy="118" r="4" fill="#64748b"/>
  </g>

  <g class="f3">
    <circle cx="40" cy="150" r="14" fill="#94a3b8"/>
    <line x1="54" y1="150" x2="120" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="150" x2="70" y2="170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="150" x2="90" y2="170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="150" x2="140" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="140" y1="150" x2="118" y2="118" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="118" y1="118" x2="168" y2="185" stroke="#64748b" stroke-width="2"/>
    <circle cx="118" cy="118" r="4" fill="#64748b"/>
  </g>

  <text x="100" y="222" font-size="8" fill="#475569" text-anchor="middle" font-family="sans-serif">BANDED PRONE LEG CURL</text>
