<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
    .f1{animation:sh1 6s linear infinite}.f2{animation:sh2 6s linear infinite}.f3{animation:sh3 6s linear infinite}.f4{animation:sh4 6s linear infinite}.f5{animation:sh5 6s linear infinite}.f6{animation:sh6 6s linear infinite}
    @keyframes sh1{0%,13.7%{opacity:1}16.7%,100%{opacity:0}}
    @keyframes sh2{0%,16.7%{opacity:0}19.7%,30.3%{opacity:1}33.3%,100%{opacity:0}}
    @keyframes sh3{0%,33.3%{opacity:0}36.3%,47%{opacity:1}50%,100%{opacity:0}}
    @keyframes sh4{0%,50%{opacity:0}53%,63.7%{opacity:1}66.7%,100%{opacity:0}}
    @keyframes sh5{0%,66.7%{opacity:0}69.7%,80.3%{opacity:1}83.3%,100%{opacity:0}}
    @keyframes sh6{0%,83.3%{opacity:0}86.3%,97%{opacity:1}100%{opacity:0}}
  </style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<line x1="20" y1="176" x2="180" y2="176" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- Side view, lying supine. f1: base hollow, both limbs raised evenly -->
<g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="58" cy="150" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="68" y1="152" x2="132" y2="158"/>
    <line x1="58" y1="150" x2="30" y2="136"/>
    <line x1="132" y1="158" x2="160" y2="144"/>
  </g>

  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="58.7" cy="147.3" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="68.7" y1="150" x2="132" y2="158"/>
    <line x1="58.7" y1="147.3" x2="28.7" y2="140.7"/>
    <line x1="132" y1="158" x2="161.3" y2="139.3"/>
  </g>

  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="59.3" cy="144.7" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="69.3" y1="148" x2="132" y2="158"/>
    <line x1="59.3" y1="144.7" x2="27.3" y2="145.3"/>
    <line x1="132" y1="158" x2="162.7" y2="134.7"/>
  </g>

  <g class="f4" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="60" cy="142" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="70" y1="146" x2="132" y2="158"/>
    <line x1="60" y1="142" x2="26" y2="150"/>
    <line x1="132" y1="158" x2="164" y2="130"/>
  </g>

  <g class="f5" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="60" cy="142" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="70" y1="146" x2="132" y2="158"/>
    <line x1="60" y1="142" x2="24" y2="136"/>
    <line x1="132" y1="158" x2="163" y2="141"/>
  </g>

  <g class="f6" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="60" cy="142" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="70" y1="146" x2="132" y2="158"/>
    <line x1="60" y1="142" x2="22" y2="122"/>
    <line x1="132" y1="158" x2="162" y2="152"/>
  </g>

<text x="100" y="205" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">DYNAMIC HOLLOW HOLD</text>
</svg>
