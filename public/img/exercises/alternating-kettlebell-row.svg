<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">ALT. KETTLEBELL ROW</text>

<!-- F1: Hinged over, left KB rowed up, right KB hanging -->
<g class="f1" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="62" cy="92" r="11" fill="#94a3b8" stroke="none"/>
  <!-- Torso hinged ~45 -->
  <line x1="70" y1="98" x2="112" y2="120"/>
  <!-- Legs -->
  <line x1="112" y1="120" x2="108" y2="165"/>
  <line x1="108" y1="165" x2="104" y2="202"/>
  <line x1="98" y1="202" x2="112" y2="202"/>
  <!-- Right arm hanging with KB -->
  <line x1="88" y1="108" x2="92" y2="160"/>
  <circle cx="93" cy="170" r="7" fill="#64748b" stroke="none"/>
  <!-- Left arm rowed up, elbow high -->
  <line x1="88" y1="108" x2="100" y2="96"/>
  <line x1="100" y1="96" x2="92" y2="118"/>
  <circle cx="92" cy="126" r="7" fill="#64748b" stroke="none"/>
</g>

<!-- F2: Both arms mid-transition -->
<g class="f2" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="62" cy="92" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="70" y1="98" x2="112" y2="120"/>
  <line x1="112" y1="120" x2="108" y2="165"/>
  <line x1="108" y1="165" x2="104" y2="202"/>
  <line x1="98" y1="202" x2="112" y2="202"/>
  <!-- Both arms partly bent -->
  <line x1="88" y1="108" x2="90" y2="142"/>
  <circle cx="91" cy="150" r="7" fill="#64748b" stroke="none"/>
  <line x1="88" y1="108" x2="94" y2="140"/>
  <circle cx="95" cy="148" r="7" fill="#64748b" stroke="none"/>
</g>

<!-- F3: Right KB rowed up, left KB hanging -->
<g class="f3" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="62" cy="92" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="70" y1="98" x2="112" y2="120"/>
  <line x1="112" y1="120" x2="108" y2="165"/>
  <line x1="108" y1="165" x2="104" y2="202"/>
  <line x1="98" y1="202" x2="112" y2="202"/>
  <!-- Left arm hanging with KB -->
  <line x1="88" y1="108" x2="84" y2="160"/>
  <circle cx="83" cy="170" r="7" fill="#64748b" stroke="none"/>
  <!-- Right arm rowed up, elbow high -->
  <line x1="88" y1="108" x2="104" y2="98"/>
  <line x1="104" y1="98" x2="98" y2="120"/>
  <circle cx="98" cy="128" r="7" fill="#64748b" stroke="none"/>
</g>
</svg>
