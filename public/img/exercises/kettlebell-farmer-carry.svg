<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: Pie derecho adelante, pie izquierdo atrás (marcha) -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="30" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="44" x2="100" y2="118"/>
  <!-- Brazos rectos al costado -->
  <line x1="100" y1="58" x2="76" y2="125"/>
  <line x1="100" y1="58" x2="124" y2="125"/>
  <!-- Pierna derecha adelante -->
  <line x1="100" y1="118" x2="115" y2="160"/>
  <line x1="115" y1="160" x2="130" y2="205"/>
  <!-- Pierna izquierda atrás -->
  <line x1="100" y1="118" x2="85" y2="160"/>
  <line x1="85" y1="160" x2="70" y2="205"/>
  <!-- Kettlebells al costado -->
  <path d="M 68,125 Q 68,138 76,143 Q 84,138 84,125 L 80,125 L 80,118 L 72,118 L 72,125 Z" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 116,125 Q 116,138 124,143 Q 132,138 132,125 L 128,125 L 128,118 L 120,118 L 120,125 Z" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
</g>

<!-- f2: Pies juntos (transición) -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="28" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="42" x2="100" y2="118"/>
  <line x1="100" y1="56" x2="76" y2="125"/>
  <line x1="100" y1="56" x2="124" y2="125"/>
  <!-- Ambas piernas alineadas -->
  <line x1="100" y1="118" x2="95" y2="165"/>
  <line x1="95" y1="165" x2="90" y2="205"/>
  <line x1="100" y1="118" x2="105" y2="165"/>
  <line x1="105" y1="165" x2="110" y2="205"/>
  <path d="M 68,125 Q 68,138 76,143 Q 84,138 84,125 L 80,125 L 80,118 L 72,118 L 72,125 Z" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 116,125 Q 116,138 124,143 Q 132,138 132,125 L 128,125 L 128,118 L 120,118 L 120,125 Z" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
</g>

<!-- f3: Pie izquierdo adelante, pie derecho atrás -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="30" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="44" x2="100" y2="118"/>
  <line x1="100" y1="58" x2="76" y2="125"/>
  <line x1="100" y1="58" x2="124" y2="125"/>
  <!-- Pierna izquierda adelante -->
  <line x1="100" y1="118" x2="85" y2="160"/>
  <line x1="85" y1="160" x2="70" y2="205"/>
  <!-- Pierna derecha atrás -->
  <line x1="100" y1="118" x2="115" y2="160"/>
  <line x1="115" y1="160" x2="130" y2="205"/>
  <path d="M 68,125 Q 68,138 76,143 Q 84,138 84,125 L 80,125 L 80,118 L 72,118 L 72,125 Z" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 116,125 Q 116,138 124,143 Q 132,138 132,125 L 128,125 L 128,118 L 120,118 L 120,125 Z" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
</g>

<text x="100" y="225" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">KB FARMER CARRY</text>
</svg>
