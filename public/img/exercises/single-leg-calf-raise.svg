<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569">SINGLE-LEG CALF RAISE</text>

<!-- F1: Neutral stance – right leg standing flat, left leg raised -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="97" cy="26" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="97" y1="39" x2="97" y2="108"/>
  <!-- Arms hanging at sides -->
  <line x1="83" y1="55" x2="74" y2="90"/>
  <line x1="111" y1="55" x2="120" y2="90"/>
  <!-- Right leg (standing, heel flat) -->
  <line x1="97" y1="108" x2="102" y2="162"/>
  <line x1="102" y1="162" x2="105" y2="205"/>
  <line x1="105" y1="205" x2="118" y2="205"/>
  <circle cx="102" cy="162" r="5" fill="#64748b" stroke="none"/>
  <!-- Left leg raised (bent at hip and knee) -->
  <line x1="97" y1="108" x2="78" y2="150"/>
  <line x1="78" y1="150" x2="76" y2="182"/>
  <circle cx="78" cy="150" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- F2: On tiptoe – body raised, right heel elevated -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="97" cy="14" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="97" y1="27" x2="97" y2="96"/>
  <!-- Arms hanging -->
  <line x1="83" y1="43" x2="74" y2="78"/>
  <line x1="111" y1="43" x2="120" y2="78"/>
  <!-- Right leg: heel raised, toe on floor -->
  <line x1="97" y1="96" x2="102" y2="150"/>
  <line x1="102" y1="150" x2="106" y2="190"/>
  <line x1="106" y1="190" x2="118" y2="205"/>
  <circle cx="102" cy="150" r="5" fill="#64748b" stroke="none"/>
  <!-- Left leg raised -->
  <line x1="97" y1="96" x2="78" y2="138"/>
  <line x1="78" y1="138" x2="76" y2="170"/>
  <circle cx="78" cy="138" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- F3: Returning – heel partially lowered (intermediate) -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="97" cy="26" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="97" y1="39" x2="97" y2="108"/>
  <!-- Arms hanging -->
  <line x1="83" y1="55" x2="74" y2="90"/>
  <line x1="111" y1="55" x2="120" y2="90"/>
  <!-- Right leg: heel partially raised -->
  <line x1="97" y1="108" x2="102" y2="162"/>
  <line x1="102" y1="162" x2="105" y2="200"/>
  <line x1="105" y1="200" x2="116" y2="205"/>
  <circle cx="102" cy="162" r="5" fill="#64748b" stroke="none"/>
  <!-- Left leg raised -->
  <line x1="97" y1="108" x2="78" y2="150"/>
  <line x1="78" y1="150" x2="76" y2="182"/>
  <circle cx="78" cy="150" r="5" fill="#64748b" stroke="none"/>
</g>
</svg>
