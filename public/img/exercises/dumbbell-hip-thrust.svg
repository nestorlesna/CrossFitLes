<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">DUMBBELL HIP THRUST</text>
  <!-- banco de apoyo bajo los hombros -->
  <rect x="30" y="150" width="40" height="10" rx="2" fill="#374151"/>
  <!-- Frame 1: cadera abajo, casi tocando el piso -->
  <g class="f1">
    <circle cx="52" cy="150" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="62" y1="152" x2="120" y2="196"/>
      <line x1="120" y1="196" x2="150" y2="160"/><line x1="150" y1="160" x2="150" y2="200"/>
      <line x1="78" y1="164" x2="86" y2="192"/>
    </g>
    <rect x="76" y="188" width="20" height="12" rx="3" fill="#f59e0b"/>
    <circle cx="120" cy="196" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: media extension de cadera -->
  <g class="f2">
    <circle cx="52" cy="150" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="62" y1="152" x2="122" y2="176"/>
      <line x1="122" y1="176" x2="150" y2="196"/><line x1="150" y1="196" x2="150" y2="200"/>
      <line x1="86" y1="162" x2="96" y2="188"/>
    </g>
    <rect x="86" y="184" width="20" height="12" rx="3" fill="#f59e0b"/>
    <circle cx="122" cy="176" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: bloqueo de cadera, tronco y muslos alineados (mesa) -->
  <g class="f3">
    <circle cx="52" cy="150" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="62" y1="150" x2="128" y2="150"/>
      <line x1="128" y1="150" x2="150" y2="196"/><line x1="150" y1="196" x2="150" y2="200"/>
      <line x1="96" y1="150" x2="100" y2="180"/>
    </g>
    <rect x="90" y="176" width="20" height="12" rx="3" fill="#f59e0b"/>
    <circle cx="128" cy="150" r="5" fill="#64748b"/>
  </g>
</svg>
