<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">I-Y-T RAISES</text>
  <!-- torso inclinado al frente (bisagra de cadera), 3 posiciones de brazos -->
  <!-- Frame 1: posicion I - brazos rectos hacia adelante en linea con el torso -->
  <g class="f1">
    <circle cx="72" cy="70" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="80" y1="80" x2="128" y2="120"/>
      <line x1="92" y1="88" x2="52" y2="52"/>
      <line x1="92" y1="88" x2="56" y2="60"/>
      <line x1="128" y1="120" x2="122" y2="164"/><line x1="122" y1="164" x2="118" y2="208"/>
      <line x1="128" y1="120" x2="138" y2="164"/><line x1="138" y1="164" x2="142" y2="208"/>
    </g>
    <circle cx="122" cy="164" r="5" fill="#64748b"/>
    <circle cx="138" cy="164" r="5" fill="#64748b"/>
    <text x="150" y="60" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#f59e0b">I</text>
  </g>
  <!-- Frame 2: posicion Y - brazos abiertos ~30 grados sobre la linea de hombros -->
  <g class="f2">
    <circle cx="72" cy="70" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="80" y1="80" x2="128" y2="120"/>
      <line x1="92" y1="88" x2="58" y2="44"/>
      <line x1="92" y1="88" x2="74" y2="40"/>
      <line x1="128" y1="120" x2="122" y2="164"/><line x1="122" y1="164" x2="118" y2="208"/>
      <line x1="128" y1="120" x2="138" y2="164"/><line x1="138" y1="164" x2="142" y2="208"/>
    </g>
    <circle cx="122" cy="164" r="5" fill="#64748b"/>
    <circle cx="138" cy="164" r="5" fill="#64748b"/>
    <text x="150" y="60" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#f59e0b">Y</text>
  </g>
  <!-- Frame 3: posicion T - brazos abiertos en cruz, perpendiculares al torso -->
  <g class="f3">
    <circle cx="72" cy="70" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="80" y1="80" x2="128" y2="120"/>
      <line x1="92" y1="88" x2="60" y2="72"/>
      <line x1="92" y1="88" x2="98" y2="48"/>
      <line x1="128" y1="120" x2="122" y2="164"/><line x1="122" y1="164" x2="118" y2="208"/>
      <line x1="128" y1="120" x2="138" y2="164"/><line x1="138" y1="164" x2="142" y2="208"/>
    </g>
    <circle cx="122" cy="164" r="5" fill="#64748b"/>
    <circle cx="138" cy="164" r="5" fill="#64748b"/>
    <text x="150" y="60" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#f59e0b">T</text>
  </g>
</svg>
