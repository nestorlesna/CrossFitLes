<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="208" x2="180" y2="208" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="223" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="700" fill="#475569" letter-spacing="1">90/90 SHIN BOX</text>

  <!-- Frame 1: sentado 90/90, pierna derecha adelante, izquierda al costado -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="42" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="54" x2="100" y2="122"/>
    <line x1="80" y1="66" x2="120" y2="66"/>
    <line x1="80" y1="66" x2="88" y2="98"/>
    <line x1="120" y1="66" x2="128" y2="130"/>
    <line x1="106" y1="122" x2="108" y2="165"/>
    <line x1="108" y1="165" x2="110" y2="208"/>
    <line x1="94" y1="122" x2="62" y2="140"/>
    <line x1="62" y1="140" x2="42" y2="170"/>
    <circle cx="108" cy="165" r="4" fill="#64748b" stroke="none"/>
    <circle cx="62" cy="140" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: shin box, ambas tibias cruzadas al frente -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="40" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="52" x2="100" y2="122"/>
    <line x1="80" y1="64" x2="120" y2="64"/>
    <line x1="80" y1="64" x2="78" y2="98"/>
    <line x1="120" y1="64" x2="122" y2="98"/>
    <line x1="100" y1="122" x2="72" y2="140"/>
    <line x1="72" y1="140" x2="128" y2="148"/>
    <line x1="100" y1="122" x2="128" y2="132"/>
    <line x1="128" y1="132" x2="72" y2="150"/>
    <circle cx="72" cy="140" r="4" fill="#64748b" stroke="none"/>
    <circle cx="128" cy="132" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: sentado 90/90 invertido, pierna izquierda adelante, derecha al costado -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="42" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="54" x2="100" y2="122"/>
    <line x1="80" y1="66" x2="120" y2="66"/>
    <line x1="120" y1="66" x2="112" y2="98"/>
    <line x1="80" y1="66" x2="72" y2="130"/>
    <line x1="94" y1="122" x2="92" y2="165"/>
    <line x1="92" y1="165" x2="90" y2="208"/>
    <line x1="106" y1="122" x2="138" y2="140"/>
    <line x1="138" y1="140" x2="158" y2="170"/>
    <circle cx="92" cy="165" r="4" fill="#64748b" stroke="none"/>
    <circle cx="138" cy="140" r="4" fill="#64748b" stroke="none"/>
  </g>
</svg>
