<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">V-UP</text>

<!-- F1: Lying flat on back, arms overhead, legs extended -->
<g class="f1" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="58" cy="190" r="11" fill="#94a3b8" stroke="none"/>
  <!-- Torso along floor -->
  <line x1="69" y1="190" x2="115" y2="192"/>
  <!-- Arms overhead -->
  <line x1="69" y1="190" x2="40" y2="188"/>
  <line x1="40" y1="188" x2="28" y2="186"/>
  <!-- Legs extended -->
  <line x1="115" y1="192" x2="150" y2="194"/>
  <line x1="150" y1="194" x2="172" y2="195"/>
</g>

<!-- F2: Rising, torso and legs lifting toward each other -->
<g class="f2" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="66" cy="168" r="11" fill="#94a3b8" stroke="none"/>
  <!-- Torso lifting -->
  <line x1="74" y1="176" x2="100" y2="194"/>
  <!-- Arms reaching forward -->
  <line x1="74" y1="176" x2="100" y2="168"/>
  <line x1="100" y1="168" x2="120" y2="162"/>
  <!-- Legs lifting -->
  <line x1="100" y1="194" x2="130" y2="172"/>
  <line x1="130" y1="172" x2="150" y2="158"/>
</g>

<!-- F3: V position, hands toward toes -->
<g class="f3" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="76" cy="150" r="11" fill="#94a3b8" stroke="none"/>
  <!-- Torso up-left from hips -->
  <line x1="82" y1="158" x2="100" y2="196"/>
  <!-- Legs up-right from hips -->
  <line x1="100" y1="196" x2="128" y2="158"/>
  <line x1="128" y1="158" x2="146" y2="132"/>
  <!-- Arms reaching toward feet -->
  <line x1="84" y1="156" x2="110" y2="142"/>
  <line x1="110" y1="142" x2="132" y2="132"/>
</g>
</svg>
