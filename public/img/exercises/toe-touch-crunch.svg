<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="20" y1="200" x2="180" y2="200" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="222" text-anchor="middle" font-family="monospace" font-size="10" fill="#475569">TOE TOUCH CRUNCH</text>

<!-- F1: Lying flat on back, legs straight up at 90°, arms back overhead -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <!-- Head on right side, lying flat -->
  <circle cx="160" cy="188" r="12" fill="#94a3b8" stroke="none"/>
  <!-- Torso horizontal -->
  <line x1="148" y1="188" x2="92" y2="188"/>
  <!-- Arms reaching back overhead -->
  <line x1="148" y1="188" x2="170" y2="160"/>
  <line x1="148" y1="188" x2="170" y2="180"/>
  <!-- Legs straight up vertical -->
  <line x1="92" y1="188" x2="92" y2="130"/>
  <line x1="92" y1="130" x2="92" y2="70"/>
  <line x1="98" y1="188" x2="100" y2="130"/>
  <line x1="100" y1="130" x2="102" y2="70"/>
  <circle cx="92" cy="130" r="5" fill="#64748b" stroke="none"/>
  <circle cx="100" cy="130" r="5" fill="#64748b" stroke="none"/>
  <!-- Feet -->
  <line x1="86" y1="70" x2="98" y2="64"/>
  <line x1="96" y1="70" x2="108" y2="64"/>
</g>

<!-- F2: Crunch up — torso curled, hands reaching for toes -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <!-- Head closer to legs -->
  <circle cx="128" cy="110" r="12" fill="#94a3b8" stroke="none"/>
  <!-- Curved torso from head to hip -->
  <line x1="124" y1="120" x2="98" y2="188"/>
  <!-- Arms reaching toward toes -->
  <line x1="120" y1="120" x2="105" y2="92"/>
  <line x1="120" y1="120" x2="100" y2="80"/>
  <!-- Legs straight up vertical -->
  <line x1="92" y1="188" x2="92" y2="130"/>
  <line x1="92" y1="130" x2="92" y2="72"/>
  <line x1="104" y1="188" x2="102" y2="130"/>
  <line x1="102" y1="130" x2="100" y2="72"/>
  <circle cx="92" cy="130" r="5" fill="#64748b" stroke="none"/>
  <circle cx="102" cy="130" r="5" fill="#64748b" stroke="none"/>
  <line x1="86" y1="72" x2="98" y2="66"/>
  <line x1="94" y1="72" x2="106" y2="66"/>
</g>

<!-- F3: Lowering back, halfway down -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="148" cy="150" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="140" y1="156" x2="94" y2="188"/>
  <!-- Arms reaching up/back -->
  <line x1="138" y1="156" x2="155" y2="120"/>
  <line x1="138" y1="156" x2="158" y2="140"/>
  <!-- Legs still vertical -->
  <line x1="92" y1="188" x2="92" y2="130"/>
  <line x1="92" y1="130" x2="92" y2="70"/>
  <line x1="100" y1="188" x2="102" y2="130"/>
  <line x1="102" y1="130" x2="104" y2="70"/>
  <circle cx="92" cy="130" r="5" fill="#64748b" stroke="none"/>
  <circle cx="102" cy="130" r="5" fill="#64748b" stroke="none"/>
  <line x1="86" y1="70" x2="98" y2="64"/>
  <line x1="98" y1="70" x2="110" y2="64"/>
</g>
</svg>
