<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <style>
    .f1{animation:sh1 8s linear infinite}.f2{animation:sh2 8s linear infinite}
    .f3{animation:sh3 8s linear infinite}.f4{animation:sh4 8s linear infinite}
    .f5{animation:sh5 8s linear infinite}.f6{animation:sh6 8s linear infinite}
    @keyframes sh1{0%,13.3%{opacity:1}16.7%,96.7%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,16.7%{opacity:0}20%,30%{opacity:1}33.3%,100%{opacity:0}}
    @keyframes sh3{0%,33.3%{opacity:0}36.7%,46.7%{opacity:1}50%,100%{opacity:0}}
    @keyframes sh4{0%,50%{opacity:0}53.3%,63.3%{opacity:1}66.7%,100%{opacity:0}}
    @keyframes sh5{0%,66.7%{opacity:0}70%,80%{opacity:1}83.3%,100%{opacity:0}}
    @keyframes sh6{0%,83.3%{opacity:0}86.7%,96.7%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="240" height="180" fill="#111827" rx="12"/>
  <line x1="20" y1="150" x2="220" y2="150" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">BENCH DIP</text>
  <!-- Silla (siempre visible): asiento, patas y respaldo -->
  <g stroke="#475569" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="40" y1="100" x2="100" y2="100"/>
    <line x1="46" y1="100" x2="46" y2="150"/>
    <line x1="94" y1="100" x2="94" y2="150"/>
    <line x1="40" y1="100" x2="40" y2="52"/>
  </g>
  <!-- Frame 1: Arriba (brazos extendidos) -->
  <g class="f1">
    <circle cx="110" cy="38" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="102" y1="62" x2="118" y2="114"/>
      <line x1="102" y1="62" x2="98" y2="100"/>
      <line x1="118" y1="114" x2="162" y2="112"/><line x1="162" y1="112" x2="164" y2="150"/>
    </g>
    <circle cx="98" cy="100" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: Bajando -->
  <g class="f2">
    <circle cx="111" cy="47" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="103" y1="71" x2="119" y2="122"/>
      <line x1="103" y1="71" x2="95" y2="83"/><line x1="95" y1="83" x2="98" y2="100"/>
      <line x1="119" y1="122" x2="162" y2="115"/><line x1="162" y1="115" x2="164" y2="150"/>
    </g>
    <circle cx="98" cy="100" r="5" fill="#64748b"/><circle cx="95" cy="83" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 3: Casi abajo -->
  <g class="f3">
    <circle cx="113" cy="56" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="105" y1="80" x2="121" y2="130"/>
      <line x1="105" y1="80" x2="89" y2="84"/><line x1="89" y1="84" x2="98" y2="100"/>
      <line x1="121" y1="130" x2="162" y2="119"/><line x1="162" y1="119" x2="164" y2="150"/>
    </g>
    <circle cx="98" cy="100" r="5" fill="#64748b"/><circle cx="89" cy="84" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 4: Abajo (codos a 90°, cadera cerca del piso) -->
  <g class="f4">
    <circle cx="114" cy="66" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="106" y1="90" x2="122" y2="138"/>
      <line x1="106" y1="90" x2="84" y2="86"/><line x1="84" y1="86" x2="98" y2="100"/>
      <line x1="122" y1="138" x2="162" y2="122"/><line x1="162" y1="122" x2="164" y2="150"/>
    </g>
    <circle cx="98" cy="100" r="5" fill="#64748b"/><circle cx="84" cy="86" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 5: Subiendo -->
  <g class="f5">
    <circle cx="113" cy="56" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="105" y1="80" x2="121" y2="130"/>
      <line x1="105" y1="80" x2="89" y2="84"/><line x1="89" y1="84" x2="98" y2="100"/>
      <line x1="121" y1="130" x2="162" y2="119"/><line x1="162" y1="119" x2="164" y2="150"/>
    </g>
    <circle cx="98" cy="100" r="5" fill="#64748b"/><circle cx="89" cy="84" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 6: Casi arriba -->
  <g class="f6">
    <circle cx="111" cy="47" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="103" y1="71" x2="119" y2="122"/>
      <line x1="103" y1="71" x2="95" y2="83"/><line x1="95" y1="83" x2="98" y2="100"/>
      <line x1="119" y1="122" x2="162" y2="115"/><line x1="162" y1="115" x2="164" y2="150"/>
    </g>
    <circle cx="98" cy="100" r="5" fill="#64748b"/><circle cx="95" cy="83" r="4" fill="#64748b"/>
  </g>
</svg>
