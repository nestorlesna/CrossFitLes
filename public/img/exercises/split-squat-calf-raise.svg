<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569">SPLIT SQUAT CALF RAISE</text>

<!-- F1: Split stance, heels down, knees slightly bent -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="40" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="53" x2="100" y2="120"/>
  <!-- Arms at sides for balance -->
  <line x1="100" y1="68" x2="80" y2="105"/>
  <line x1="100" y1="68" x2="120" y2="105"/>
  <!-- Front leg (right) bent -->
  <line x1="100" y1="120" x2="130" y2="160"/>
  <line x1="130" y1="160" x2="130" y2="205"/>
  <circle cx="130" cy="160" r="5" fill="#64748b" stroke="none"/>
  <line x1="125" y1="205" x2="145" y2="205"/>
  <!-- Back leg (left) bent -->
  <line x1="100" y1="120" x2="70" y2="160"/>
  <line x1="70" y1="160" x2="70" y2="205"/>
  <circle cx="70" cy="160" r="5" fill="#64748b" stroke="none"/>
  <line x1="60" y1="205" x2="78" y2="205"/>
</g>

<!-- F2: Heels raised — body elevated, calves contracted -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="28" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="41" x2="100" y2="108"/>
  <line x1="100" y1="56" x2="80" y2="93"/>
  <line x1="100" y1="56" x2="120" y2="93"/>
  <!-- Front leg — knee bent, foot on ball of foot -->
  <line x1="100" y1="108" x2="130" y2="148"/>
  <line x1="130" y1="148" x2="135" y2="200"/>
  <circle cx="130" cy="148" r="5" fill="#64748b" stroke="none"/>
  <!-- Ball of foot, heel raised -->
  <line x1="135" y1="200" x2="148" y2="205"/>
  <!-- Back leg — knee bent, ball of foot -->
  <line x1="100" y1="108" x2="70" y2="148"/>
  <line x1="70" y1="148" x2="65" y2="200"/>
  <circle cx="70" cy="148" r="5" fill="#64748b" stroke="none"/>
  <line x1="65" y1="200" x2="52" y2="205"/>
</g>

<!-- F3: Heels coming back down -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="38" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="51" x2="100" y2="118"/>
  <line x1="100" y1="66" x2="80" y2="103"/>
  <line x1="100" y1="66" x2="120" y2="103"/>
  <line x1="100" y1="118" x2="130" y2="158"/>
  <line x1="130" y1="158" x2="132" y2="205"/>
  <circle cx="130" cy="158" r="5" fill="#64748b" stroke="none"/>
  <line x1="125" y1="205" x2="145" y2="205"/>
  <line x1="100" y1="118" x2="70" y2="158"/>
  <line x1="70" y1="158" x2="68" y2="205"/>
  <circle cx="70" cy="158" r="5" fill="#64748b" stroke="none"/>
  <line x1="58" y1="205" x2="76" y2="205"/>
</g>
</svg>
