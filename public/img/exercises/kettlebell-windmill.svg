<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569">KB WINDMILL</text>

<!-- F1: De pie, kettlebell bloqueada overhead, piernas abiertas -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="98" cy="42" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="98" y1="55" x2="100" y2="112"/>
  <!-- Brazo con KB extendido arriba -->
  <line x1="98" y1="66" x2="122" y2="34"/>
  <circle cx="128" cy="24" r="9" fill="#64748b" stroke="none"/>
  <rect x="119" y="26" width="10" height="6" rx="2" transform="rotate(-38 124 29)" fill="#475569" stroke="none"/>
  <!-- Brazo libre al costado -->
  <line x1="98" y1="66" x2="84" y2="108"/>
  <!-- Piernas abiertas -->
  <line x1="100" y1="112" x2="80" y2="162"/>
  <line x1="80" y1="162" x2="72" y2="205"/>
  <line x1="100" y1="112" x2="122" y2="162"/>
  <line x1="122" y1="162" x2="130" y2="205"/>
  <circle cx="80" cy="162" r="5" fill="#64748b" stroke="none"/>
  <circle cx="122" cy="162" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- F2: Bisagra lateral a media altura, la mano libre baja por la pierna -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="70" cy="60" r="13" fill="#94a3b8" stroke="none"/>
  <!-- Torso inclinado hacia el lado -->
  <line x1="80" y1="70" x2="112" y2="114"/>
  <!-- Brazo con KB sigue vertical -->
  <line x1="84" y1="76" x2="114" y2="44"/>
  <circle cx="121" cy="35" r="9" fill="#64748b" stroke="none"/>
  <rect x="112" y="37" width="10" height="6" rx="2" transform="rotate(-38 117 40)" fill="#475569" stroke="none"/>
  <!-- Brazo libre deslizando por la pierna -->
  <line x1="84" y1="76" x2="80" y2="130"/>
  <!-- Piernas abiertas, rodilla trasera extendida -->
  <line x1="112" y1="114" x2="88" y2="163"/>
  <line x1="88" y1="163" x2="78" y2="205"/>
  <line x1="112" y1="114" x2="130" y2="162"/>
  <line x1="130" y1="162" x2="138" y2="205"/>
  <circle cx="88" cy="163" r="5" fill="#64748b" stroke="none"/>
  <circle cx="130" cy="162" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- F3: Posición final, mano libre cerca del suelo, KB bloqueada arriba -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="54" cy="92" r="13" fill="#94a3b8" stroke="none"/>
  <!-- Torso casi horizontal -->
  <line x1="66" y1="98" x2="118" y2="118"/>
  <!-- Brazo con KB apuntando al cielo -->
  <line x1="72" y1="100" x2="104" y2="52"/>
  <circle cx="111" cy="42" r="9" fill="#64748b" stroke="none"/>
  <rect x="102" y="45" width="10" height="6" rx="2" transform="rotate(-56 107 48)" fill="#475569" stroke="none"/>
  <!-- Brazo libre hacia el suelo -->
  <line x1="70" y1="100" x2="62" y2="172"/>
  <!-- Piernas -->
  <line x1="118" y1="118" x2="94" y2="165"/>
  <line x1="94" y1="165" x2="84" y2="205"/>
  <line x1="118" y1="118" x2="134" y2="162"/>
  <line x1="134" y1="162" x2="142" y2="205"/>
  <circle cx="94" cy="165" r="5" fill="#64748b" stroke="none"/>
  <circle cx="134" cy="162" r="5" fill="#64748b" stroke="none"/>
</g>
</svg>
