<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="185" x2="180" y2="185" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">CAT-COW</text>

  <!-- Frame 1: cuadrupedia neutra -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="46" cy="112" r="12" fill="#94a3b8" stroke="none"/>
    <path d="M60,118 L148,118"/>
    <line x1="62" y1="118" x2="60" y2="183"/>
    <line x1="148" y1="118" x2="152" y2="183"/>
    <line x1="152" y1="183" x2="176" y2="183"/>
    <circle cx="60" cy="183" r="4" fill="#64748b" stroke="none"/>
    <circle cx="152" cy="183" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: gato (espalda redondeada, mentón al pecho) -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="50" cy="134" r="12" fill="#94a3b8" stroke="none"/>
    <path d="M62,126 Q104,84 148,120"/>
    <line x1="62" y1="126" x2="60" y2="183"/>
    <line x1="148" y1="120" x2="152" y2="183"/>
    <line x1="152" y1="183" x2="176" y2="183"/>
    <circle cx="60" cy="183" r="4" fill="#64748b" stroke="none"/>
    <circle cx="152" cy="183" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: camello (abdomen hundido, mirada al frente) -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="44" cy="98" r="12" fill="#94a3b8" stroke="none"/>
    <path d="M58,110 Q104,150 148,112"/>
    <line x1="58" y1="110" x2="60" y2="183"/>
    <line x1="148" y1="112" x2="152" y2="183"/>
    <line x1="152" y1="183" x2="176" y2="183"/>
    <circle cx="60" cy="183" r="4" fill="#64748b" stroke="none"/>
    <circle cx="152" cy="183" r="4" fill="#64748b" stroke="none"/>
  </g>
</svg>
