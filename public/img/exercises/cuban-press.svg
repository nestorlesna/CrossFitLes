<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">CUBAN PRESS</text>
  <!-- Frame 1: Upright row - elbows high, forearms down, discs at chest -->
  <g class="f1">
    <circle cx="100" cy="40" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="53" x2="100" y2="120"/>
      <!-- upper arms out and up to elbows -->
      <line x1="100" y1="66" x2="74" y2="58"/><line x1="100" y1="66" x2="126" y2="58"/>
      <!-- forearms hanging down -->
      <line x1="74" y1="58" x2="80" y2="92"/><line x1="126" y1="58" x2="120" y2="92"/>
      <!-- legs -->
      <line x1="100" y1="120" x2="92" y2="164"/><line x1="92" y1="164" x2="90" y2="210"/>
      <line x1="100" y1="120" x2="108" y2="164"/><line x1="108" y1="164" x2="110" y2="210"/>
    </g>
    <rect x="74" y="90" width="12" height="6" rx="2" fill="#64748b"/>
    <rect x="114" y="90" width="12" height="6" rx="2" fill="#64748b"/>
  </g>
  <!-- Frame 2: External rotation - forearms rotated up beside head -->
  <g class="f2">
    <circle cx="100" cy="40" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="53" x2="100" y2="120"/>
      <line x1="100" y1="66" x2="74" y2="58"/><line x1="100" y1="66" x2="126" y2="58"/>
      <!-- forearms rotated up -->
      <line x1="74" y1="58" x2="70" y2="26"/><line x1="126" y1="58" x2="130" y2="26"/>
      <line x1="100" y1="120" x2="92" y2="164"/><line x1="92" y1="164" x2="90" y2="210"/>
      <line x1="100" y1="120" x2="108" y2="164"/><line x1="108" y1="164" x2="110" y2="210"/>
    </g>
    <rect x="64" y="22" width="12" height="6" rx="2" fill="#64748b"/>
    <rect x="124" y="22" width="12" height="6" rx="2" fill="#64748b"/>
  </g>
  <!-- Frame 3: Overhead press lockout -->
  <g class="f3">
    <circle cx="100" cy="50" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="63" x2="100" y2="126"/>
      <!-- arms extended overhead -->
      <line x1="100" y1="74" x2="86" y2="30"/><line x1="100" y1="74" x2="114" y2="30"/>
      <line x1="100" y1="126" x2="92" y2="168"/><line x1="92" y1="168" x2="90" y2="210"/>
      <line x1="100" y1="126" x2="108" y2="168"/><line x1="108" y1="168" x2="110" y2="210"/>
    </g>
    <rect x="80" y="24" width="12" height="6" rx="2" fill="#64748b"/>
    <rect x="108" y="24" width="12" height="6" rx="2" fill="#64748b"/>
  </g>
</svg>
