<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">SKIERG</text>

<!-- Machine column (static) -->
<line x1="158" y1="40" x2="158" y2="210" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
<line x1="150" y1="42" x2="166" y2="42" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

<!-- F1: Arms reaching up, gripping handles at top -->
<g class="f1" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="92" cy="60" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="92" y1="72" x2="92" y2="120"/>
  <!-- Arms up to handles -->
  <line x1="92" y1="80" x2="120" y2="56"/>
  <line x1="120" y1="56" x2="142" y2="46"/>
  <!-- Cords to column top -->
  <line x1="142" y1="46" x2="158" y2="44" stroke="#64748b" stroke-width="2"/>
  <!-- Legs straight -->
  <line x1="92" y1="120" x2="84" y2="165"/>
  <line x1="84" y1="165" x2="82" y2="202"/>
  <line x1="92" y1="120" x2="100" y2="165"/>
  <line x1="100" y1="165" x2="102" y2="202"/>
  <line x1="76" y1="202" x2="88" y2="202"/>
  <line x1="96" y1="202" x2="108" y2="202"/>
</g>

<!-- F2: Arms pulling down to chest, slight hinge -->
<g class="f2" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="90" cy="66" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="90" y1="78" x2="94" y2="124"/>
  <!-- Arms pulling -->
  <line x1="91" y1="88" x2="116" y2="92"/>
  <line x1="116" y1="92" x2="138" y2="88"/>
  <line x1="138" y1="88" x2="158" y2="70" stroke="#64748b" stroke-width="2"/>
  <!-- Legs slight bend -->
  <line x1="94" y1="124" x2="86" y2="166"/>
  <line x1="86" y1="166" x2="84" y2="202"/>
  <line x1="94" y1="124" x2="102" y2="166"/>
  <line x1="102" y1="166" x2="104" y2="202"/>
  <line x1="78" y1="202" x2="90" y2="202"/>
  <line x1="98" y1="202" x2="110" y2="202"/>
</g>

<!-- F3: Arms finished low past hips, hip hinge -->
<g class="f3" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="84" cy="78" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="86" y1="90" x2="100" y2="130"/>
  <!-- Arms extended down -->
  <line x1="90" y1="104" x2="116" y2="128"/>
  <line x1="116" y1="128" x2="140" y2="138"/>
  <line x1="140" y1="138" x2="158" y2="120" stroke="#64748b" stroke-width="2"/>
  <!-- Legs hinged -->
  <line x1="100" y1="130" x2="92" y2="168"/>
  <line x1="92" y1="168" x2="90" y2="202"/>
  <line x1="100" y1="130" x2="108" y2="168"/>
  <line x1="108" y1="168" x2="110" y2="202"/>
  <line x1="84" y1="202" x2="96" y2="202"/>
  <line x1="104" y1="202" x2="116" y2="202"/>
</g>
</svg>
