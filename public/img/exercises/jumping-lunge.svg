<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

  <!-- Frame 1: estocada con pierna derecha adelante -->
  <g class="f1">
    <circle cx="100" cy="46" r="14" fill="#94a3b8"/>
    <line x1="100" y1="60" x2="96" y2="120" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="72" y1="72" x2="122" y2="88" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="96" y1="120" x2="128" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="128" y1="150" x2="128" y2="205" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="96" y1="120" x2="70" y2="160" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="160" x2="90" y2="205" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="128" cy="150" r="4" fill="#64748b"/>
    <circle cx="70" cy="160" r="4" fill="#64748b"/>
  </g>

  <!-- Frame 2: salto, ambas piernas en el aire -->
  <g class="f2">
    <circle cx="100" cy="30" r="14" fill="#94a3b8"/>
    <line x1="100" y1="44" x2="100" y2="100" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="76" y1="58" x2="124" y2="58" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="80" y2="130" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="130" x2="100" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="122" y2="128" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="122" y1="128" x2="104" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="80" cy="130" r="4" fill="#64748b"/>
    <circle cx="122" cy="128" r="4" fill="#64748b"/>
  </g>

  <!-- Frame 3: estocada con pierna izquierda adelante (aterrizaje) -->
  <g class="f3">
    <circle cx="100" cy="46" r="14" fill="#94a3b8"/>
    <line x1="100" y1="60" x2="104" y2="120" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="78" y1="88" x2="128" y2="72" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="104" y1="120" x2="72" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="72" y1="150" x2="72" y2="205" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="104" y1="120" x2="130" y2="160" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="130" y1="160" x2="110" y2="205" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="72" cy="150" r="4" fill="#64748b"/>
    <circle cx="130" cy="160" r="4" fill="#64748b"/>
  </g>

  <text x="100" y="222" font-size="10" fill="#475569" text-anchor="middle" font-family="sans-serif">JUMPING LUNGE</text>
</svg>
