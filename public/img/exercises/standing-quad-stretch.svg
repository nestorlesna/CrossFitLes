<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="207" x2="170" y2="207" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <line x1="34" y1="20" x2="34" y2="207" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">STANDING QUAD STRETCH</text>

  <!-- Frame 1: de pie, mano en la pared -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="102" cy="34" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="102" y1="47" x2="102" y2="118"/>
    <polyline points="102,118 96,164 96,204"/>
    <polyline points="102,118 110,164 110,204"/>
    <line x1="86" y1="204" x2="102" y2="204"/>
    <line x1="102" y1="204" x2="120" y2="204"/>
    <line x1="102" y1="62" x2="40" y2="66"/>
    <circle cx="96" cy="164" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: flexionando la rodilla, tomando el empeine -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="102" cy="34" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="102" y1="47" x2="102" y2="118"/>
    <polyline points="102,118 96,164 96,204"/>
    <polyline points="102,118 108,162 138,146"/>
    <line x1="86" y1="204" x2="106" y2="204"/>
    <line x1="102" y1="62" x2="40" y2="66"/>
    <polyline points="102,64 132,110 140,142"/>
    <circle cx="108" cy="162" r="4" fill="#64748b" stroke="none"/>
    <circle cx="140" cy="144" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: talón a la cola, estiramiento sostenido -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="102" cy="34" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="102" y1="47" x2="102" y2="118"/>
    <polyline points="102,118 96,164 96,204"/>
    <polyline points="102,118 104,160 132,126"/>
    <line x1="86" y1="204" x2="106" y2="204"/>
    <line x1="102" y1="62" x2="40" y2="66"/>
    <polyline points="102,64 126,100 134,124"/>
    <circle cx="104" cy="160" r="4" fill="#64748b" stroke="none"/>
    <circle cx="134" cy="126" r="4" fill="#64748b" stroke="none"/>
    <circle cx="158" cy="140" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="158" cy="152" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="158" cy="164" r="3" fill="#6ee7b7" stroke="none"/>
  </g>
</svg>
