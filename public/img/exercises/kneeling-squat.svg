<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">KNEELING SQUAT</text>
  <!-- Frame 1: De rodillas, tronco erguido -->
  <g class="f1">
    <circle cx="100" cy="66" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="80" x2="100" y2="146"/><line x1="80" y1="92" x2="120" y2="92"/>
      <line x1="80" y1="92" x2="74" y2="132"/><line x1="120" y1="92" x2="126" y2="132"/>
      <line x1="95" y1="146" x2="90" y2="186"/><line x1="90" y1="186" x2="72" y2="205"/>
      <line x1="105" y1="146" x2="110" y2="186"/><line x1="110" y1="186" x2="128" y2="205"/>
      <line x1="66" y1="205" x2="90" y2="205"/><line x1="110" y1="205" x2="134" y2="205"/>
    </g>
    <circle cx="90" cy="186" r="5.5" fill="#64748b"/><circle cx="110" cy="186" r="5.5" fill="#64748b"/>
  </g>
  <!-- Frame 2: Transición, un pie apoyado adelante -->
  <g class="f2">
    <circle cx="100" cy="58" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="72" x2="98" y2="140"/><line x1="80" y1="84" x2="120" y2="84"/>
      <line x1="80" y1="84" x2="66" y2="118"/><line x1="120" y1="84" x2="134" y2="118"/>
      <line x1="94" y1="140" x2="72" y2="168"/><line x1="72" y1="168" x2="74" y2="205"/>
      <line x1="104" y1="140" x2="118" y2="182"/><line x1="118" y1="182" x2="132" y2="205"/>
      <line x1="60" y1="205" x2="86" y2="205"/><line x1="116" y1="205" x2="140" y2="205"/>
    </g>
    <circle cx="72" cy="168" r="5.5" fill="#64748b"/><circle cx="118" cy="182" r="5.5" fill="#64748b"/>
  </g>
  <!-- Frame 3: En cuclillas, los dos pies apoyados -->
  <g class="f3">
    <circle cx="100" cy="82" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="96" x2="97" y2="150"/><line x1="78" y1="108" x2="122" y2="108"/>
      <line x1="78" y1="108" x2="64" y2="140"/><line x1="122" y1="108" x2="136" y2="140"/>
      <line x1="93" y1="150" x2="68" y2="170"/><line x1="68" y1="170" x2="72" y2="205"/>
      <line x1="101" y1="150" x2="132" y2="170"/><line x1="132" y1="170" x2="128" y2="205"/>
      <line x1="56" y1="205" x2="84" y2="205"/><line x1="116" y1="205" x2="142" y2="205"/>
    </g>
    <circle cx="68" cy="170" r="5.5" fill="#64748b"/><circle cx="132" cy="170" r="5.5" fill="#64748b"/>
  </g>
</svg>
