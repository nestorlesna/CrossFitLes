<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="224" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">BAND TRICEPS PUSHDOWN</text>
  <!-- Anchor point overhead -->
  <circle cx="100" cy="14" r="3" fill="#374151"/>
  <!-- Frame 1: Elbows bent 90deg, hands near chest, band slack -->
  <g class="f1">
    <path d="M100 14 Q90 50 84 80" stroke="#4b5563" stroke-width="3" fill="none"/>
    <path d="M100 14 Q110 50 116 80" stroke="#4b5563" stroke-width="3" fill="none"/>
    <circle cx="100" cy="26" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="40" x2="100" y2="108"/>
      <line x1="100" y1="52" x2="82" y2="60"/><line x1="82" y1="60" x2="84" y2="80"/>
      <line x1="100" y1="52" x2="118" y2="60"/><line x1="118" y1="60" x2="116" y2="80"/>
      <line x1="100" y1="108" x2="94" y2="158"/><line x1="94" y1="158" x2="90" y2="205"/>
      <line x1="100" y1="108" x2="106" y2="158"/><line x1="106" y1="158" x2="110" y2="205"/>
    </g>
  </g>
  <!-- Frame 2: Mid extension, forearms halfway down -->
  <g class="f2">
    <path d="M100 14 Q92 60 84 110" stroke="#4b5563" stroke-width="3" fill="none"/>
    <path d="M100 14 Q108 60 116 110" stroke="#4b5563" stroke-width="3" fill="none"/>
    <circle cx="100" cy="26" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="40" x2="100" y2="108"/>
      <line x1="100" y1="52" x2="83" y2="65"/><line x1="83" y1="65" x2="84" y2="110"/>
      <line x1="100" y1="52" x2="117" y2="65"/><line x1="117" y1="65" x2="116" y2="110"/>
      <line x1="100" y1="108" x2="94" y2="158"/><line x1="94" y1="158" x2="90" y2="205"/>
      <line x1="100" y1="108" x2="106" y2="158"/><line x1="106" y1="158" x2="110" y2="205"/>
    </g>
  </g>
  <!-- Frame 3: Full extension, arms straight down, band stretched -->
  <g class="f3">
    <path d="M100 14 Q94 70 84 140" stroke="#4b5563" stroke-width="3" fill="none"/>
    <path d="M100 14 Q106 70 116 140" stroke="#4b5563" stroke-width="3" fill="none"/>
    <circle cx="100" cy="26" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="40" x2="100" y2="108"/>
      <line x1="100" y1="52" x2="83" y2="70"/><line x1="83" y1="70" x2="84" y2="140"/>
      <line x1="100" y1="52" x2="117" y2="70"/><line x1="117" y1="70" x2="116" y2="140"/>
      <line x1="100" y1="108" x2="94" y2="158"/><line x1="94" y1="158" x2="90" y2="205"/>
      <line x1="100" y1="108" x2="106" y2="158"/><line x1="106" y1="158" x2="110" y2="205"/>
    </g>
  </g>
</svg>
