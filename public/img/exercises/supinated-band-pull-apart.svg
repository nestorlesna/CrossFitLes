<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="204" x2="170" y2="204" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="222" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#475569">SUPINATED PULL-APART</text>

<!-- F1: Brazos al frente, banda sin tension, palmas arriba -->
<g class="f1">
  <circle cx="100" cy="34" r="12" fill="#94a3b8"/>
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="100" y1="46" x2="100" y2="116"/>
    <line x1="82" y1="58" x2="118" y2="58"/>
    <line x1="82" y1="58" x2="90" y2="46"/>
    <line x1="118" y1="58" x2="110" y2="46"/>
    <line x1="100" y1="116" x2="90" y2="160"/><line x1="90" y1="160" x2="86" y2="204"/>
    <line x1="100" y1="116" x2="110" y2="160"/><line x1="110" y1="160" x2="114" y2="204"/>
    <line x1="80" y1="204" x2="94" y2="204"/>
    <line x1="106" y1="204" x2="120" y2="204"/>
  </g>
  <circle cx="90" cy="160" r="4" fill="#64748b"/>
  <circle cx="110" cy="160" r="4" fill="#64748b"/>
  <line x1="90" y1="42" x2="110" y2="42" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <path d="M84,48 a6,5 0 0 0 12,0" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <path d="M104,48 a6,5 0 0 0 12,0" fill="none" stroke="#a78bfa" stroke-width="2"/>
</g>

<!-- F2: Apertura a 45 grados, banda estirandose -->
<g class="f2">
  <circle cx="100" cy="34" r="12" fill="#94a3b8"/>
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="100" y1="46" x2="100" y2="116"/>
    <line x1="82" y1="58" x2="118" y2="58"/>
    <line x1="82" y1="58" x2="56" y2="42"/>
    <line x1="118" y1="58" x2="144" y2="42"/>
    <line x1="100" y1="116" x2="90" y2="160"/><line x1="90" y1="160" x2="86" y2="204"/>
    <line x1="100" y1="116" x2="110" y2="160"/><line x1="110" y1="160" x2="114" y2="204"/>
    <line x1="80" y1="204" x2="94" y2="204"/>
    <line x1="106" y1="204" x2="120" y2="204"/>
  </g>
  <circle cx="90" cy="160" r="4" fill="#64748b"/>
  <circle cx="110" cy="160" r="4" fill="#64748b"/>
  <line x1="56" y1="38" x2="144" y2="38" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <path d="M50,44 a6,5 0 0 0 12,0" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <path d="M138,44 a6,5 0 0 0 12,0" fill="none" stroke="#a78bfa" stroke-width="2"/>
</g>

<!-- F3: Apertura total en T, banda al pecho -->
<g class="f3">
  <circle cx="100" cy="34" r="12" fill="#94a3b8"/>
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="100" y1="46" x2="100" y2="116"/>
    <line x1="82" y1="58" x2="118" y2="58"/>
    <line x1="82" y1="58" x2="34" y2="58"/>
    <line x1="118" y1="58" x2="166" y2="58"/>
    <line x1="100" y1="116" x2="90" y2="160"/><line x1="90" y1="160" x2="86" y2="204"/>
    <line x1="100" y1="116" x2="110" y2="160"/><line x1="110" y1="160" x2="114" y2="204"/>
    <line x1="80" y1="204" x2="94" y2="204"/>
    <line x1="106" y1="204" x2="120" y2="204"/>
  </g>
  <circle cx="90" cy="160" r="4" fill="#64748b"/>
  <circle cx="110" cy="160" r="4" fill="#64748b"/>
  <line x1="34" y1="52" x2="166" y2="52" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <path d="M28,58 a6,5 0 0 0 12,0" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <path d="M160,58 a6,5 0 0 0 12,0" fill="none" stroke="#a78bfa" stroke-width="2"/>
</g>
</svg>
