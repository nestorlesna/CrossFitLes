<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">KB PULLOVER ON BALL</text>
  <!-- Pelota fija: la espalda alta apoya sobre el wall ball -->
  <circle cx="96" cy="150" r="22" fill="none" stroke="#64748b" stroke-width="3"/>
  <!-- Frame 1: kettlebell sobre el pecho, brazos verticales -->
  <g class="f1">
    <circle cx="62" cy="128" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="74" y1="130" x2="128" y2="130"/>
      <line x1="128" y1="130" x2="140" y2="172"/>
      <line x1="140" y1="172" x2="150" y2="205"/>
      <line x1="128" y1="130" x2="132" y2="176"/>
      <line x1="132" y1="176" x2="140" y2="205"/>
      <line x1="86" y1="130" x2="86" y2="94"/>
    </g>
    <circle cx="140" cy="172" r="5" fill="#64748b"/>
    <path d="M82 94 q4 -8 8 0" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <rect x="78" y="76" width="16" height="16" rx="4" fill="#f59e0b"/>
  </g>
  <!-- Frame 2: la kettlebell viaja hacia atras, brazos extendidos por encima de la cabeza -->
  <g class="f2">
    <circle cx="62" cy="128" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="74" y1="130" x2="128" y2="130"/>
      <line x1="128" y1="130" x2="140" y2="172"/>
      <line x1="140" y1="172" x2="150" y2="205"/>
      <line x1="128" y1="130" x2="132" y2="176"/>
      <line x1="132" y1="176" x2="140" y2="205"/>
      <line x1="86" y1="130" x2="56" y2="104"/>
    </g>
    <circle cx="140" cy="172" r="5" fill="#64748b"/>
    <path d="M52 100 q4 -8 9 -3" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <rect x="42" y="84" width="16" height="16" rx="4" fill="#f59e0b"/>
  </g>
  <!-- Frame 3: maxima extension, kettlebell detras de la cabeza cerca del piso -->
  <g class="f3">
    <circle cx="62" cy="128" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="74" y1="130" x2="128" y2="130"/>
      <line x1="128" y1="130" x2="140" y2="172"/>
      <line x1="140" y1="172" x2="150" y2="205"/>
      <line x1="128" y1="130" x2="132" y2="176"/>
      <line x1="132" y1="176" x2="140" y2="205"/>
      <line x1="86" y1="130" x2="42" y2="132"/>
    </g>
    <circle cx="140" cy="172" r="5" fill="#64748b"/>
    <path d="M38 128 q-2 -9 6 -7" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <rect x="22" y="116" width="16" height="16" rx="4" fill="#f59e0b"/>
  </g>
</svg>
