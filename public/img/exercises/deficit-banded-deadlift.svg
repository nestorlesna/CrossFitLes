<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230">
  <style>
    .f1{animation:sh1 7.8s linear infinite}.f2{animation:sh2 7.8s linear infinite}.f3{animation:sh3 7.8s linear infinite}.f4{animation:sh4 7.8s linear infinite}.f5{animation:sh5 7.8s linear infinite}.f6{animation:sh6 7.8s linear infinite}
    @keyframes sh1{0%,13.3%{opacity:1}16.7%,96.7%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,16.7%{opacity:0}20%,30%{opacity:1}33.3%,100%{opacity:0}}
    @keyframes sh3{0%,33.3%{opacity:0}36.7%,46.7%{opacity:1}50%,100%{opacity:0}}
    @keyframes sh4{0%,50%{opacity:0}53.3%,63.3%{opacity:1}66.7%,100%{opacity:0}}
    @keyframes sh5{0%,66.7%{opacity:0}70%,80%{opacity:1}83.3%,100%{opacity:0}}
    @keyframes sh6{0%,83.3%{opacity:0}86.7%,96.7%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="220" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">DEFICIT BANDED DL</text>
  <!-- Frame 1: setup sobre la plataforma, cadera baja -->
  <g class="f1">
    <rect x="64" y="198" width="80" height="12" rx="2" fill="#374151"/><line x1="112" y1="190" x2="82" y2="208" stroke="#f59e0b" stroke-width="3"/><line x1="112" y1="190" x2="142" y2="208" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="134" cy="102" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="84,150 124,112"/>
      <polyline points="124,114 116,150 112,182"/>
      <polyline points="84,150 110,166 100,198"/>
    </g>
    <circle cx="110" cy="166" r="4" fill="#64748b"/>
    <line x1="78" y1="190" x2="146" y2="190" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/><circle cx="112" cy="190" r="13" fill="#475569"/><circle cx="112" cy="190" r="5" fill="#cbd5e1"/>
  </g>
  <!-- Frame 2: despegue, la banda empieza a tensar -->
  <g class="f2">
    <rect x="64" y="198" width="80" height="12" rx="2" fill="#374151"/><line x1="112" y1="180" x2="82" y2="208" stroke="#f59e0b" stroke-width="3"/><line x1="112" y1="180" x2="142" y2="208" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="132" cy="96" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="84,146 122,106"/>
      <polyline points="122,108 114,144 112,174"/>
      <polyline points="84,146 108,164 100,198"/>
    </g>
    <circle cx="108" cy="164" r="4" fill="#64748b"/>
    <line x1="78" y1="180" x2="146" y2="180" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/><circle cx="112" cy="180" r="13" fill="#475569"/><circle cx="112" cy="180" r="5" fill="#cbd5e1"/>
  </g>
  <!-- Frame 3: barra a las rodillas -->
  <g class="f3">
