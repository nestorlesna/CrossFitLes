    <circle cx="108" cy="52" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="88,122 102,66"/>
      <polyline points="102,68 100,100 100,134"/>
      <polyline points="88,122 98,162 98,198"/>
    </g>
    <circle cx="98" cy="162" r="4" fill="#64748b"/>
    <line x1="66" y1="138" x2="134" y2="138" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="138" r="13" fill="#475569"/><circle cx="100" cy="138" r="5" fill="#cbd5e1"/>
  </g>
  <!-- Frame 5: bloqueo arriba, cadera extendida -->
  <g class="f5">
    <rect x="64" y="198" width="80" height="12" rx="2" fill="#374151"/><line x1="96" y1="120" x2="66" y2="208" stroke="#f59e0b" stroke-width="3"/><line x1="96" y1="120" x2="126" y2="208" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="92" cy="26" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="92,112 92,48"/>
      <polyline points="92,50 94,84 96,116"/>
      <polyline points="92,112 96,160 96,198"/>
    </g>
    <circle cx="96" cy="160" r="4" fill="#64748b"/>
    <line x1="62" y1="120" x2="130" y2="120" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/><circle cx="96" cy="120" r="13" fill="#475569"/><circle cx="96" cy="120" r="5" fill="#cbd5e1"/>
  </g>
  <!-- Frame 6: baja controlada, barra a rodillas -->
  <g class="f6">
    <rect x="64" y="198" width="80" height="12" rx="2" fill="#374151"/><line x1="108" y1="160" x2="78" y2="208" stroke="#f59e0b" stroke-width="3"/><line x1="108" y1="160" x2="138" y2="208" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="128" cy="84" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="84,138 118,94"/>
      <polyline points="118,96 110,126 108,156"/>
      <polyline points="84,138 102,160 100,198"/>
    </g>
    <circle cx="102" cy="160" r="4" fill="#64748b"/>
    <line x1="74" y1="160" x2="142" y2="160" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/><circle cx="108" cy="160" r="13" fill="#475569"/><circle cx="108" cy="160" r="5" fill="#cbd5e1"/>
  </g>
</svg>
