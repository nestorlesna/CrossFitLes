<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <!-- Wall (behind, right side) -->
  <line x1="150" y1="20" x2="150" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- Floor -->
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">WALL SIT</text>
  <!-- Frame 1: Standing against wall (start) -->
  <g class="f1">
    <circle cx="140" cy="46" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="140" y1="60" x2="140" y2="120"/>
      <line x1="140" y1="72" x2="122" y2="96"/><line x1="140" y1="72" x2="158" y2="96"/>
      <line x1="140" y1="120" x2="138" y2="165"/><line x1="138" y1="165" x2="136" y2="208"/>
      <line x1="140" y1="120" x2="142" y2="165"/><line x1="142" y1="165" x2="144" y2="208"/>
    </g>
  </g>
  <!-- Frame 2: Sliding down (half squat) -->
  <g class="f2">
    <circle cx="140" cy="86" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="140" y1="100" x2="140" y2="150"/>
      <line x1="140" y1="112" x2="120" y2="134"/><line x1="140" y1="112" x2="118" y2="130"/>
      <line x1="140" y1="150" x2="106" y2="158"/><line x1="106" y1="158" x2="104" y2="208"/>
      <line x1="140" y1="150" x2="112" y2="160"/><line x1="112" y1="160" x2="110" y2="208"/>
    </g>
  </g>
  <!-- Frame 3: Full wall sit, thighs parallel (90/90) -->
  <g class="f3">
    <circle cx="140" cy="108" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="140" y1="122" x2="140" y2="164"/>
      <line x1="140" y1="134" x2="118" y2="150"/><line x1="140" y1="134" x2="116" y2="146"/>
      <line x1="140" y1="164" x2="96" y2="164"/><line x1="96" y1="164" x2="94" y2="208"/>
      <line x1="140" y1="164" x2="104" y2="164"/><line x1="104" y1="164" x2="102" y2="208"/>
    </g>
  </g>
</svg>
