<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<!-- Banco posterior (referencia) -->
<rect x="140" y="170" width="35" height="6" fill="#374151" rx="2"/>
<line x1="148" y1="176" x2="148" y2="205" stroke="#374151" stroke-width="2"/>
<line x1="167" y1="176" x2="167" y2="205" stroke="#374151" stroke-width="2"/>

<!-- f1: Posición inicial, de pie con pie atrás en banco, kettlebells al costado -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="80" cy="40" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="80" y1="53" x2="80" y2="115"/>
  <!-- Brazos colgando con kettlebells -->
  <line x1="80" y1="68" x2="62" y2="118"/>
  <line x1="80" y1="68" x2="98" y2="118"/>
  <!-- Pierna delantera (extendida) -->
  <line x1="80" y1="115" x2="78" y2="160"/>
  <line x1="78" y1="160" x2="76" y2="205"/>
  <!-- Pierna atrás sobre banco -->
  <line x1="80" y1="115" x2="120" y2="148"/>
  <line x1="120" y1="148" x2="155" y2="172"/>
  <!-- Kettlebells -->
  <path d="M 56,118 Q 56,125 62,128 Q 68,125 68,118 L 64,118 L 64,114 L 60,114 L 60,118 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 92,118 Q 92,125 98,128 Q 104,125 104,118 L 100,118 L 100,114 L 96,114 L 96,118 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="80" cy="115" r="4" fill="#64748b" stroke="none"/>
</g>

<!-- f2: Posición a mitad de descenso -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="80" cy="62" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="80" y1="75" x2="80" y2="130"/>
  <line x1="80" y1="88" x2="62" y2="138"/>
  <line x1="80" y1="88" x2="98" y2="138"/>
  <!-- Pierna delantera flexionada parcial -->
  <line x1="80" y1="130" x2="72" y2="170"/>
  <line x1="72" y1="170" x2="68" y2="205"/>
  <!-- Pierna atrás -->
  <line x1="80" y1="130" x2="115" y2="160"/>
  <line x1="115" y1="160" x2="155" y2="180"/>
  <path d="M 56,138 Q 56,145 62,148 Q 68,145 68,138 L 64,138 L 64,134 L 60,134 L 60,138 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 92,138 Q 92,145 98,148 Q 104,145 104,138 L 100,138 L 100,134 L 96,134 L 96,138 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="80" cy="130" r="4" fill="#64748b" stroke="none"/>
  <circle cx="72" cy="170" r="4" fill="#64748b" stroke="none"/>
</g>

<!-- f3: Posición baja (split squat profundo) -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="78" cy="90" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="78" y1="103" x2="78" y2="155"/>
  <line x1="78" y1="115" x2="60" y2="160"/>
  <line x1="78" y1="115" x2="96" y2="160"/>
  <!-- Pierna delantera, rodilla a 90° -->
  <line x1="78" y1="155" x2="66" y2="180"/>
  <line x1="66" y1="180" x2="60" y2="205"/>
  <!-- Pierna trasera (rodilla baja casi al piso) -->
  <line x1="78" y1="155" x2="115" y2="180"/>
  <line x1="115" y1="180" x2="155" y2="185"/>
  <path d="M 54,160 Q 54,167 60,170 Q 66,167 66,160 L 62,160 L 62,156 L 58,156 L 58,160 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 90,160 Q 90,167 96,170 Q 102,167 102,160 L 98,160 L 98,156 L 94,156 L 94,160 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="78" cy="155" r="4" fill="#64748b" stroke="none"/>
  <circle cx="66" cy="180" r="4" fill="#64748b" stroke="none"/>
  <circle cx="115" cy="180" r="4" fill="#64748b" stroke="none"/>
</g>

<text x="100" y="225" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">BULGARIAN SPLIT SQUAT</text>
</svg>
