<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="207" x2="180" y2="207" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <rect x="140" y="184" width="42" height="23" fill="none" stroke="#374151" stroke-width="3" rx="3"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">HAMSTRING STRETCH</text>

  <!-- Frame 1: de pie, talón sobre el escalón -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="72" cy="42" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="72" y1="55" x2="76" y2="124"/>
    <polyline points="76,124 70,166 70,204"/>
    <line x1="76" y1="124" x2="146" y2="182"/>
    <line x1="60" y1="204" x2="80" y2="204"/>
    <line x1="72" y1="72" x2="86" y2="124"/>
    <circle cx="70" cy="166" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: inclinando el tronco desde la cadera -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="60" cy="66" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="64" y1="78" x2="76" y2="124"/>
    <polyline points="76,124 70,166 70,204"/>
    <line x1="76" y1="124" x2="146" y2="182"/>
    <line x1="60" y1="204" x2="80" y2="204"/>
    <polyline points="66,88 104,120 126,152"/>
    <circle cx="70" cy="166" r="4" fill="#64748b" stroke="none"/>
    <circle cx="126" cy="152" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: estiramiento sostenido, espalda larga -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="52" cy="82" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="58" y1="92" x2="76" y2="124"/>
    <polyline points="76,124 70,166 70,204"/>
    <line x1="76" y1="124" x2="146" y2="182"/>
    <line x1="60" y1="204" x2="80" y2="204"/>
    <polyline points="62,100 106,132 138,172"/>
    <circle cx="70" cy="166" r="4" fill="#64748b" stroke="none"/>
    <circle cx="138" cy="172" r="4" fill="#64748b" stroke="none"/>
    <circle cx="110" cy="176" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="102" cy="184" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="94" cy="192" r="3" fill="#6ee7b7" stroke="none"/>
  </g>
</svg>
