<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">KETTLEBELL DEADLIFT</text>
  <!-- Frame 1: De pie, kettlebell en el suelo entre los pies -->
  <g class="f1">
    <circle cx="100" cy="26" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="39" x2="100" y2="108"/>
      <line x1="82" y1="52" x2="118" y2="52"/>
      <line x1="82" y1="52" x2="80" y2="100"/>
      <line x1="118" y1="52" x2="120" y2="100"/>
      <line x1="94" y1="108" x2="90" y2="160"/><line x1="90" y1="160" x2="88" y2="208"/>
      <line x1="106" y1="108" x2="110" y2="160"/><line x1="110" y1="160" x2="112" y2="208"/>
    </g>
    <circle cx="90" cy="160" r="5" fill="#64748b"/>
    <circle cx="110" cy="160" r="5" fill="#64748b"/>
    <!-- Kettlebell en el piso -->
    <path d="M92 190 q8 -14 16 0" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="200" rx="14" ry="10" fill="#475569"/>
  </g>
  <!-- Frame 2: Bisagra de cadera - torso inclinado, agarrando la campana -->
  <g class="f2">
    <circle cx="118" cy="76" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Espalda neutra, cadera atrás -->
      <line x1="112" y1="86" x2="94" y2="132"/>
      <line x1="108" y1="96" x2="100" y2="186"/>
      <line x1="88" y1="160" x2="86" y2="208"/>
      <line x1="94" y1="132" x2="88" y2="160"/>
      <line x1="94" y1="132" x2="114" y2="160"/><line x1="114" y1="160" x2="116" y2="208"/>
    </g>
    <circle cx="88" cy="160" r="5" fill="#64748b"/>
    <circle cx="114" cy="160" r="5" fill="#64748b"/>
    <path d="M92 190 q8 -14 16 0" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="200" rx="14" ry="10" fill="#475569"/>
  </g>
  <!-- Frame 3: De pie con la kettlebell colgando, cadera extendida -->
  <g class="f3">
    <circle cx="100" cy="26" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="39" x2="100" y2="108"/>
      <line x1="82" y1="52" x2="118" y2="52"/>
      <line x1="82" y1="52" x2="86" y2="118"/>
      <line x1="118" y1="52" x2="114" y2="118"/>
      <line x1="94" y1="108" x2="92" y2="160"/><line x1="92" y1="160" x2="90" y2="208"/>
      <line x1="106" y1="108" x2="108" y2="160"/><line x1="108" y1="160" x2="110" y2="208"/>
    </g>
    <circle cx="92" cy="160" r="5" fill="#64748b"/>
    <circle cx="108" cy="160" r="5" fill="#64748b"/>
    <!-- Kettlebell colgando a la altura de la cadera -->
    <path d="M92 118 q8 -12 16 0" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="130" rx="14" ry="10" fill="#475569"/>
  </g>
</svg>
