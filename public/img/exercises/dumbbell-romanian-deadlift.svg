<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: Standing tall, dumbbells at sides -->
<g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <circle cx="100" cy="26" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="40" x2="100" y2="108"/>
  <line x1="100" y1="52" x2="82" y2="100"/>
  <line x1="100" y1="52" x2="118" y2="100"/>
  <line x1="94" y1="108" x2="90" y2="162"/><line x1="90" y1="162" x2="86" y2="210"/>
  <line x1="106" y1="108" x2="110" y2="162"/><line x1="110" y1="162" x2="114" y2="210"/>
</g>
<g class="f1">
  <rect x="76" y="98" width="12" height="7" rx="2" fill="#64748b"/>
  <rect x="112" y="98" width="12" height="7" rx="2" fill="#64748b"/>
  <circle cx="90" cy="162" r="5" fill="#64748b"/>
  <circle cx="110" cy="162" r="5" fill="#64748b"/>
</g>

<!-- f2: Mid-hinge, dumbbells at knee level, torso ~45 -->
<g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <circle cx="110" cy="58" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="110" y1="72" x2="110" y2="122"/>
  <line x1="110" y1="82" x2="86" y2="128"/>
  <line x1="110" y1="82" x2="134" y2="128"/>
  <line x1="104" y1="122" x2="100" y2="168"/><line x1="100" y1="168" x2="94" y2="210"/>
  <line x1="116" y1="122" x2="120" y2="168"/><line x1="120" y1="168" x2="126" y2="210"/>
</g>
<g class="f2">
  <rect x="80" y="126" width="12" height="7" rx="2" fill="#64748b"/>
  <rect x="128" y="126" width="12" height="7" rx="2" fill="#64748b"/>
  <circle cx="100" cy="168" r="5" fill="#64748b"/>
  <circle cx="120" cy="168" r="5" fill="#64748b"/>
</g>

<!-- f3: Full hinge, dumbbells near shins, torso near horizontal -->
<g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <circle cx="112" cy="78" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="112" y1="92" x2="110" y2="136"/>
  <line x1="110" y1="98" x2="80" y2="150"/>
  <line x1="110" y1="98" x2="140" y2="150"/>
  <line x1="104" y1="136" x2="100" y2="178"/><line x1="100" y1="178" x2="92" y2="210"/>
  <line x1="116" y1="136" x2="120" y2="178"/><line x1="120" y1="178" x2="128" y2="210"/>
</g>
<g class="f3">
  <rect x="74" y="148" width="12" height="7" rx="2" fill="#64748b"/>
  <rect x="134" y="148" width="12" height="7" rx="2" fill="#64748b"/>
  <circle cx="100" cy="178" r="5" fill="#64748b"/>
  <circle cx="120" cy="178" r="5" fill="#64748b"/>
</g>

<text x="100" y="225" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">DB ROMANIAN DEADLIFT</text>
</svg>
