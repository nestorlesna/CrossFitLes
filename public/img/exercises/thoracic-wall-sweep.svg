<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230">
  <style>
    .f1{animation:sh1 7.8s linear infinite}.f2{animation:sh2 7.8s linear infinite}.f3{animation:sh3 7.8s linear infinite}.f4{animation:sh4 7.8s linear infinite}.f5{animation:sh5 7.8s linear infinite}.f6{animation:sh6 7.8s linear infinite}
    @keyframes sh1{0%,13.3%{opacity:1}16.7%,96.7%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,16.7%{opacity:0}20%,30%{opacity:1}33.3%,100%{opacity:0}}
    @keyframes sh3{0%,33.3%{opacity:0}36.7%,46.7%{opacity:1}50%,100%{opacity:0}}
    @keyframes sh4{0%,50%{opacity:0}53.3%,63.3%{opacity:1}66.7%,100%{opacity:0}}
    @keyframes sh5{0%,66.7%{opacity:0}70%,80%{opacity:1}83.3%,100%{opacity:0}}
    @keyframes sh6{0%,83.3%{opacity:0}86.7%,96.7%{opacity:1}100%,100%{opacity:0}}
  </style>
  <rect width="220" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- Pared -->
  <line x1="40" y1="18" x2="40" y2="210" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <!-- Recorrido de la mano -->
  <path d="M42,64 A58,58 0 0 1 158,64" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <text x="110" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">THORACIC WALL SWEEP</text>
  <!-- Frame 1: mano en la pared a la altura del pecho -->
  <g class="f1">
    
    <circle cx="110" cy="38" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="118,52 120,116"/>
      <polyline points="100,64 136,62"/>
    </g>
    <polyline points="100,64 73,67 42,64" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="136,62 144,92 132,124"/>
      <polyline points="112,116 98,160 100,206"/>
      <polyline points="128,116 138,160 144,206"/>
    </g>
    <circle cx="73" cy="67" r="4" fill="#64748b"/>
    <circle cx="42" cy="64" r="5" fill="#64748b"/>
    <circle cx="98" cy="160" r="5" fill="#64748b"/>
    <circle cx="138" cy="160" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: barre la pared hacia arriba -->
  <g class="f2">
    
    <circle cx="111.8" cy="35.9" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="116.8,52 120,116"/>
      <polyline points="100,64 133.6,62"/>
    </g>
    <polyline points="100,64 81.5,46.5 59,23" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="133.6,62 141.6,92 132,124"/>
      <polyline points="112,116 98,160 100,206"/>
      <polyline points="128,116 138,160 144,206"/>
    </g>
    <circle cx="81.5" cy="46.5" r="4" fill="#64748b"/>
    <circle cx="59" cy="23" r="5" fill="#64748b"/>
    <circle cx="98" cy="160" r="5" fill="#64748b"/>
    <circle cx="138" cy="160" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: brazo sobre la cabeza -->
  <g class="f3">
    <polyline points="100,64 101,38 98,6" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="115.8" cy="35" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="115.3,52 120,116"/>
      <polyline points="100,64 130.6,62"/>
    </g>
    
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="130.6,62 138.6,92 132,124"/>
      <polyline points="112,116 98,160 100,206"/>
      <polyline points="128,116 138,160 144,206"/>
    </g>
    <circle cx="101" cy="38" r="4" fill="#64748b"/>
    <circle cx="98" cy="6" r="5" fill="#64748b"/>
    <circle cx="98" cy="160" r="5" fill="#64748b"/>
    <circle cx="138" cy="160" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 4: pasa por detrás, el pecho se abre -->
  <g class="f4">
    <polyline points="100,64 122.5,46.5 141,23" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="120.2" cy="35.9" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="113.5,52 120,116"/>
      <polyline points="100,64 127,62"/>
    </g>
    
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="127,62 135,92 132,124"/>
      <polyline points="112,116 98,160 100,206"/>
      <polyline points="128,116 138,160 144,206"/>
    </g>
    <circle cx="122.5" cy="46.5" r="4" fill="#64748b"/>
    <circle cx="141" cy="23" r="5" fill="#64748b"/>
    <circle cx="98" cy="160" r="5" fill="#64748b"/>
    <circle cx="138" cy="160" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 5: apertura completa, mirada sigue a la mano -->
  <g class="f5">
    <polyline points="100,64 130.9,64.5 157.8,58.9" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="122" cy="37.7" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="112,52 120,116"/>
      <polyline points="100,64 124,62"/>
    </g>
    
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="124,62 132,92 132,124"/>
      <polyline points="112,116 98,160 100,206"/>
      <polyline points="128,116 138,160 144,206"/>
    </g>
    <circle cx="130.9" cy="64.5" r="4" fill="#64748b"/>
    <circle cx="157.8" cy="58.9" r="5" fill="#64748b"/>
    <circle cx="98" cy="160" r="5" fill="#64748b"/>
    <circle cx="138" cy="160" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 6: vuelve por el mismo arco -->
  <g class="f6">
    
    <circle cx="112.1" cy="35.7" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="116.2,52 120,116"/>
      <polyline points="100,64 132.4,62"/>
    </g>
    <polyline points="100,64 83.4,44.8 62.7,19.6" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="132.4,62 140.4,92 132,124"/>
      <polyline points="112,116 98,160 100,206"/>
      <polyline points="128,116 138,160 144,206"/>
    </g>
    <circle cx="83.4" cy="44.8" r="4" fill="#64748b"/>
    <circle cx="62.7" cy="19.6" r="5" fill="#64748b"/>
    <circle cx="98" cy="160" r="5" fill="#64748b"/>
    <circle cx="138" cy="160" r="5" fill="#64748b"/>
  </g>
</svg>
