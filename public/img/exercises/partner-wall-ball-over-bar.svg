<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<line x1="20" y1="210" x2="180" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- Barbell/bar in the middle (static) -->
<line x1="98" y1="100" x2="102" y2="210" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
<line x1="88" y1="100" x2="112" y2="100" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

<!-- f1: Left person in squat catching, Right person standing ready -->
<g class="f1" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
  <!-- LEFT person: catching in squat -->
  <circle cx="52" cy="118" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="52" y1="129" x2="50" y2="172"/>
  <!-- Arms up to catch -->
  <line x1="51" y1="144" x2="36" y2="130"/>
  <line x1="51" y1="144" x2="66" y2="125"/>
  <!-- Legs in squat -->
  <line x1="50" y1="172" x2="38" y2="195"/>
  <line x1="38" y1="195" x2="32" y2="210"/>
  <line x1="50" y1="172" x2="62" y2="192"/>
  <line x1="62" y1="192" x2="68" y2="210"/>
  <!-- Ball above left person -->
  <circle cx="78" cy="108" r="12" stroke="#64748b" stroke-width="3" fill="#1f2937"/>

  <!-- RIGHT person: standing ready -->
  <circle cx="155" cy="108" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="155" y1="119" x2="155" y2="170"/>
  <line x1="155" y1="132" x2="140" y2="148"/>
  <line x1="155" y1="132" x2="170" y2="148"/>
  <line x1="150" y1="170" x2="144" y2="210"/>
  <line x1="160" y1="170" x2="166" y2="210"/>
</g>

<!-- f2: Left person throws ball up over bar -->
<g class="f2" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
  <!-- LEFT person: standing/throwing, arms up -->
  <circle cx="52" cy="100" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="52" y1="111" x2="52" y2="162"/>
  <!-- Arms raised overhead (throwing) -->
  <line x1="52" y1="125" x2="40" y2="106"/>
  <line x1="52" y1="125" x2="68" y2="104"/>
  <line x1="50" y1="162" x2="44" y2="210"/>
  <line x1="54" y1="162" x2="60" y2="210"/>
  <!-- Ball traveling upward/right over bar -->
  <circle cx="100" cy="68" r="12" stroke="#64748b" stroke-width="3" fill="#1f2937"/>

  <!-- RIGHT person: ready to catch -->
  <circle cx="155" cy="108" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="155" y1="119" x2="155" y2="170"/>
  <line x1="155" y1="132" x2="142" y2="120"/>
  <line x1="155" y1="132" x2="168" y2="120"/>
  <line x1="150" y1="170" x2="144" y2="210"/>
  <line x1="160" y1="170" x2="166" y2="210"/>
</g>

<!-- f3: Right person catches ball in squat -->
<g class="f3" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
  <!-- LEFT person: standing, arms relaxed -->
  <circle cx="52" cy="108" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="52" y1="119" x2="52" y2="170"/>
  <line x1="52" y1="133" x2="38" y2="150"/>
  <line x1="52" y1="133" x2="66" y2="150"/>
  <line x1="48" y1="170" x2="42" y2="210"/>
  <line x1="56" y1="170" x2="62" y2="210"/>

  <!-- RIGHT person: catching squat -->
  <circle cx="155" cy="118" r="11" fill="#94a3b8" stroke="none"/>
  <line x1="155" y1="129" x2="154" y2="172"/>
  <line x1="155" y1="143" x2="140" y2="128"/>
  <line x1="155" y1="143" x2="170" y2="128"/>
  <line x1="150" y1="172" x2="142" y2="195"/>
  <line x1="142" y1="195" x2="136" y2="210"/>
  <line x1="158" y1="172" x2="166" y2="195"/>
  <line x1="166" y1="195" x2="172" y2="210"/>
  <!-- Ball above right person -->
  <circle cx="130" cy="108" r="12" stroke="#64748b" stroke-width="3" fill="#1f2937"/>
</g>

<text x="100" y="225" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">PARTNER WALL BALL OVER BAR</text>
</svg>
