<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230">
  <style>
    .f1{animation:sh1 7.8s linear infinite}.f2{animation:sh2 7.8s linear infinite}.f3{animation:sh3 7.8s linear infinite}.f4{animation:sh4 7.8s linear infinite}.f5{animation:sh5 7.8s linear infinite}.f6{animation:sh6 7.8s linear infinite}
    @keyframes sh1{0%,13.3%{opacity:1}16.7%,96.7%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,16.7%{opacity:0}20%,30%{opacity:1}33.3%,100%{opacity:0}}
    @keyframes sh3{0%,33.3%{opacity:0}36.7%,46.7%{opacity:1}50%,100%{opacity:0}}
    @keyframes sh4{0%,50%{opacity:0}53.3%,63.3%{opacity:1}66.7%,100%{opacity:0}}
    @keyframes sh5{0%,66.7%{opacity:0}70%,80%{opacity:1}83.3%,100%{opacity:0}}
    @keyframes sh6{0%,83.3%{opacity:0}86.7%,96.7%{opacity:1}100%,100%{opacity:0}}
  </style>
  <rect width="220" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">CANDLESTICK STRADDLE</text>
  <!-- Frame 1: sentado, piernas abiertas, brazos arriba -->
  <g class="f1">
    <circle cx="80" cy="126" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="80,140 82,198"/>
      <polyline points="82,198 118,198 154,198"/>
      <polyline points="80,146 84,118 86,92"/>
    </g>
    <circle cx="118" cy="198" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: rodando hacia atrás, rodillas al pecho -->
  <g class="f2">
    <circle cx="46" cy="160" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="56,170 92,196"/>
      <polyline points="92,196 112,168 134,178"/>
      <polyline points="58,172 84,164 108,168"/>
    </g>
    <circle cx="112" cy="168" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: candlestick: cadera arriba, piernas verticales -->
  <g class="f3">
    <circle cx="44" cy="198" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="58,194 80,150"/>
      <polyline points="80,150 82,104 84,58"/>
      <polyline points="60,198 88,203 114,204"/>
    </g>
    <circle cx="82" cy="104" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 4: rodando hacia adelante, piernas bajando -->
  <g class="f4">
    <circle cx="50" cy="170" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="60,180 88,196"/>
      <polyline points="88,196 114,152 140,122"/>
      <polyline points="62,182 88,170 112,160"/>
    </g>
    <circle cx="114" cy="152" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 5: sentado en straddle, brazos al frente -->
  <g class="f5">
    <circle cx="86" cy="126" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="84,140 82,198"/>
      <polyline points="82,198 118,198 154,198"/>
      <polyline points="84,146 108,152 132,156"/>
    </g>
    <circle cx="118" cy="198" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 6: inclinación al frente entre las piernas -->
  <g class="f6">
    <circle cx="130" cy="150" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="118,160 82,198"/>
      <polyline points="82,198 118,198 154,198"/>
      <polyline points="116,166 140,180 164,194"/>
    </g>
    <circle cx="118" cy="198" r="5" fill="#64748b"/>
  </g>
</svg>
