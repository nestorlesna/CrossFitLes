<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="207" x2="170" y2="207" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">TOWEL ISO CURL</text>

  <!-- Frame 1: brazo extendido, toalla pisada -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="94" cy="30" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="94" y1="43" x2="94" y2="114"/>
    <polyline points="94,114 88,162 88,204"/>
    <polyline points="94,114 104,162 106,204"/>
    <line x1="78" y1="204" x2="96" y2="204"/>
    <line x1="98" y1="204" x2="120" y2="204"/>
    <line x1="94" y1="58" x2="80" y2="112"/>
    <path d="M124,58 L118,204" stroke="#f59e0b" stroke-width="4"/>
    <polyline points="94,58 124,64 124,58"/>
    <circle cx="124" cy="60" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: codo a 90°, tirando -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="94" cy="30" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="94" y1="43" x2="94" y2="114"/>
    <polyline points="94,114 88,162 88,204"/>
    <polyline points="94,114 104,162 106,204"/>
    <line x1="78" y1="204" x2="96" y2="204"/>
    <line x1="98" y1="204" x2="120" y2="204"/>
    <polyline points="94,58 100,96 128,84"/>
    <path d="M128,84 L118,204" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="100" cy="96" r="4" fill="#64748b" stroke="none"/>
    <circle cx="128" cy="84" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: tensión máxima sostenida -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="94" cy="30" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="94" y1="43" x2="94" y2="114"/>
    <polyline points="94,114 88,162 88,204"/>
    <polyline points="94,114 104,162 106,204"/>
    <line x1="78" y1="204" x2="96" y2="204"/>
    <line x1="98" y1="204" x2="120" y2="204"/>
    <polyline points="94,58 100,96 128,82"/>
    <path d="M128,82 L118,204" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="100" cy="96" r="4" fill="#64748b" stroke="none"/>
    <circle cx="128" cy="82" r="4" fill="#64748b" stroke="none"/>
    <circle cx="152" cy="70" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="152" cy="82" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="152" cy="94" r="3" fill="#6ee7b7" stroke="none"/>
  </g>
</svg>
