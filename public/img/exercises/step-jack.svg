<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="207" x2="180" y2="207" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">STEP JACK</text>

  <!-- Frame 1: pies juntos, brazos abajo -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="32" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="45" x2="100" y2="116"/>
    <polyline points="100,116 94,162 94,204"/>
    <polyline points="100,116 106,162 106,204"/>
    <line x1="84" y1="204" x2="100" y2="204"/>
    <line x1="100" y1="204" x2="116" y2="204"/>
    <line x1="100" y1="60" x2="80" y2="112"/>
    <line x1="100" y1="60" x2="120" y2="112"/>
  </g>

  <!-- Frame 2: paso lateral derecho, brazos overhead -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="32" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="45" x2="100" y2="116"/>
    <polyline points="100,116 96,162 96,204"/>
    <polyline points="100,116 136,164 150,204"/>
    <line x1="86" y1="204" x2="102" y2="204"/>
    <line x1="142" y1="204" x2="162" y2="204"/>
    <line x1="100" y1="60" x2="66" y2="18"/>
    <line x1="100" y1="60" x2="134" y2="18"/>
    <circle cx="136" cy="164" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: paso lateral izquierdo, brazos overhead -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="32" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="100" y1="45" x2="100" y2="116"/>
    <polyline points="100,116 104,162 104,204"/>
    <polyline points="100,116 64,164 50,204"/>
    <line x1="98" y1="204" x2="114" y2="204"/>
    <line x1="38" y1="204" x2="58" y2="204"/>
    <line x1="100" y1="60" x2="66" y2="18"/>
    <line x1="100" y1="60" x2="134" y2="18"/>
    <circle cx="64" cy="164" r="4" fill="#64748b" stroke="none"/>
  </g>
</svg>
