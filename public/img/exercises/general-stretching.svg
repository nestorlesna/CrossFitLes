<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">ESTIRAMIENTO GENERAL</text>
  <!-- Frame 1: Estiramiento overhead - brazos arriba, cuerpo alargado -->
  <g class="f1">
    <circle cx="100" cy="52" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="65" x2="100" y2="126"/>
      <line x1="100" y1="76" x2="80" y2="34"/>
      <line x1="100" y1="76" x2="120" y2="34"/>
      <line x1="94" y1="126" x2="90" y2="168"/><line x1="90" y1="168" x2="88" y2="208"/>
      <line x1="106" y1="126" x2="110" y2="168"/><line x1="110" y1="168" x2="112" y2="208"/>
    </g>
    <circle cx="90" cy="168" r="5" fill="#64748b"/>
    <circle cx="110" cy="168" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: Flexión adelante - manos hacia los pies, piernas extendidas -->
  <g class="f2">
    <circle cx="124" cy="118" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="118" y1="126" x2="100" y2="136"/>
      <line x1="112" y1="128" x2="112" y2="186"/>
      <line x1="100" y1="136" x2="96" y2="172"/><line x1="96" y1="172" x2="94" y2="208"/>
      <line x1="100" y1="136" x2="106" y2="172"/><line x1="106" y1="172" x2="108" y2="208"/>
    </g>
    <circle cx="96" cy="172" r="5" fill="#64748b"/>
    <circle cx="106" cy="172" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: Estiramiento de cuádriceps - talón al glúteo -->
  <g class="f3">
    <circle cx="100" cy="40" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="53" x2="100" y2="118"/>
      <line x1="100" y1="66" x2="74" y2="86"/>
      <!-- Una mano toma el tobillo por detrás -->
      <line x1="100" y1="66" x2="126" y2="120"/>
      <line x1="94" y1="118" x2="92" y2="164"/><line x1="92" y1="164" x2="90" y2="208"/>
      <line x1="106" y1="118" x2="116" y2="150"/><line x1="116" y1="150" x2="126" y2="120"/>
    </g>
    <circle cx="92" cy="164" r="5" fill="#64748b"/>
    <circle cx="116" cy="150" r="5" fill="#64748b"/>
  </g>
</svg>
