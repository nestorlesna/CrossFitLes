<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <!-- Banded Pull-Up: 6 fotogramas -->
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <style>
    .f1{animation:sh1 8s linear infinite}.f2{animation:sh2 8s linear infinite}.f3{animation:sh3 8s linear infinite}.f4{animation:sh4 8s linear infinite}.f5{animation:sh5 8s linear infinite}.f6{animation:sh6 8s linear infinite}
    @keyframes sh1{0%,13.3%{opacity:1}16.7%,96.7%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,16.7%{opacity:0}20%,30%{opacity:1}33.3%,100%{opacity:0}}
    @keyframes sh3{0%,33.3%{opacity:0}36.7%,46.7%{opacity:1}50%,100%{opacity:0}}
    @keyframes sh4{0%,50%{opacity:0}53.3%,63.3%{opacity:1}66.7%,100%{opacity:0}}
    @keyframes sh5{0%,66.7%{opacity:0}70%,80%{opacity:1}83.3%,100%{opacity:0}}
    @keyframes sh6{0%,83.3%{opacity:0}86.7%,96.7%{opacity:1}100%{opacity:0}}
  </style>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#374151" stroke-width="4" stroke-linecap="round"><line x1="38" y1="28" x2="38" y2="210"/><line x1="162" y1="28" x2="162" y2="210"/></g>
  <!-- Frame 1: colgado, brazos extendidos, pie en la banda -->
  <g class="f1" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><g stroke="#f59e0b" stroke-width="2.5"><line x1="103" y1="28" x2="104" y2="203"/><line x1="115" y1="28" x2="114" y2="203"/><line x1="104" y1="203" x2="114" y2="203"/></g><line x1="88" y1="76" x2="71.5" y2="54.6"/><line x1="71.5" y1="54.6" x2="67" y2="28"/><circle cx="71.5" cy="54.6" r="3" fill="#64748b" stroke="none"/><line x1="112" y1="76" x2="128.5" y2="54.6"/><line x1="128.5" y1="54.6" x2="133" y2="28"/><circle cx="128.5" cy="54.6" r="3" fill="#64748b" stroke="none"/><circle cx="100" cy="60" r="12" fill="#94a3b8" stroke="none"/><line x1="100" y1="72" x2="100" y2="136"/><line x1="88" y1="76" x2="112" y2="76"/><line x1="92" y1="136" x2="109" y2="136"/><line x1="109" y1="136" x2="109" y2="169"/><line x1="109" y1="169" x2="109" y2="202"/><line x1="92" y1="136" x2="88" y2="166"/><line x1="88" y1="166" x2="84" y2="186"/><circle cx="109" cy="169" r="4" fill="#64748b" stroke="none"/><circle cx="88" cy="166" r="4" fill="#64748b" stroke="none"/></g>
  <!-- Frame 2: escápulas abajo, arranca la tracción -->
  <g class="f2" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><g stroke="#f59e0b" stroke-width="2.5"><line x1="103" y1="28" x2="104" y2="193.3"/><line x1="115" y1="28" x2="114" y2="193.3"/><line x1="104" y1="193.3" x2="114" y2="193.3"/></g><line x1="88" y1="66.3" x2="63.6" y2="54.8"/><line x1="63.6" y1="54.8" x2="67" y2="28"/><circle cx="63.6" cy="54.8" r="3" fill="#64748b" stroke="none"/><line x1="112" y1="66.3" x2="136.4" y2="54.8"/><line x1="136.4" y1="54.8" x2="133" y2="28"/><circle cx="136.4" cy="54.8" r="3" fill="#64748b" stroke="none"/><circle cx="100" cy="50.3" r="12" fill="#94a3b8" stroke="none"/><line x1="100" y1="62.3" x2="100" y2="126.3"/><line x1="88" y1="66.3" x2="112" y2="66.3"/><line x1="92" y1="126.3" x2="109" y2="126.3"/><line x1="109" y1="126.3" x2="109" y2="159.3"/><line x1="109" y1="159.3" x2="109" y2="192.3"/><line x1="92" y1="126.3" x2="88" y2="156.3"/><line x1="88" y1="156.3" x2="84" y2="176.3"/><circle cx="109" cy="159.3" r="4" fill="#64748b" stroke="none"/><circle cx="88" cy="156.3" r="4" fill="#64748b" stroke="none"/></g>
