  <!-- Frame 6: casi extendido, sin soltar la tensión -->
  <g class="f6" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><g stroke="#f59e0b" stroke-width="2.5"><line x1="103" y1="28" x2="104" y2="193.3"/><line x1="115" y1="28" x2="114" y2="193.3"/><line x1="104" y1="193.3" x2="114" y2="193.3"/></g><line x1="88" y1="66.3" x2="63.6" y2="54.8"/><line x1="63.6" y1="54.8" x2="67" y2="28"/><circle cx="63.6" cy="54.8" r="3" fill="#64748b" stroke="none"/><line x1="112" y1="66.3" x2="136.4" y2="54.8"/><line x1="136.4" y1="54.8" x2="133" y2="28"/><circle cx="136.4" cy="54.8" r="3" fill="#64748b" stroke="none"/><circle cx="100" cy="50.3" r="12" fill="#94a3b8" stroke="none"/><line x1="100" y1="62.3" x2="100" y2="126.3"/><line x1="88" y1="66.3" x2="112" y2="66.3"/><line x1="92" y1="126.3" x2="109" y2="126.3"/><line x1="109" y1="126.3" x2="109" y2="159.3"/><line x1="109" y1="159.3" x2="109" y2="192.3"/><line x1="92" y1="126.3" x2="88" y2="156.3"/><line x1="88" y1="156.3" x2="84" y2="176.3"/><circle cx="109" cy="159.3" r="4" fill="#64748b" stroke="none"/><circle cx="88" cy="156.3" r="4" fill="#64748b" stroke="none"/></g>
  <line x1="34" y1="28" x2="166" y2="28" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <text x="100" y="225" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle" letter-spacing="0.5">BANDED PULL-UP</text>
</svg>
