  <!-- Frame 4: mentón por encima de la barra -->
  <g class="f4" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><g stroke="#f59e0b" stroke-width="2.5"><line x1="103" y1="28" x2="104" y2="159"/><line x1="115" y1="28" x2="114" y2="159"/><line x1="104" y1="159" x2="114" y2="159"/></g><line x1="88" y1="32" x2="72.9" y2="54.4"/><line x1="72.9" y1="54.4" x2="67" y2="28"/><circle cx="72.9" cy="54.4" r="3" fill="#64748b" stroke="none"/><line x1="112" y1="32" x2="127.1" y2="54.4"/><line x1="127.1" y1="54.4" x2="133" y2="28"/><circle cx="127.1" cy="54.4" r="3" fill="#64748b" stroke="none"/><circle cx="100" cy="16" r="12" fill="#94a3b8" stroke="none"/><line x1="100" y1="28" x2="100" y2="92"/><line x1="88" y1="32" x2="112" y2="32"/><line x1="92" y1="92" x2="109" y2="92"/><line x1="109" y1="92" x2="109" y2="125"/><line x1="109" y1="125" x2="109" y2="158"/><line x1="92" y1="92" x2="88" y2="122"/><line x1="88" y1="122" x2="84" y2="142"/><circle cx="109" cy="125" r="4" fill="#64748b" stroke="none"/><circle cx="88" cy="122" r="4" fill="#64748b" stroke="none"/></g>
  <!-- Frame 5: bajada controlada -->
