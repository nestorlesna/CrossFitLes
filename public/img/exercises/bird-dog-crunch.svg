<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <style>
    .f1{animation:sh1 4s linear infinite}
    .f2{animation:sh2 4s linear infinite}
    .f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>

  <!-- Frame 1: Cuadrupedia neutra -->
  <g class="f1">
    <circle cx="48" cy="120" r="12" fill="#94a3b8"/>
    <circle cx="150" cy="120" r="5" fill="#64748b"/>
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <!-- columna horizontal (hombro -> cadera) -->
      <line x1="60" y1="124" x2="150" y2="120"/>
      <!-- brazo de apoyo -->
      <line x1="62" y1="124" x2="62" y2="200"/>
      <line x1="52" y1="204" x2="72" y2="204"/>
      <!-- pierna de apoyo -->
      <line x1="150" y1="120" x2="150" y2="200"/>
      <line x1="140" y1="204" x2="160" y2="204"/>
    </g>
  </g>

  <!-- Frame 2: Extension de brazo y pierna opuestos -->
  <g class="f2">
    <circle cx="48" cy="118" r="12" fill="#94a3b8"/>
    <circle cx="150" cy="118" r="5" fill="#64748b"/>
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <line x1="60" y1="120" x2="150" y2="118"/>
      <!-- brazo de apoyo -->
      <line x1="62" y1="120" x2="62" y2="200"/>
      <line x1="52" y1="204" x2="72" y2="204"/>
      <!-- brazo extendido al frente -->
      <line x1="60" y1="120" x2="22" y2="92"/>
      <!-- pierna de apoyo -->
      <line x1="150" y1="118" x2="150" y2="200"/>
      <line x1="140" y1="204" x2="160" y2="204"/>
      <!-- pierna extendida atras -->
      <line x1="150" y1="118" x2="186" y2="96"/>
    </g>
  </g>

  <!-- Frame 3: Crunch - codo y rodilla se juntan bajo el cuerpo -->
  <g class="f3">
    <circle cx="58" cy="128" r="12" fill="#94a3b8"/>
    <circle cx="150" cy="118" r="5" fill="#64748b"/>
    <circle cx="104" cy="150" r="4" fill="#64748b"/>
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <line x1="68" y1="130" x2="150" y2="118"/>
      <!-- brazo de apoyo -->
      <line x1="70" y1="130" x2="68" y2="200"/>
      <line x1="58" y1="204" x2="78" y2="204"/>
      <!-- codo flexionado hacia el centro -->
      <line x1="70" y1="128" x2="104" y2="150"/>
      <!-- pierna de apoyo -->
      <line x1="150" y1="118" x2="150" y2="200"/>
      <line x1="140" y1="204" x2="160" y2="204"/>
      <!-- rodilla flexionada hacia el centro -->
      <line x1="150" y1="118" x2="104" y2="150"/>
    </g>
  </g>

  <line x1="20" y1="208" x2="180" y2="208" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="223" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle" letter-spacing="0.5">BIRD DOG CRUNCH</text>
</svg>
