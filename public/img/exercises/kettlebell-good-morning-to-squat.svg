<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569">KB GOOD MORNING TO SQUAT</text>

<!-- F1: Standing, KB held at chest with both hands -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="26" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="39" x2="100" y2="108"/>
  <!-- Arms going down and in to hold KB at chest -->
  <line x1="100" y1="55" x2="86" y2="78"/>
  <line x1="86" y1="78" x2="92" y2="92"/>
  <line x1="100" y1="55" x2="114" y2="78"/>
  <line x1="114" y1="78" x2="108" y2="92"/>
  <!-- KB at chest level -->
  <circle cx="100" cy="92" r="9" fill="#64748b" stroke="none"/>
  <rect x="95" y="80" width="10" height="6" rx="2" fill="#475569" stroke="none"/>
  <!-- Legs -->
  <line x1="100" y1="108" x2="86" y2="162"/>
  <line x1="86" y1="162" x2="82" y2="205"/>
  <line x1="100" y1="108" x2="114" y2="162"/>
  <line x1="114" y1="162" x2="118" y2="205"/>
  <circle cx="86" cy="162" r="5" fill="#64748b" stroke="none"/>
  <circle cx="114" cy="162" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- F2: Hip hinge (good morning) - torso parallel to ground, legs straight -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="48" cy="108" r="13" fill="#94a3b8" stroke="none"/>
  <!-- Horizontal torso from head to hip -->
  <line x1="60" y1="108" x2="115" y2="108"/>
  <!-- Arms hanging down holding KB -->
  <line x1="78" y1="108" x2="78" y2="138"/>
  <line x1="92" y1="108" x2="92" y2="138"/>
  <!-- KB hanging below chest -->
  <circle cx="85" cy="148" r="9" fill="#64748b" stroke="none"/>
  <rect x="80" y="138" width="10" height="6" rx="2" fill="#475569" stroke="none"/>
  <!-- Legs straight down -->
  <line x1="115" y1="108" x2="108" y2="160"/>
  <line x1="108" y1="160" x2="100" y2="205"/>
  <line x1="115" y1="108" x2="122" y2="160"/>
  <line x1="122" y1="160" x2="130" y2="205"/>
  <circle cx="108" cy="160" r="5" fill="#64748b" stroke="none"/>
  <circle cx="122" cy="160" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- F3: Full squat with KB at chest -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="78" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="91" x2="100" y2="142"/>
  <!-- Arms holding KB at chest -->
  <line x1="100" y1="104" x2="86" y2="120"/>
  <line x1="86" y1="120" x2="92" y2="132"/>
  <line x1="100" y1="104" x2="114" y2="120"/>
  <line x1="114" y1="120" x2="108" y2="132"/>
  <!-- KB at chest -->
  <circle cx="100" cy="130" r="9" fill="#64748b" stroke="none"/>
  <rect x="95" y="118" width="10" height="6" rx="2" fill="#475569" stroke="none"/>
  <!-- Bent legs in deep squat -->
  <line x1="100" y1="142" x2="74" y2="170"/>
  <line x1="74" y1="170" x2="80" y2="205"/>
  <line x1="100" y1="142" x2="126" y2="170"/>
  <line x1="126" y1="170" x2="120" y2="205"/>
  <circle cx="74" cy="170" r="5" fill="#64748b" stroke="none"/>
  <circle cx="126" cy="170" r="5" fill="#64748b" stroke="none"/>
</g>
</svg>
