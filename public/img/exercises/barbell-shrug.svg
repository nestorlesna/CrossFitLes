<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">BARBELL SHRUG</text>

<!-- F1: Standing, shoulders relaxed, bar at thighs -->
<g class="f1" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="100" cy="34" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="46" x2="100" y2="112"/>
  <!-- Shoulders -->
  <line x1="84" y1="58" x2="116" y2="58"/>
  <!-- Arms straight down to bar -->
  <line x1="84" y1="58" x2="80" y2="138"/>
  <line x1="116" y1="58" x2="120" y2="138"/>
  <!-- Bar at thigh level -->
  <line x1="64" y1="138" x2="136" y2="138" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="64" cy="138" r="7" fill="#64748b" stroke="none"/>
  <circle cx="136" cy="138" r="7" fill="#64748b" stroke="none"/>
  <!-- Legs -->
  <line x1="100" y1="112" x2="92" y2="160"/>
  <line x1="92" y1="160" x2="90" y2="202"/>
  <line x1="100" y1="112" x2="108" y2="160"/>
  <line x1="108" y1="160" x2="110" y2="202"/>
  <line x1="84" y1="202" x2="96" y2="202"/>
  <line x1="104" y1="202" x2="116" y2="202"/>
</g>

<!-- F2: Shoulders rising (mid shrug) -->
<g class="f2" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="100" cy="34" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="46" x2="100" y2="112"/>
  <!-- Shoulders elevated -->
  <line x1="84" y1="52" x2="116" y2="52"/>
  <line x1="84" y1="52" x2="80" y2="132"/>
  <line x1="116" y1="52" x2="120" y2="132"/>
  <line x1="64" y1="132" x2="136" y2="132" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="64" cy="132" r="7" fill="#64748b" stroke="none"/>
  <circle cx="136" cy="132" r="7" fill="#64748b" stroke="none"/>
  <line x1="100" y1="112" x2="92" y2="160"/>
  <line x1="92" y1="160" x2="90" y2="202"/>
  <line x1="100" y1="112" x2="108" y2="160"/>
  <line x1="108" y1="160" x2="110" y2="202"/>
  <line x1="84" y1="202" x2="96" y2="202"/>
  <line x1="104" y1="202" x2="116" y2="202"/>
</g>

<!-- F3: Shoulders fully shrugged up near ears -->
<g class="f3" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
  <circle cx="100" cy="34" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="46" x2="100" y2="112"/>
  <!-- Shoulders high, traps engaged -->
  <line x1="82" y1="44" x2="118" y2="44"/>
  <line x1="82" y1="44" x2="80" y2="126"/>
  <line x1="118" y1="44" x2="120" y2="126"/>
  <line x1="64" y1="126" x2="136" y2="126" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="64" cy="126" r="7" fill="#64748b" stroke="none"/>
  <circle cx="136" cy="126" r="7" fill="#64748b" stroke="none"/>
  <line x1="100" y1="112" x2="92" y2="160"/>
  <line x1="92" y1="160" x2="90" y2="202"/>
  <line x1="100" y1="112" x2="108" y2="160"/>
  <line x1="108" y1="160" x2="110" y2="202"/>
  <line x1="84" y1="202" x2="96" y2="202"/>
  <line x1="104" y1="202" x2="116" y2="202"/>
</g>
</svg>
