<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="207" x2="170" y2="207" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <line x1="168" y1="20" x2="168" y2="207" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">CALF RAISE HOLD</text>

  <!-- Frame 1: de pie, talones apoyados -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="94" cy="38" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="94" y1="51" x2="94" y2="122"/>
    <polyline points="94,122 90,166 90,204"/>
    <polyline points="94,122 102,166 102,204"/>
    <line x1="80" y1="204" x2="102" y2="204"/>
    <line x1="94" y1="66" x2="162" y2="70"/>
    <circle cx="90" cy="166" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: subiendo a puntas de pie -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="94" cy="30" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="94" y1="43" x2="94" y2="114"/>
    <polyline points="94,114 90,160 92,192"/>
    <polyline points="94,114 102,160 104,192"/>
    <line x1="92" y1="192" x2="106" y2="204"/>
    <line x1="94" y1="58" x2="162" y2="64"/>
    <circle cx="90" cy="160" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: hold arriba, talones altos -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="94" cy="24" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="94" y1="37" x2="94" y2="108"/>
    <polyline points="94,108 90,154 92,186"/>
    <polyline points="94,108 102,154 104,186"/>
    <line x1="92" y1="186" x2="108" y2="204"/>
    <line x1="94" y1="52" x2="162" y2="58"/>
    <circle cx="90" cy="154" r="4" fill="#64748b" stroke="none"/>
    <circle cx="52" cy="150" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="52" cy="162" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="52" cy="174" r="3" fill="#6ee7b7" stroke="none"/>
  </g>
</svg>
