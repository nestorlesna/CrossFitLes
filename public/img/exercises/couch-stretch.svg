<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>

  <!-- Pared (fija en los 3 frames): la pierna trasera apoya el pie/empeine contra ella -->
  <line x1="158" y1="55" x2="158" y2="210" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="158" y1="55" x2="170" y2="55" stroke="#374151" stroke-width="4" stroke-linecap="round"/>

  <!-- F1: arrodillado, ubicando la rodilla trasera en el piso y el pie contra la pared -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="68" cy="46" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="70" y1="58" x2="78" y2="112"/>
    <!-- brazo apoyado sobre la rodilla delantera -->
    <line x1="70" y1="72" x2="52" y2="118"/>
    <!-- pierna delantera (izq), rodilla a 90 grados -->
    <line x1="78" y1="112" x2="48" y2="150"/>
    <line x1="48" y1="150" x2="30" y2="205"/>
    <line x1="20" y1="205" x2="42" y2="205"/>
    <!-- pierna trasera: rodilla apoyada cerca de la pared, empeine subiendo contra la pared -->
    <line x1="78" y1="112" x2="120" y2="175"/>
    <line x1="120" y1="175" x2="130" y2="205"/>
    <circle cx="130" cy="205" r="6" fill="#64748b" stroke="none"/>
    <line x1="120" y1="175" x2="150" y2="185" stroke-width="4"/>
  </g>

  <!-- F2: transición, cadera empezando a empujar hacia adelante y abajo -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="66" cy="52" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="68" y1="64" x2="80" y2="116"/>
    <line x1="68" y1="78" x2="50" y2="120"/>
    <line x1="80" y1="116" x2="46" y2="152"/>
    <line x1="46" y1="152" x2="28" y2="205"/>
    <line x1="18" y1="205" x2="40" y2="205"/>
    <!-- rodilla trasera pegada al piso junto a la pared, canilla y pie subiendo contra la pared -->
    <line x1="80" y1="116" x2="128" y2="185"/>
    <line x1="128" y1="185" x2="132" y2="205"/>
    <circle cx="132" cy="205" r="6" fill="#64748b" stroke="none"/>
    <line x1="128" y1="185" x2="152" y2="150" stroke-width="4"/>
  </g>

  <!-- F3: couch stretch profundo, torso erguido, cadera empujada adelante, pie firme contra la pared -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="72" cy="44" r="13" fill="#94a3b8" stroke="none"/>
    <line x1="72" y1="57" x2="76" y2="118"/>
    <!-- brazo arriba, torso vertical y erguido (glúteo trasero contraído) -->
    <line x1="72" y1="70" x2="82" y2="30"/>
    <!-- pierna delantera muy flexionada, rodilla adelantada -->
    <line x1="76" y1="118" x2="40" y2="150"/>
    <line x1="40" y1="150" x2="24" y2="205"/>
    <line x1="14" y1="205" x2="36" y2="205"/>
    <!-- pierna trasera: rodilla en el piso pegada a la pared, canilla y empeine totalmente verticales contra la pared -->
    <line x1="76" y1="118" x2="132" y2="200"/>
    <circle cx="132" cy="200" r="6" fill="#64748b" stroke="none"/>
    <line x1="132" y1="200" x2="150" y2="130" stroke-width="4"/>
  </g>

  <line x1="10" y1="210" x2="158" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="monospace" font-size="10" fill="#475569">COUCH STRETCH</text>
</svg>
