<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">SQUAT TO TOE RAISE</text>
  <!-- Frame 1: Squat abajo -->
  <g class="f1">
    <circle cx="100" cy="88" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="102" x2="97" y2="152"/><line x1="78" y1="114" x2="122" y2="114"/>
      <line x1="78" y1="114" x2="70" y2="146"/><line x1="122" y1="114" x2="130" y2="146"/>
      <line x1="93" y1="152" x2="66" y2="170"/><line x1="66" y1="170" x2="70" y2="205"/>
      <line x1="101" y1="152" x2="134" y2="170"/><line x1="134" y1="170" x2="130" y2="205"/>
      <line x1="54" y1="205" x2="82" y2="205"/><line x1="118" y1="205" x2="144" y2="205"/>
    </g>
    <circle cx="66" cy="170" r="5.5" fill="#64748b"/><circle cx="134" cy="170" r="5.5" fill="#64748b"/>
  </g>
  <!-- Frame 2: De pie, en transición -->
  <g class="f2">
    <circle cx="100" cy="26" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="40" x2="100" y2="108"/><line x1="78" y1="52" x2="122" y2="52"/>
      <line x1="78" y1="52" x2="72" y2="94"/><line x1="122" y1="52" x2="128" y2="94"/>
      <line x1="95" y1="108" x2="93" y2="162"/><line x1="93" y1="162" x2="93" y2="205"/>
      <line x1="105" y1="108" x2="107" y2="162"/><line x1="107" y1="162" x2="107" y2="205"/>
      <line x1="78" y1="205" x2="106" y2="205"/><line x1="94" y1="205" x2="122" y2="205"/>
    </g>
  </g>
  <!-- Frame 3: En puntas de pie, brazos arriba (talones despegados) -->
  <g class="f3">
    <circle cx="100" cy="18" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="32" x2="100" y2="100"/><line x1="78" y1="44" x2="122" y2="44"/>
      <line x1="78" y1="44" x2="76" y2="12"/><line x1="122" y1="44" x2="124" y2="12"/>
      <line x1="95" y1="100" x2="93" y2="156"/><line x1="93" y1="156" x2="93" y2="198"/>
      <line x1="105" y1="100" x2="107" y2="156"/><line x1="107" y1="156" x2="107" y2="198"/>
      <line x1="93" y1="198" x2="106" y2="207"/><line x1="107" y1="198" x2="120" y2="207"/>
      <line x1="100" y1="207" x2="122" y2="207"/>
    </g>
    <circle cx="93" cy="156" r="5.5" fill="#64748b"/><circle cx="107" cy="156" r="5.5" fill="#64748b"/>
  </g>
</svg>
