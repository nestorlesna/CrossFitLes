<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <style>
    .f1{animation:sh1 4s linear infinite}
    .f2{animation:sh2 4s linear infinite}
    .f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>

  <!-- Frame 1: Inclinado, brazo extendido con mancuerna abajo -->
  <g class="f1">
    <circle cx="52" cy="96" r="12" fill="#94a3b8"/>
    <circle cx="140" cy="108" r="5" fill="#64748b"/>
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <!-- columna inclinada (hombro -> cadera) -->
      <line x1="62" y1="100" x2="140" y2="108"/>
      <!-- brazo de remo extendido hacia el suelo -->
      <line x1="68" y1="102" x2="78" y2="160"/>
      <!-- pierna -->
      <line x1="140" y1="108" x2="150" y2="200"/>
      <line x1="140" y1="204" x2="160" y2="204"/>
      <!-- pierna adelantada de apoyo -->
      <line x1="120" y1="106" x2="108" y2="200"/>
    </g>
    <!-- mancuerna -->
    <rect x="70" y="158" width="16" height="7" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Frame 2: Tirando, codo a medio camino -->
  <g class="f2">
    <circle cx="52" cy="96" r="12" fill="#94a3b8"/>
    <circle cx="140" cy="108" r="5" fill="#64748b"/>
    <circle cx="80" cy="120" r="4" fill="#64748b"/>
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <line x1="62" y1="100" x2="140" y2="108"/>
      <!-- brazo flexionando, codo subiendo -->
      <line x1="68" y1="102" x2="80" y2="120"/>
      <line x1="80" y1="120" x2="82" y2="148"/>
      <line x1="140" y1="108" x2="150" y2="200"/>
      <line x1="140" y1="204" x2="160" y2="204"/>
      <line x1="120" y1="106" x2="108" y2="200"/>
    </g>
    <rect x="74" y="146" width="16" height="7" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Frame 3: Mancuerna arriba, codo pasa la espalda -->
  <g class="f3">
    <circle cx="52" cy="96" r="12" fill="#94a3b8"/>
    <circle cx="140" cy="108" r="5" fill="#64748b"/>
    <circle cx="86" cy="86" r="4" fill="#64748b"/>
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <line x1="62" y1="100" x2="140" y2="108"/>
      <!-- codo alto, mancuerna a la cadera -->
      <line x1="68" y1="102" x2="86" y2="86"/>
      <line x1="86" y1="86" x2="92" y2="116"/>
      <line x1="140" y1="108" x2="150" y2="200"/>
      <line x1="140" y1="204" x2="160" y2="204"/>
      <line x1="120" y1="106" x2="108" y2="200"/>
    </g>
    <rect x="84" y="114" width="16" height="7" rx="2" fill="#cbd5e1"/>
  </g>

  <line x1="20" y1="208" x2="180" y2="208" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="223" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle" letter-spacing="0.5">DUMBBELL ROW</text>
</svg>
