<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230">
  <style>
    .f1{animation:sh1 7.8s linear infinite}.f2{animation:sh2 7.8s linear infinite}.f3{animation:sh3 7.8s linear infinite}.f4{animation:sh4 7.8s linear infinite}.f5{animation:sh5 7.8s linear infinite}.f6{animation:sh6 7.8s linear infinite}
    @keyframes sh1{0%,13.3%{opacity:1}16.7%,96.7%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,16.7%{opacity:0}20%,30%{opacity:1}33.3%,100%{opacity:0}}
    @keyframes sh3{0%,33.3%{opacity:0}36.7%,46.7%{opacity:1}50%,100%{opacity:0}}
    @keyframes sh4{0%,50%{opacity:0}53.3%,63.3%{opacity:1}66.7%,100%{opacity:0}}
    @keyframes sh5{0%,66.7%{opacity:0}70%,80%{opacity:1}83.3%,100%{opacity:0}}
    @keyframes sh6{0%,83.3%{opacity:0}86.7%,96.7%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="220" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">BANDED LAT PULLDOWN</text>
  <!-- Frame 1: brazos arriba con la banda tensa -->
  <g class="f1">
    <line x1="150" y1="8" x2="118" y2="16" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><circle cx="150" cy="8" r="4" fill="#475569"/>
    <circle cx="90" cy="38" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="90,116 90,60"/>
      <polyline points="90,116 102,161 92,206"/>
      <polyline points="90,64 112,40 118,16"/>
    </g>
    <circle cx="102" cy="161" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 2: inicio del jalon -->
  <g class="f2">
    <line x1="150" y1="8" x2="116" y2="30" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><circle cx="150" cy="8" r="4" fill="#475569"/>
    <circle cx="90" cy="38" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="90,116 90,60"/>
      <polyline points="90,116 102,161 92,206"/>
      <polyline points="90,64 110,48 116,30"/>
    </g>
    <circle cx="102" cy="161" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 3: codos hacia abajo -->
  <g class="f3">
    <line x1="150" y1="8" x2="112" y2="48" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><circle cx="150" cy="8" r="4" fill="#475569"/>
    <circle cx="90" cy="38" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="90,116 90,60"/>
      <polyline points="90,116 102,161 92,206"/>
      <polyline points="90,64 100,76 112,48"/>
    </g>
    <circle cx="102" cy="161" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 4: banda a la altura del pecho -->
  <g class="f4">
    <line x1="150" y1="8" x2="108" y2="70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><circle cx="150" cy="8" r="4" fill="#475569"/>
    <circle cx="90" cy="38" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="90,116 90,60"/>
      <polyline points="90,116 102,161 92,206"/>
      <polyline points="90,64 84,92 108,70"/>
    </g>
    <circle cx="102" cy="161" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 5: sube controlado -->
  <g class="f5">
    <line x1="150" y1="8" x2="112" y2="48" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><circle cx="150" cy="8" r="4" fill="#475569"/>
    <circle cx="90" cy="38" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="90,116 90,60"/>
      <polyline points="90,116 102,161 92,206"/>
      <polyline points="90,64 100,76 112,48"/>
    </g>
    <circle cx="102" cy="161" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 6: casi arriba -->
  <g class="f6">
    <line x1="150" y1="8" x2="116" y2="30" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><circle cx="150" cy="8" r="4" fill="#475569"/>
    <circle cx="90" cy="38" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="90,116 90,60"/>
      <polyline points="90,116 102,161 92,206"/>
      <polyline points="90,64 110,48 116,30"/>
    </g>
    <circle cx="102" cy="161" r="4" fill="#64748b"/>
  </g>
</svg>
