<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200">
  <style>
    .f1{animation:sh1 8s linear infinite}.f2{animation:sh2 8s linear infinite}.f3{animation:sh3 8s linear infinite}.f4{animation:sh4 8s linear infinite}.f5{animation:sh5 8s linear infinite}.f6{animation:sh6 8s linear infinite}.f7{animation:sh7 8s linear infinite}.f8{animation:sh8 8s linear infinite}
    @keyframes sh1{0%,10.2%{opacity:1}12.5%,100%{opacity:0}}
    @keyframes sh2{0%,12.5%{opacity:0}14.8%,22.7%{opacity:1}25%,100%{opacity:0}}
    @keyframes sh3{0%,25%{opacity:0}27.3%,35.2%{opacity:1}37.5%,100%{opacity:0}}
    @keyframes sh4{0%,37.5%{opacity:0}39.8%,47.7%{opacity:1}50%,100%{opacity:0}}
    @keyframes sh5{0%,50%{opacity:0}52.3%,60.2%{opacity:1}62.5%,100%{opacity:0}}
    @keyframes sh6{0%,62.5%{opacity:0}64.8%,72.7%{opacity:1}75%,100%{opacity:0}}
    @keyframes sh7{0%,75%{opacity:0}77.3%,85.2%{opacity:1}87.5%,100%{opacity:0}}
    @keyframes sh8{0%,87.5%{opacity:0}89.8%,97.7%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="260" height="200" fill="#111827" rx="12"/>
  <line x1="20" y1="165" x2="240" y2="165" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- Touch cones -->
  <rect x="22" y="148" width="10" height="17" rx="2" fill="#374151"/>
  <rect x="228" y="148" width="10" height="17" rx="2" fill="#374151"/>
  <text x="130" y="182" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">SHUTTLE RUN</text>

  <!-- F1: Sprintando a la derecha, saliendo del cono izquierdo -->
  <g class="f1">
    <circle cx="60" cy="88" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="60" y1="100" x2="62" y2="148"/>
      <line x1="42" y1="110" x2="78" y2="108"/>
      <line x1="42" y1="110" x2="26" y2="130"/>
      <line x1="78" y1="108" x2="94" y2="88"/>
      <line x1="58" y1="148" x2="34" y2="128"/><line x1="34" y1="128" x2="26" y2="162"/>
      <line x1="66" y1="148" x2="90" y2="130"/><line x1="90" y1="130" x2="96" y2="162"/>
    </g>
    <circle cx="34" cy="128" r="5" fill="#64748b"/>
    <circle cx="90" cy="130" r="5" fill="#64748b"/>
  </g>

  <!-- F2: Sprintando a la derecha, zancada opuesta -->
  <g class="f2">
    <circle cx="110" cy="86" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="110" y1="98" x2="112" y2="146"/>
      <line x1="92" y1="106" x2="128" y2="104"/>
      <line x1="92" y1="106" x2="80" y2="86"/>
      <line x1="128" y1="104" x2="146" y2="122"/>
      <line x1="108" y1="146" x2="130" y2="128"/><line x1="130" y1="128" x2="138" y2="160"/>
      <line x1="116" y1="146" x2="94" y2="126"/><line x1="94" y1="126" x2="86" y2="160"/>
    </g>
    <circle cx="130" cy="128" r="5" fill="#64748b"/>
    <circle cx="94" cy="126" r="5" fill="#64748b"/>
  </g>

  <!-- F3: Desacelerando, aproximándose al cono derecho -->
  <g class="f3">
    <circle cx="160" cy="82" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="160" y1="94" x2="162" y2="144"/>
      <line x1="148" y1="102" x2="176" y2="100"/>
      <line x1="148" y1="102" x2="140" y2="122"/>
      <line x1="176" y1="100" x2="184" y2="82"/>
      <line x1="158" y1="144" x2="170" y2="128"/><line x1="170" y1="128" x2="176" y2="160"/>
      <line x1="166" y1="144" x2="156" y2="128"/><line x1="156" y1="128" x2="150" y2="160"/>
    </g>
  </g>

  <!-- F4: Agachado tocando el cono derecho -->
  <g class="f4">
    <circle cx="200" cy="108" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="200" y1="120" x2="198" y2="152"/>
      <line x1="182" y1="126" x2="218" y2="124"/>
      <line x1="218" y1="124" x2="232" y2="148"/>
      <line x1="182" y1="126" x2="170" y2="108"/>
      <line x1="194" y1="152" x2="178" y2="164"/>
      <line x1="202" y1="152" x2="214" y2="162"/>
    </g>
    <circle cx="194" cy="152" r="5" fill="#64748b"/>
  </g>

  <!-- F5: Empuje desde el agache, comenzando a correr a la izquierda -->
  <g class="f5">
    <circle cx="196" cy="90" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="196" y1="102" x2="194" y2="146"/>
      <line x1="180" y1="108" x2="212" y2="110"/>
      <line x1="212" y1="110" x2="224" y2="128"/>
      <line x1="180" y1="108" x2="168" y2="90"/>
      <line x1="192" y1="146" x2="206" y2="130"/><line x1="206" y1="130" x2="212" y2="162"/>
      <line x1="200" y1="146" x2="180" y2="128"/><line x1="180" y1="128" x2="174" y2="162"/>
    </g>
    <circle cx="206" cy="130" r="5" fill="#64748b"/>
    <circle cx="180" cy="128" r="5" fill="#64748b"/>
  </g>

  <!-- F6: Sprintando a la izquierda -->
  <g class="f6">
    <circle cx="180" cy="88" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="180" y1="100" x2="178" y2="148"/>
      <line x1="162" y1="108" x2="198" y2="110"/>
      <line x1="198" y1="110" x2="214" y2="130"/>
      <line x1="162" y1="108" x2="148" y2="88"/>
      <line x1="174" y1="148" x2="150" y2="130"/><line x1="150" y1="130" x2="144" y2="162"/>
      <line x1="182" y1="148" x2="206" y2="128"/><line x1="206" y1="128" x2="212" y2="162"/>
    </g>
    <circle cx="150" cy="130" r="5" fill="#64748b"/>
    <circle cx="206" cy="128" r="5" fill="#64748b"/>
  </g>

  <!-- F7: Sprintando a la izquierda, zancada opuesta -->
  <g class="f7">
    <circle cx="130" cy="86" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="130" y1="98" x2="128" y2="146"/>
      <line x1="112" y1="106" x2="148" y2="104"/>
      <line x1="148" y1="104" x2="160" y2="122"/>
      <line x1="112" y1="106" x2="100" y2="86"/>
      <line x1="126" y1="146" x2="148" y2="128"/><line x1="148" y1="128" x2="156" y2="160"/>
      <line x1="134" y1="146" x2="112" y2="126"/><line x1="112" y1="126" x2="104" y2="160"/>
    </g>
    <circle cx="148" cy="128" r="5" fill="#64748b"/>
    <circle cx="112" cy="126" r="5" fill="#64748b"/>
  </g>

  <!-- F8: Desacelerando, aproximándose al cono izquierdo -->
  <g class="f8">
    <circle cx="80" cy="82" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="80" y1="94" x2="78" y2="144"/>
      <line x1="68" y1="102" x2="96" y2="100"/>
      <line x1="68" y1="102" x2="60" y2="122"/>
      <line x1="96" y1="100" x2="104" y2="82"/>
      <line x1="78" y1="144" x2="90" y2="128"/><line x1="90" y1="128" x2="96" y2="160"/>
      <line x1="86" y1="144" x2="76" y2="128"/><line x1="76" y1="128" x2="70" y2="160"/>
    </g>
  </g>
</svg>
