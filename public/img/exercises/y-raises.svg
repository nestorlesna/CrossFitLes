<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: Brazos al costado (posición inicial) -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="30" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="44" x2="100" y2="118"/>
  <!-- Brazos colgando al costado con discos -->
  <line x1="100" y1="58" x2="78" y2="118"/>
  <line x1="100" y1="58" x2="122" y2="118"/>
  <!-- Piernas -->
  <line x1="94" y1="118" x2="86" y2="165"/>
  <line x1="86" y1="165" x2="84" y2="205"/>
  <line x1="106" y1="118" x2="114" y2="165"/>
  <line x1="114" y1="165" x2="116" y2="205"/>
  <!-- Discos -->
  <circle cx="78" cy="122" r="6" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="122" cy="122" r="6" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
</g>

<!-- f2: Brazos a mitad de subida en diagonal -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="30" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="44" x2="100" y2="118"/>
  <!-- Brazos en diagonal a 45° -->
  <line x1="100" y1="58" x2="60" y2="80"/>
  <line x1="100" y1="58" x2="140" y2="80"/>
  <line x1="94" y1="118" x2="86" y2="165"/>
  <line x1="86" y1="165" x2="84" y2="205"/>
  <line x1="106" y1="118" x2="114" y2="165"/>
  <line x1="114" y1="165" x2="116" y2="205"/>
  <circle cx="60" cy="80" r="6" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="140" cy="80" r="6" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
</g>

<!-- f3: Brazos en Y completa (overhead diagonal) -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="30" r="14" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="44" x2="100" y2="118"/>
  <!-- Brazos en Y -->
  <line x1="100" y1="58" x2="65" y2="20"/>
  <line x1="100" y1="58" x2="135" y2="20"/>
  <line x1="94" y1="118" x2="86" y2="165"/>
  <line x1="86" y1="165" x2="84" y2="205"/>
  <line x1="106" y1="118" x2="114" y2="165"/>
  <line x1="114" y1="165" x2="116" y2="205"/>
  <circle cx="65" cy="20" r="6" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="135" cy="20" r="6" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
</g>

<text x="100" y="225" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">Y RAISES</text>
</svg>
