<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">SPIDERMAN ROTATION</text>

<!-- F1: High plank -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="155" cy="118" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="143" y1="122" x2="136" y2="128"/>
  <line x1="136" y1="128" x2="72" y2="152"/>
  <line x1="136" y1="128" x2="128" y2="170"/>
  <line x1="128" y1="170" x2="120" y2="184"/>
  <line x1="110" y1="184" x2="130" y2="184"/>
  <line x1="72" y1="152" x2="64" y2="184"/>
  <line x1="64" y1="184" x2="58" y2="210"/>
  <line x1="50" y1="210" x2="66" y2="210"/>
  <line x1="76" y1="154" x2="70" y2="187"/>
  <line x1="70" y1="187" x2="64" y2="210"/>
</g>

<!-- F2: Front foot steps beside the hand, back leg extended (spiderman lunge) -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="155" cy="118" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="143" y1="122" x2="136" y2="128"/>
  <line x1="136" y1="128" x2="72" y2="152"/>
  <line x1="136" y1="128" x2="128" y2="170"/>
  <line x1="128" y1="170" x2="120" y2="184"/>
  <line x1="110" y1="184" x2="130" y2="184"/>
  <line x1="72" y1="152" x2="95" y2="160"/>
  <line x1="95" y1="160" x2="122" y2="182"/>
  <line x1="114" y1="182" x2="128" y2="182"/>
  <circle cx="95" cy="160" r="4" fill="#64748b" stroke="none"/>
  <line x1="76" y1="154" x2="66" y2="187"/>
  <line x1="66" y1="187" x2="60" y2="210"/>
  <line x1="52" y1="210" x2="68" y2="210"/>
</g>

<!-- F3: Torso rotates open, far arm reaches to the sky -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="157" cy="112" r="12" fill="#94a3b8" stroke="none"/>
  <line x1="145" y1="117" x2="138" y2="124"/>
  <line x1="138" y1="124" x2="74" y2="148"/>
  <line x1="138" y1="124" x2="130" y2="167"/>
  <line x1="130" y1="167" x2="122" y2="182"/>
  <line x1="114" y1="182" x2="128" y2="182"/>
  <line x1="138" y1="124" x2="172" y2="77"/>
  <circle cx="172" cy="77" r="4" fill="#64748b" stroke="none"/>
  <line x1="74" y1="148" x2="97" y2="156"/>
  <line x1="97" y1="156" x2="122" y2="182"/>
  <circle cx="97" cy="156" r="4" fill="#64748b" stroke="none"/>
  <line x1="78" y1="150" x2="68" y2="187"/>
  <line x1="68" y1="187" x2="62" y2="210"/>
  <line x1="54" y1="210" x2="70" y2="210"/>
</g>
</svg>
