<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="16" y1="192" x2="184" y2="192" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">FIGURE-4 STRETCH</text>

  <!-- Frame 1: boca arriba, rodillas flexionadas -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="32" cy="172" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="46" y1="180" x2="112" y2="182"/>
    <polyline points="112,182 148,148 156,190"/>
    <polyline points="112,182 142,156 150,190"/>
    <circle cx="148" cy="148" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: tobillo cruzado sobre la rodilla contraria (figura 4) -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="32" cy="172" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="46" y1="180" x2="112" y2="182"/>
    <polyline points="112,182 148,148 156,190"/>
    <polyline points="112,178 124,136 170,142"/>
    <circle cx="148" cy="148" r="4" fill="#64748b" stroke="none"/>
    <circle cx="124" cy="136" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: traccionando el muslo hacia el pecho -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="32" cy="172" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="46" y1="180" x2="112" y2="182"/>
    <polyline points="112,182 116,124 148,156"/>
    <polyline points="112,178 90,116 138,102"/>
    <line x1="52" y1="176" x2="106" y2="132"/>
    <circle cx="116" cy="124" r="4" fill="#64748b" stroke="none"/>
    <circle cx="90" cy="116" r="4" fill="#64748b" stroke="none"/>
    <circle cx="150" cy="86" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="160" cy="94" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="168" cy="104" r="3" fill="#6ee7b7" stroke="none"/>
  </g>
</svg>
