<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <!-- Kneeling Weighted Shoulder CAR: 7 fotogramas -->
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <style>
    .f1{animation:sh1 9s linear infinite}.f2{animation:sh2 9s linear infinite}.f3{animation:sh3 9s linear infinite}.f4{animation:sh4 9s linear infinite}.f5{animation:sh5 9s linear infinite}.f6{animation:sh6 9s linear infinite}.f7{animation:sh7 9s linear infinite}
    @keyframes sh1{0%,11.4%{opacity:1}14.3%,97.1%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,14.3%{opacity:0}17.1%,25.7%{opacity:1}28.6%,100%{opacity:0}}
    @keyframes sh3{0%,28.6%{opacity:0}31.4%,40%{opacity:1}42.9%,100%{opacity:0}}
    @keyframes sh4{0%,42.9%{opacity:0}45.7%,54.3%{opacity:1}57.1%,100%{opacity:0}}
    @keyframes sh5{0%,57.1%{opacity:0}60%,68.6%{opacity:1}71.4%,100%{opacity:0}}
    @keyframes sh6{0%,71.4%{opacity:0}74.3%,82.9%{opacity:1}85.7%,100%{opacity:0}}
    @keyframes sh7{0%,85.7%{opacity:0}88.6%,97.1%{opacity:1}100%{opacity:0}}
  </style>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <polyline points="107.8,140.9 115.2,137.5 122,133 128,127.5 133.1,121.1 137.1,114 140,106.3 141.6,98.3 142,90.2 141,82.1 138.9,74.2 135.5,66.8 131,60 125.5,54 119.1,48.9 112,44.9 104.3,42 96.3,40.4 88.2,40 80.1,41 72.2,43.1 64.8,46.5 58,51 52,56.5 46.9,62.9 42.9,70 40,77.7 38.4,85.7 38,93.8 39,101.9 41.1,109.8 44.5,117.2 49,124 54.5,130 60.9,135.1 68,139.1 75.7,142" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3 4"/><g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><circle cx="90" cy="68" r="14" fill="#94a3b8" stroke="none"/><line x1="90" y1="82" x2="90" y2="152"/><line x1="90" y1="152" x2="76" y2="203"/><line x1="76" y1="203" x2="42" y2="203"/><line x1="90" y1="152" x2="140" y2="158"/><line x1="140" y1="158" x2="140" y2="205"/><line x1="140" y1="205" x2="158" y2="205"/><circle cx="76" cy="203" r="4" fill="#64748b" stroke="none"/><circle cx="140" cy="158" r="4" fill="#64748b" stroke="none"/><circle cx="90" cy="152" r="4" fill="#64748b" stroke="none"/><g stroke="#64748b"><line x1="90" y1="92" x2="72" y2="122"/><line x1="72" y1="122" x2="88" y2="146"/></g></g>
  <!-- Frame 1: brazo abajo y al frente -->
  <g class="f1" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><line x1="90" y1="92" x2="107.8" y2="140.9"/><circle cx="98.9" cy="116.4" r="3" fill="#64748b" stroke="none"/><g stroke="#cbd5e1" stroke-linecap="round"><line x1="102.1" y1="142.9" x2="113.4" y2="138.8" stroke-width="2.5"/><line x1="103.5" y1="146.7" x2="100.8" y2="139.2" stroke-width="4"/><line x1="114.8" y1="142.6" x2="112.1" y2="135.1" stroke-width="4"/></g><circle cx="90" cy="92" r="4" fill="#64748b" stroke="none"/></g>
  <!-- Frame 2: sube por delante -->
  <g class="f2" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><line x1="90" y1="92" x2="138.9" y2="109.8"/><circle cx="114.4" cy="100.9" r="3" fill="#64748b" stroke="none"/><g stroke="#cbd5e1" stroke-linecap="round"><line x1="136.8" y1="115.4" x2="140.9" y2="104.1" stroke-width="2.5"/><line x1="140.6" y1="116.8" x2="133.1" y2="114.1" stroke-width="4"/><line x1="144.7" y1="105.5" x2="137.2" y2="102.8" stroke-width="4"/></g><circle cx="90" cy="92" r="4" fill="#64748b" stroke="none"/></g>
  <!-- Frame 3: por encima de la línea del hombro -->
  <g class="f3" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><line x1="90" y1="92" x2="135" y2="66"/><circle cx="112.5" cy="79" r="3" fill="#64748b" stroke="none"/><g stroke="#cbd5e1" stroke-linecap="round"><line x1="138" y1="71.2" x2="132" y2="60.8" stroke-width="2.5"/><line x1="141.5" y1="69.2" x2="134.6" y2="73.2" stroke-width="4"/><line x1="135.5" y1="58.8" x2="128.6" y2="62.8" stroke-width="4"/></g><circle cx="90" cy="92" r="4" fill="#64748b" stroke="none"/></g>
  <!-- Frame 4: brazo vertical arriba, junto a la oreja -->
  <g class="f4" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><line x1="90" y1="92" x2="94.5" y2="40.2"/><circle cx="92.3" cy="66.1" r="3" fill="#64748b" stroke="none"/><g stroke="#cbd5e1" stroke-linecap="round"><line x1="100.5" y1="40.7" x2="88.6" y2="39.7" stroke-width="2.5"/><line x1="100.9" y1="36.7" x2="100.2" y2="44.7" stroke-width="4"/><line x1="88.9" y1="35.7" x2="88.2" y2="43.7" stroke-width="4"/></g><circle cx="90" cy="92" r="4" fill="#64748b" stroke="none"/></g>
  <!-- Frame 5: gira hacia atrás -->
  <g class="f5" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><line x1="90" y1="92" x2="45" y2="66"/><circle cx="67.5" cy="79" r="3" fill="#64748b" stroke="none"/><g stroke="#cbd5e1" stroke-linecap="round"><line x1="48" y1="60.8" x2="42" y2="71.2" stroke-width="2.5"/><line x1="44.5" y1="58.8" x2="51.4" y2="62.8" stroke-width="4"/><line x1="38.5" y1="69.2" x2="45.4" y2="73.2" stroke-width="4"/></g><circle cx="90" cy="92" r="4" fill="#64748b" stroke="none"/></g>
  <!-- Frame 6: por detrás, a la altura del hombro -->
  <g class="f6" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><line x1="90" y1="92" x2="45" y2="118"/><circle cx="67.5" cy="105" r="3" fill="#64748b" stroke="none"/><g stroke="#cbd5e1" stroke-linecap="round"><line x1="42" y1="112.8" x2="48" y2="123.2" stroke-width="2.5"/><line x1="38.5" y1="114.8" x2="45.4" y2="110.8" stroke-width="4"/><line x1="44.5" y1="125.2" x2="51.4" y2="121.2" stroke-width="4"/></g><circle cx="90" cy="92" r="4" fill="#64748b" stroke="none"/></g>
  <!-- Frame 7: cierre abajo y atrás, sin arquear la espalda -->
  <g class="f7" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none"><line x1="90" y1="92" x2="76.5" y2="142.2"/><circle cx="83.3" cy="117.1" r="3" fill="#64748b" stroke="none"/><g stroke="#cbd5e1" stroke-linecap="round"><line x1="70.7" y1="140.7" x2="82.3" y2="143.8" stroke-width="2.5"/><line x1="69.7" y1="144.5" x2="71.8" y2="136.8" stroke-width="4"/><line x1="81.3" y1="147.6" x2="83.4" y2="139.9" stroke-width="4"/></g><circle cx="90" cy="92" r="4" fill="#64748b" stroke="none"/></g>
  
  <text x="100" y="225" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle" letter-spacing="0.5">KNEELING SHOULDER CAR</text>
</svg>
