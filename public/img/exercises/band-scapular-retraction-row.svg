<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">BAND SCAPULAR ROW</text>
  <!-- ancla de la banda a la izquierda -->
  <line x1="34" y1="70" x2="34" y2="150" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <!-- Frame 1: brazo extendido al frente, escapula en protraccion -->
  <g class="f1">
    <circle cx="112" cy="36" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="112" y1="49" x2="112" y2="114"/>
      <line x1="112" y1="62" x2="72" y2="70"/>
      <line x1="106" y1="114" x2="102" y2="162"/><line x1="102" y1="162" x2="100" y2="208"/>
      <line x1="118" y1="114" x2="124" y2="162"/><line x1="124" y1="162" x2="128" y2="208"/>
    </g>
    <circle cx="102" cy="162" r="5" fill="#64748b"/>
    <circle cx="124" cy="162" r="5" fill="#64748b"/>
    <path d="M34 92 q20 -14 38 -22" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Frame 2: media traccion, codo empieza a doblarse -->
  <g class="f2">
    <circle cx="112" cy="36" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="112" y1="49" x2="112" y2="114"/>
      <line x1="112" y1="62" x2="94" y2="76"/><line x1="94" y1="76" x2="70" y2="72"/>
      <line x1="106" y1="114" x2="102" y2="162"/><line x1="102" y1="162" x2="100" y2="208"/>
      <line x1="118" y1="114" x2="124" y2="162"/><line x1="124" y1="162" x2="128" y2="208"/>
    </g>
    <circle cx="102" cy="162" r="5" fill="#64748b"/>
    <circle cx="124" cy="162" r="5" fill="#64748b"/>
    <path d="M34 92 q18 -8 36 -20" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Frame 3: retraccion escapular completa, codo detras del torso -->
  <g class="f3">
    <circle cx="112" cy="36" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="112" y1="49" x2="112" y2="114"/>
      <line x1="112" y1="62" x2="122" y2="82"/><line x1="122" y1="82" x2="112" y2="66"/>
      <line x1="106" y1="114" x2="102" y2="162"/><line x1="102" y1="162" x2="100" y2="208"/>
      <line x1="118" y1="114" x2="124" y2="162"/><line x1="124" y1="162" x2="128" y2="208"/>
    </g>
    <circle cx="102" cy="162" r="5" fill="#64748b"/>
    <circle cx="124" cy="162" r="5" fill="#64748b"/>
    <path d="M34 92 q40 -6 78 -26" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>
  </g>
</svg>
