    <circle cx="110" cy="46" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="110" y1="58" x2="110" y2="118"/>
      <line x1="90" y1="70" x2="130" y2="70"/>
      <polyline points="90,70 82,96 78,122"/>
      <polyline points="130,70 138,96 142,122"/>
      <polyline points="104,118 98,164 94,210"/>
      <polyline points="116,118 122,164 126,210"/>
    </g>
    <circle cx="82" cy="96" r="4" fill="#64748b"/><circle cx="138" cy="96" r="4" fill="#64748b"/>
