    <line x1="44" y1="98" x2="176" y2="98" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="90" width="8" height="16" rx="2" fill="#475569"/><rect x="176" y="90" width="8" height="16" rx="2" fill="#475569"/>
