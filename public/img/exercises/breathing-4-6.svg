<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="16" y1="192" x2="184" y2="192" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">4-6 BREATHING</text>

  <!-- Frame 1: acostado, abdomen neutro -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="34" cy="170" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="48" y1="178" x2="112" y2="180"/>
    <polyline points="112,180 148,148 158,190"/>
    <polyline points="112,180 142,154 152,190"/>
    <line x1="60" y1="176" x2="82" y2="168"/>
    <circle cx="84" cy="167" r="5" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: inhalación en 4 s, abdomen inflado -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="34" cy="170" r="12" fill="#94a3b8" stroke="none"/>
    <path d="M48,178 Q84,152 112,180"/>
    <polyline points="112,180 148,148 158,190"/>
    <polyline points="112,180 142,154 152,190"/>
    <line x1="60" y1="172" x2="82" y2="156"/>
    <circle cx="84" cy="155" r="5" fill="#64748b" stroke="none"/>
    <path d="M24,140 Q34,124 44,140" stroke="#6ee7b7" stroke-width="3" fill="none"/>
    <path d="M40,132 Q50,112 60,132" stroke="#6ee7b7" stroke-width="3" fill="none"/>
    <text x="100" y="70" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#6ee7b7">4 s</text>
  </g>

  <!-- Frame 3: exhalación en 6 s, abdomen vaciándose -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="34" cy="170" r="12" fill="#94a3b8" stroke="none"/>
    <line x1="48" y1="180" x2="112" y2="181"/>
    <polyline points="112,180 148,148 158,190"/>
    <polyline points="112,180 142,154 152,190"/>
    <line x1="60" y1="178" x2="82" y2="172"/>
    <circle cx="84" cy="171" r="5" fill="#64748b" stroke="none"/>
    <path d="M24,150 Q34,166 44,150" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <path d="M40,158 Q50,178 60,158" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <text x="100" y="70" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#f59e0b">6 s</text>
  </g>
</svg>
