  <g class="f7">
    <ellipse cx="110" cy="203" rx="22" ry="6" fill="#475569"/><ellipse cx="110" cy="203" rx="5" ry="2" fill="#111827"/>
    <circle cx="152" cy="38" r="12" fill="#94a3b8"/>
