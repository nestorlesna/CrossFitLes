      <polyline points="56,62 44,92 52,116"/>
      <polyline points="56,116 64,160 56,206"/>
    </g>
    <circle cx="64" cy="160" r="4" fill="#64748b"/>
  </g>
  <!-- Frame 2: sentadilla, brazos atras -->
