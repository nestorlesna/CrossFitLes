<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="16" y1="180" x2="184" y2="180" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">SCAPULAR PLANK HOLD</text>

  <!-- Frame 1: escápulas retraídas (torso hundido entre los hombros) -->
  <g class="f1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="34" cy="106" r="12" fill="#94a3b8" stroke="none"/>
    <path d="M48,112 Q110,128 170,126"/>
    <line x1="50" y1="112" x2="48" y2="178"/>
    <line x1="170" y1="126" x2="174" y2="178"/>
    <line x1="158" y1="178" x2="180" y2="178"/>
    <circle cx="48" cy="178" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 2: empujando el piso, escápulas separándose -->
  <g class="f2" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="34" cy="100" r="12" fill="#94a3b8" stroke="none"/>
    <path d="M48,106 Q110,112 170,122"/>
    <line x1="50" y1="106" x2="48" y2="178"/>
    <line x1="170" y1="122" x2="174" y2="178"/>
    <line x1="158" y1="178" x2="180" y2="178"/>
    <circle cx="48" cy="178" r="4" fill="#64748b" stroke="none"/>
  </g>

  <!-- Frame 3: protracción máxima sostenida (espalda alta redondeada) -->
  <g class="f3" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="34" cy="96" r="12" fill="#94a3b8" stroke="none"/>
    <path d="M48,102 Q88,86 170,120"/>
    <line x1="50" y1="102" x2="48" y2="178"/>
    <line x1="170" y1="120" x2="174" y2="178"/>
    <line x1="158" y1="178" x2="180" y2="178"/>
    <circle cx="48" cy="178" r="4" fill="#64748b" stroke="none"/>
    <circle cx="80" cy="64" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="92" cy="62" r="3" fill="#6ee7b7" stroke="none"/>
    <circle cx="104" cy="64" r="3" fill="#6ee7b7" stroke="none"/>
  </g>
</svg>
