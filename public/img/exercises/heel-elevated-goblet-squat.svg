<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">HEEL-ELEV GOBLET SQUAT</text>
  <!-- cuna bajo los talones -->
  <path d="M84 208 L116 208 L110 198 L90 198 Z" fill="#374151"/>
  <!-- Frame 1: de pie, mancuerna en rack goblet frente al pecho -->
  <g class="f1">
    <circle cx="100" cy="34" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="47" x2="100" y2="112"/>
      <line x1="100" y1="60" x2="88" y2="76"/><line x1="100" y1="60" x2="112" y2="76"/>
      <line x1="94" y1="112" x2="92" y2="160"/><line x1="92" y1="160" x2="94" y2="196"/>
      <line x1="106" y1="112" x2="108" y2="160"/><line x1="108" y1="160" x2="106" y2="196"/>
    </g>
    <rect x="92" y="66" width="16" height="14" rx="3" fill="#f59e0b"/>
    <circle cx="92" cy="160" r="5" fill="#64748b"/><circle cx="108" cy="160" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: media sentadilla, torso vertical -->
  <g class="f2">
    <circle cx="100" cy="46" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="59" x2="100" y2="120"/>
      <line x1="100" y1="72" x2="88" y2="88"/><line x1="100" y1="72" x2="112" y2="88"/>
      <line x1="94" y1="120" x2="78" y2="150"/><line x1="78" y1="150" x2="92" y2="196"/>
      <line x1="106" y1="120" x2="122" y2="150"/><line x1="122" y1="150" x2="108" y2="196"/>
    </g>
    <rect x="92" y="78" width="16" height="14" rx="3" fill="#f59e0b"/>
    <circle cx="78" cy="150" r="5" fill="#64748b"/><circle cx="122" cy="150" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: sentadilla profunda, cadera bajo rodillas, torso erguido -->
  <g class="f3">
    <circle cx="100" cy="66" r="13" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="100" y1="79" x2="100" y2="140"/>
      <line x1="100" y1="92" x2="86" y2="106"/><line x1="100" y1="92" x2="114" y2="106"/>
      <line x1="96" y1="140" x2="74" y2="150"/><line x1="74" y1="150" x2="92" y2="196"/>
      <line x1="104" y1="140" x2="126" y2="150"/><line x1="126" y1="150" x2="108" y2="196"/>
    </g>
    <rect x="92" y="96" width="16" height="14" rx="3" fill="#f59e0b"/>
    <circle cx="74" cy="150" r="5" fill="#64748b"/><circle cx="126" cy="150" r="5" fill="#64748b"/>
  </g>
</svg>
