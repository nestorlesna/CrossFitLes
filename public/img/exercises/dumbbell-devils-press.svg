<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 230">
  <style>
    .f1{animation:sh1 10s linear infinite}.f2{animation:sh2 10s linear infinite}.f3{animation:sh3 10s linear infinite}.f4{animation:sh4 10s linear infinite}.f5{animation:sh5 10s linear infinite}.f6{animation:sh6 10s linear infinite}.f7{animation:sh7 10s linear infinite}.f8{animation:sh8 10s linear infinite}.f9{animation:sh9 10s linear infinite}.f10{animation:sh10 10s linear infinite}
    @keyframes sh1{0%,8.2%{opacity:1}10%,100%{opacity:0}}
    @keyframes sh2{0%,10%{opacity:0}11.8%,18.2%{opacity:1}20%,100%{opacity:0}}
    @keyframes sh3{0%,20%{opacity:0}21.8%,28.2%{opacity:1}30%,100%{opacity:0}}
    @keyframes sh4{0%,30%{opacity:0}31.8%,38.2%{opacity:1}40%,100%{opacity:0}}
    @keyframes sh5{0%,40%{opacity:0}41.8%,48.2%{opacity:1}50%,100%{opacity:0}}
    @keyframes sh6{0%,50%{opacity:0}51.8%,58.2%{opacity:1}60%,100%{opacity:0}}
    @keyframes sh7{0%,60%{opacity:0}61.8%,68.2%{opacity:1}70%,100%{opacity:0}}
    @keyframes sh8{0%,70%{opacity:0}71.8%,78.2%{opacity:1}80%,100%{opacity:0}}
    @keyframes sh9{0%,80%{opacity:0}81.8%,88.2%{opacity:1}90%,100%{opacity:0}}
    @keyframes sh10{0%,90%{opacity:0}91.8%,98.2%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="240" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="220" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">DEVIL'S PRESS</text>

  <!-- F1: Burpee prono, DBs en el piso -->
  <g class="f1">
    <rect x="58" y="192" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="162" y="192" width="20" height="8" rx="2" fill="#475569"/>
    <circle cx="200" cy="152" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="200" y1="164" x2="120" y2="174"/>
      <line x1="172" y1="168" x2="162" y2="158"/><line x1="162" y1="158" x2="78" y2="192"/>
      <line x1="120" y1="174" x2="80" y2="164"/><line x1="80" y1="164" x2="58" y2="192"/>
      <line x1="120" y1="174" x2="118" y2="210"/>
      <line x1="122" y1="174" x2="126" y2="210"/>
    </g>
  </g>

  <!-- F2: Flexion, empujando el pecho fuera del piso -->
  <g class="f2">
    <rect x="72" y="186" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="152" y="182" width="20" height="8" rx="2" fill="#475569"/>
    <circle cx="185" cy="140" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="185" y1="152" x2="125" y2="165"/>
      <line x1="165" y1="150" x2="150" y2="145"/><line x1="150" y1="145" x2="100" y2="180"/>
      <line x1="125" y1="165" x2="95" y2="155"/><line x1="95" y1="155" x2="75" y2="185"/>
      <line x1="125" y1="165" x2="122" y2="190"/><line x1="122" y1="190" x2="120" y2="208"/>
      <line x1="128" y1="165" x2="130" y2="190"/><line x1="130" y1="190" x2="132" y2="208"/>
    </g>
  </g>

  <!-- F3: Cadera se eleva, pies se recogen hacia las manos -->
  <g class="f3">
    <rect x="88" y="176" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="138" y="172" width="20" height="8" rx="2" fill="#475569"/>
    <circle cx="160" cy="110" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="160" y1="122" x2="130" y2="150"/>
      <line x1="140" y1="128" x2="120" y2="140"/><line x1="120" y1="140" x2="95" y2="175"/>
      <line x1="130" y1="150" x2="105" y2="150"/><line x1="105" y1="150" x2="85" y2="178"/>
      <line x1="130" y1="150" x2="118" y2="178"/><line x1="118" y1="178" x2="110" y2="205"/>
      <line x1="133" y1="150" x2="126" y2="178"/><line x1="126" y1="178" x2="128" y2="205"/>
    </g>
  </g>

  <!-- F4: De pie, comenzando el tirón, DBs cerca de las canillas -->
  <g class="f4">
    <rect x="82" y="152" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="140" y="152" width="20" height="8" rx="2" fill="#475569"/>
    <circle cx="125" cy="72" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="125" y1="84" x2="122" y2="138"/>
      <line x1="108" y1="92" x2="98" y2="120"/><line x1="98" y1="120" x2="92" y2="160"/>
      <line x1="140" y1="92" x2="148" y2="120"/><line x1="148" y1="120" x2="152" y2="160"/>
      <line x1="118" y1="138" x2="112" y2="175"/><line x1="112" y1="175" x2="104" y2="210"/>
      <line x1="128" y1="138" x2="136" y2="175"/><line x1="136" y1="175" x2="144" y2="210"/>
    </g>
  </g>

  <!-- F5: Tirón explosivo, DBs subiendo a la altura del muslo -->
  <g class="f5">
    <rect x="76" y="138" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="146" y="138" width="20" height="8" rx="2" fill="#475569"/>
    <circle cx="121" cy="62" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="121" y1="74" x2="120" y2="130"/>
      <line x1="100" y1="86" x2="85" y2="105"/><line x1="85" y1="105" x2="88" y2="148"/>
      <line x1="144" y1="86" x2="158" y2="105"/><line x1="158" y1="105" x2="156" y2="148"/>
      <line x1="115" y1="130" x2="108" y2="172"/><line x1="108" y1="172" x2="98" y2="210"/>
      <line x1="127" y1="130" x2="132" y2="172"/><line x1="132" y1="172" x2="140" y2="210"/>
    </g>
  </g>

  <!-- F6: DBs al hombro (posición de "clean") -->
  <g class="f6">
    <circle cx="120" cy="58" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="120" y1="70" x2="120" y2="126"/>
      <line x1="96" y1="82" x2="144" y2="82"/>
      <line x1="96" y1="82" x2="78" y2="62"/>
      <line x1="144" y1="82" x2="162" y2="62"/>
      <line x1="114" y1="126" x2="106" y2="172"/><line x1="106" y1="172" x2="96" y2="210"/>
      <line x1="126" y1="126" x2="134" y2="172"/><line x1="134" y1="172" x2="144" y2="210"/>
    </g>
    <circle cx="106" cy="172" r="5" fill="#64748b"/>
    <rect x="64" y="58" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="156" y="58" width="20" height="8" rx="2" fill="#475569"/>
  </g>

  <!-- F7: Dip - flexion breve de rodillas antes del empuje -->
  <g class="f7">
    <circle cx="120" cy="65" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="120" y1="77" x2="120" y2="132"/>
      <line x1="96" y1="89" x2="144" y2="89"/>
      <line x1="96" y1="89" x2="78" y2="69"/>
      <line x1="144" y1="89" x2="162" y2="69"/>
      <line x1="112" y1="132" x2="102" y2="168"/><line x1="102" y1="168" x2="94" y2="205"/>
      <line x1="128" y1="132" x2="138" y2="168"/><line x1="138" y1="168" x2="146" y2="205"/>
    </g>
    <circle cx="102" cy="168" r="5" fill="#64748b"/>
    <rect x="64" y="65" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="156" y="65" width="20" height="8" rx="2" fill="#475569"/>
  </g>

  <!-- F8: Empuje - piernas extendiendo, DBs subiendo -->
  <g class="f8">
    <circle cx="120" cy="58" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="120" y1="70" x2="120" y2="123"/>
      <line x1="96" y1="79" x2="144" y2="79"/>
      <line x1="96" y1="79" x2="71" y2="46"/>
      <line x1="144" y1="79" x2="169" y2="46"/>
      <line x1="114" y1="123" x2="107" y2="168.5"/><line x1="107" y1="168.5" x2="99" y2="210"/>
      <line x1="126" y1="123" x2="133" y2="168.5"/><line x1="133" y1="168.5" x2="142" y2="210"/>
    </g>
    <circle cx="107" cy="168.5" r="5" fill="#64748b"/>
    <rect x="58" y="42" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="165" y="42" width="20" height="8" rx="2" fill="#475569"/>
  </g>

  <!-- F9: Casi lockout, brazos casi extendidos overhead -->
  <g class="f9">
    <circle cx="120" cy="55" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="120" y1="67" x2="120" y2="121.5"/>
      <line x1="96" y1="77.5" x2="144" y2="77.5"/>
      <line x1="96" y1="77.5" x2="67.5" y2="38"/>
      <line x1="144" y1="77.5" x2="172.5" y2="38"/>
      <line x1="114" y1="121.5" x2="107.5" y2="166.75"/><line x1="107.5" y1="166.75" x2="99" y2="210"/>
      <line x1="126" y1="121.5" x2="132.5" y2="166.75"/><line x1="132.5" y1="166.75" x2="141" y2="210"/>
    </g>
    <circle cx="107.5" cy="166.75" r="5" fill="#64748b"/>
    <circle cx="132.5" cy="166.75" r="5" fill="#64748b"/>
    <rect x="55" y="34" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="165" y="34" width="20" height="8" rx="2" fill="#475569"/>
  </g>

  <!-- F10: Ambos DBs bloqueados overhead - finish del snatch -->
  <g class="f10">
    <circle cx="120" cy="52" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="120" y1="64" x2="120" y2="120"/>
      <line x1="96" y1="76" x2="144" y2="76"/>
      <line x1="96" y1="76" x2="64" y2="30"/>
      <line x1="144" y1="76" x2="176" y2="30"/>
      <line x1="114" y1="120" x2="108" y2="165"/><line x1="108" y1="165" x2="100" y2="210"/>
      <line x1="126" y1="120" x2="132" y2="165"/><line x1="132" y1="165" x2="140" y2="210"/>
    </g>
    <circle cx="108" cy="165" r="5" fill="#64748b"/>
    <circle cx="132" cy="165" r="5" fill="#64748b"/>
    <rect x="52" y="26" width="20" height="8" rx="2" fill="#475569"/>
    <rect x="168" y="26" width="20" height="8" rx="2" fill="#475569"/>
  </g>
</svg>
