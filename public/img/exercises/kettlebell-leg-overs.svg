    <line x1="88" y1="150" x2="80" y2="132"/>
    <line x1="118" y1="150" x2="136" y2="119"/>
    <line x1="136" y1="119" x2="150" y2="96"/>
  </g>

  <g class="f4">
    <circle cx="70" cy="150" r="12" fill="#94a3b8"/>
    <line x1="82" y1="150" x2="118" y2="150"/>
    <line x1="88" y1="150" x2="80" y2="132"/>
    <line x1="118" y1="150" x2="129" y2="115.5"/>
    <line x1="129" y1="115.5" x2="137" y2="88"/>
  </g>

  <g class="f5">
    <circle cx="70" cy="150" r="12" fill="#94a3b8"/>
    <line x1="82" y1="150" x2="118" y2="150"/>
    <line x1="88" y1="150" x2="80" y2="132"/>
    <line x1="118" y1="150" x2="122" y2="112"/>
    <line x1="122" y1="112" x2="124" y2="80"/>
  </g>

  <g class="f6">
