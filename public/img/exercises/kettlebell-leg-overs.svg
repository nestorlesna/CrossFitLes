<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="240" height="200" fill="#111827" rx="12"/>
  <line x1="20" y1="170" x2="220" y2="170" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="188" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">KETTLEBELL LEG OVERS</text>
  <!-- Kettlebell anchored on the floor at center -->
  <g fill="#475569">
    <rect x="112" y="150" width="16" height="12" rx="3"/>
    <path d="M114 150 a6 6 0 0 1 12 0" fill="none" stroke="#475569" stroke-width="3"/>
  </g>
  <!-- Frame 1: legs together tilted to the right -->
  <g class="f1">
    <circle cx="70" cy="150" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="82" y1="150" x2="118" y2="150"/>
      <line x1="88" y1="150" x2="80" y2="132"/>
      <line x1="118" y1="150" x2="150" y2="126"/><line x1="150" y1="126" x2="176" y2="112"/>
    </g>
    <circle cx="118" cy="150" r="5" fill="#64748b"/>
    <circle cx="150" cy="126" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: legs vertical, center -->
  <g class="f2">
    <circle cx="70" cy="150" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="82" y1="150" x2="118" y2="150"/>
      <line x1="88" y1="150" x2="80" y2="132"/>
      <line x1="118" y1="150" x2="122" y2="112"/><line x1="122" y1="112" x2="124" y2="80"/>
    </g>
    <circle cx="118" cy="150" r="5" fill="#64748b"/>
    <circle cx="122" cy="112" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: legs together tilted to the left -->
  <g class="f3">
    <circle cx="70" cy="150" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="82" y1="150" x2="118" y2="150"/>
      <line x1="88" y1="150" x2="80" y2="132"/>
      <line x1="118" y1="150" x2="96" y2="122"/><line x1="96" y1="122" x2="78" y2="100"/>
    </g>
    <circle cx="118" cy="150" r="5" fill="#64748b"/>
    <circle cx="96" cy="122" r="5" fill="#64748b"/>
  </g>
</svg>
