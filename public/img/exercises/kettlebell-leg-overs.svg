    <line x1="82" y1="150" x2="118" y2="150"/>
    <line x1="88" y1="150" x2="80" y2="132"/>
    <line x1="118" y1="150" x2="96" y2="122"/>
    <line x1="96" y1="122" x2="78" y2="100"/>
  </g>
    <circle cx="118" cy="150" r="5" fill="#64748b"/>
    <circle cx="96" cy="122" r="5" fill="#64748b"/>
  </g>
</svg>
