<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 230">
  <style>
    .f1{animation:sh1 9.1s linear infinite}.f2{animation:sh2 9.1s linear infinite}.f3{animation:sh3 9.1s linear infinite}.f4{animation:sh4 9.1s linear infinite}.f5{animation:sh5 9.1s linear infinite}.f6{animation:sh6 9.1s linear infinite}.f7{animation:sh7 9.1s linear infinite}
