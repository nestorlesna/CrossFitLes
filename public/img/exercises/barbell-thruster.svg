<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <style>
    .f1{animation:sh1 4s linear infinite}
    .f2{animation:sh2 4s linear infinite}
    .f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>

  <!-- Frame 1: Sentadilla profunda con barra en front rack -->
  <g class="f1">
    <circle cx="100" cy="76" r="12" fill="#94a3b8"/>
    <circle cx="100" cy="150" r="4" fill="#64748b"/>
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <!-- torso -->
      <line x1="100" y1="88" x2="100" y2="150"/>
      <!-- brazos al front rack -->
      <line x1="100" y1="98" x2="84" y2="86"/>
      <line x1="100" y1="98" x2="116" y2="86"/>
      <!-- muslos (sentadilla profunda) -->
      <line x1="100" y1="150" x2="74" y2="158"/>
      <line x1="100" y1="150" x2="126" y2="158"/>
      <!-- tibias -->
      <line x1="74" y1="158" x2="82" y2="205"/>
      <line x1="126" y1="158" x2="118" y2="205"/>
    </g>
    <!-- barra en hombros -->
    <line x1="64" y1="84" x2="136" y2="84" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Frame 2: De pie, barra subiendo a la cabeza -->
  <g class="f2">
    <circle cx="100" cy="52" r="12" fill="#94a3b8"/>
    <circle cx="100" cy="118" r="4" fill="#64748b"/>
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <line x1="100" y1="64" x2="100" y2="118"/>
      <!-- brazos semiextendidos empujando -->
      <line x1="100" y1="72" x2="86" y2="48"/>
      <line x1="100" y1="72" x2="114" y2="48"/>
      <!-- piernas casi extendidas -->
      <line x1="100" y1="118" x2="90" y2="160"/>
      <line x1="100" y1="118" x2="110" y2="160"/>
      <line x1="90" y1="160" x2="88" y2="205"/>
      <line x1="110" y1="160" x2="112" y2="205"/>
    </g>
    <line x1="74" y1="46" x2="126" y2="46" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Frame 3: Barra bloqueada overhead, de pie -->
  <g class="f3">
    <circle cx="100" cy="58" r="12" fill="#94a3b8"/>
    <circle cx="100" cy="120" r="4" fill="#64748b"/>
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <line x1="100" y1="70" x2="100" y2="120"/>
      <!-- brazos totalmente extendidos overhead -->
      <line x1="100" y1="74" x2="90" y2="34"/>
      <line x1="100" y1="74" x2="110" y2="34"/>
      <!-- piernas rectas -->
      <line x1="100" y1="120" x2="90" y2="205"/>
      <line x1="100" y1="120" x2="110" y2="205"/>
    </g>
    <line x1="72" y1="30" x2="128" y2="30" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <line x1="20" y1="208" x2="180" y2="208" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="223" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle" letter-spacing="0.5">BARBELL THRUSTER</text>
</svg>
