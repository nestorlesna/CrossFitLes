<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="220" height="230" fill="#111827" rx="12"/>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="225" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="2">HIGH HANG POWER CLEAN</text>
  <!-- Frame 1: High hang - barra en el pliegue de la cadera, torso casi vertical -->
  <g class="f1">
    <line x1="42" y1="132" x2="178" y2="132" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="124" width="8" height="16" rx="2" fill="#475569"/>
    <rect x="176" y="124" width="8" height="16" rx="2" fill="#475569"/>
    <circle cx="110" cy="60" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="110" y1="72" x2="110" y2="126"/>
      <line x1="90" y1="84" x2="130" y2="84"/>
      <line x1="90" y1="84" x2="78" y2="132"/>
      <line x1="130" y1="84" x2="142" y2="132"/>
      <!-- Apenas una flexión de rodilla: el dip corto del high hang -->
      <line x1="105" y1="126" x2="100" y2="170"/><line x1="100" y1="170" x2="94" y2="210"/>
      <line x1="115" y1="126" x2="120" y2="170"/><line x1="120" y1="170" x2="126" y2="210"/>
    </g>
    <circle cx="100" cy="170" r="5" fill="#64748b"/>
    <circle cx="120" cy="170" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: Extensión explosiva - triple extensión, codos altos -->
  <g class="f2">
    <line x1="42" y1="96" x2="178" y2="96" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="88" width="8" height="16" rx="2" fill="#475569"/>
    <rect x="176" y="88" width="8" height="16" rx="2" fill="#475569"/>
    <circle cx="110" cy="44" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="110" y1="56" x2="110" y2="112"/>
      <line x1="88" y1="68" x2="132" y2="68"/>
      <line x1="88" y1="68" x2="66" y2="54"/><line x1="66" y1="54" x2="72" y2="96"/>
      <line x1="132" y1="68" x2="154" y2="54"/><line x1="154" y1="54" x2="148" y2="96"/>
      <!-- Piernas extendidas, en puntas de pie -->
      <line x1="105" y1="112" x2="100" y2="162"/><line x1="100" y1="162" x2="96" y2="206"/>
      <line x1="115" y1="112" x2="120" y2="162"/><line x1="120" y1="162" x2="124" y2="206"/>
    </g>
    <circle cx="66" cy="54" r="5" fill="#64748b"/>
    <circle cx="154" cy="54" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 3: Recepción en power - front rack, sentadilla por encima del paralelo -->
  <g class="f3">
    <line x1="42" y1="104" x2="178" y2="104" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="96" width="8" height="16" rx="2" fill="#475569"/>
    <rect x="176" y="96" width="8" height="16" rx="2" fill="#475569"/>
    <circle cx="110" cy="52" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="110" y1="64" x2="110" y2="118"/>
      <line x1="90" y1="76" x2="130" y2="76"/>
      <line x1="90" y1="76" x2="76" y2="104"/>
      <line x1="130" y1="76" x2="144" y2="104"/>
      <line x1="104" y1="118" x2="94" y2="158"/><line x1="94" y1="158" x2="86" y2="210"/>
      <line x1="116" y1="118" x2="126" y2="158"/><line x1="126" y1="158" x2="134" y2="210"/>
    </g>
    <circle cx="94" cy="158" r="5" fill="#64748b"/>
    <circle cx="126" cy="158" r="5" fill="#64748b"/>
  </g>
</svg>
