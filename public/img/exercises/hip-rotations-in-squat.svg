<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: Sentadilla profunda, rodillas alineadas al frente -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="60" r="13" fill="#94a3b8" stroke="none"/>
  <!-- Torso ligeramente inclinado -->
  <line x1="100" y1="73" x2="100" y2="130"/>
  <!-- Brazos al frente para equilibrio -->
  <line x1="100" y1="90" x2="125" y2="105"/>
  <line x1="100" y1="90" x2="75" y2="105"/>
  <!-- Cadera baja, muslos paralelos al piso -->
  <line x1="100" y1="130" x2="70" y2="150"/>
  <line x1="70" y1="150" x2="70" y2="195"/>
  <line x1="70" y1="195" x2="55" y2="205"/>
  <line x1="100" y1="130" x2="130" y2="150"/>
  <line x1="130" y1="150" x2="130" y2="195"/>
  <line x1="130" y1="195" x2="145" y2="205"/>
  <circle cx="70" cy="150" r="5" fill="#64748b" stroke="none"/>
  <circle cx="130" cy="150" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- f2: Sentadilla con rodilla derecha rotada hacia adentro -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="60" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="73" x2="100" y2="130"/>
  <line x1="100" y1="90" x2="125" y2="105"/>
  <line x1="100" y1="90" x2="75" y2="105"/>
  <!-- Pierna izq normal -->
  <line x1="100" y1="130" x2="70" y2="150"/>
  <line x1="70" y1="150" x2="70" y2="195"/>
  <line x1="70" y1="195" x2="55" y2="205"/>
  <!-- Pierna der rotada (rodilla hacia adentro) -->
  <line x1="100" y1="130" x2="120" y2="155"/>
  <line x1="120" y1="155" x2="140" y2="190"/>
  <line x1="140" y1="190" x2="155" y2="200"/>
  <circle cx="70" cy="150" r="5" fill="#64748b" stroke="none"/>
  <circle cx="120" cy="155" r="5" fill="#64748b" stroke="none"/>
</g>

<!-- f3: Sentadilla con ambas rodillas abriéndose hacia afuera -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="100" cy="60" r="13" fill="#94a3b8" stroke="none"/>
  <line x1="100" y1="73" x2="100" y2="130"/>
  <line x1="100" y1="90" x2="125" y2="105"/>
  <line x1="100" y1="90" x2="75" y2="105"/>
  <!-- Rodillas hacia afuera (sapo) -->
  <line x1="100" y1="130" x2="60" y2="160"/>
  <line x1="60" y1="160" x2="80" y2="195"/>
  <line x1="80" y1="195" x2="65" y2="205"/>
  <line x1="100" y1="130" x2="140" y2="160"/>
  <line x1="140" y1="160" x2="120" y2="195"/>
  <line x1="120" y1="195" x2="135" y2="205"/>
  <circle cx="60" cy="160" r="5" fill="#64748b" stroke="none"/>
  <circle cx="140" cy="160" r="5" fill="#64748b" stroke="none"/>
</g>

<text x="100" y="225" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">HIP ROTATIONS SQUAT</text>
</svg>
