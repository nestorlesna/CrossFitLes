      <line x1="118" y1="76" x2="154" y2="76"/>
      <line x1="118" y1="76" x2="100" y2="104"/>
      <polyline points="130,122 118,152 116,178"/>
      <line x1="154" y1="76" x2="172" y2="104"/>
      <polyline points="142,122 154,152 156,178"/>
