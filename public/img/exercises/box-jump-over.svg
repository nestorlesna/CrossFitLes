  <!-- Frame 6: Aterrizaje amortiguando -->
  <g class="f6">
    <circle cx="156" cy="72" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="156" y1="84" x2="156" y2="138"/>
      <line x1="138" y1="98" x2="174" y2="98"/>
      <line x1="138" y1="98" x2="120" y2="122"/>
      <polyline points="150,138 130,172 128,205"/>
      <line x1="174" y1="98" x2="192" y2="122"/>
