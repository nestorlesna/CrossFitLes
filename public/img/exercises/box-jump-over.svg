<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 9.1s linear infinite}.f2{animation:sh2 9.1s linear infinite}.f3{animation:sh3 9.1s linear infinite}.f4{animation:sh4 9.1s linear infinite}.f5{animation:sh5 9.1s linear infinite}.f6{animation:sh6 9.1s linear infinite}.f7{animation:sh7 9.1s linear infinite}
    @keyframes sh1{0%,11.4%{opacity:1}14.3%,97.1%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,14.3%{opacity:0}17.1%,25.7%{opacity:1}28.6%,100%{opacity:0}}
    @keyframes sh3{0%,28.6%{opacity:0}31.4%,40%{opacity:1}42.9%,100%{opacity:0}}
    @keyframes sh4{0%,42.9%{opacity:0}45.7%,54.3%{opacity:1}57.1%,100%{opacity:0}}
    @keyframes sh5{0%,57.1%{opacity:0}60%,68.6%{opacity:1}71.4%,100%{opacity:0}}
    @keyframes sh6{0%,71.4%{opacity:0}74.3%,82.9%{opacity:1}85.7%,100%{opacity:0}}
    @keyframes sh7{0%,85.7%{opacity:0}88.6%,97.1%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <!-- Caja centrada (siempre visible) -->
  <rect x="78" y="168" width="44" height="37" rx="3" fill="none" stroke="#374151" stroke-width="4"/>
  <line x1="20" y1="205" x2="78" y2="205" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <line x1="122" y1="205" x2="180" y2="205" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">BOX JUMP OVER</text>
  <!-- Frame 1: De pie a la izquierda de la caja -->
  <g class="f1">
    <circle cx="44" cy="38" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="44" y1="50" x2="44" y2="114"/>
      <line x1="26" y1="64" x2="62" y2="64"/>
      <line x1="26" y1="64" x2="18" y2="108"/>
      <polyline points="38,114 38,162 36,205"/>
      <line x1="62" y1="64" x2="70" y2="108"/>
      <polyline points="50,114 50,162 52,205"/>
    </g>
    <circle cx="38" cy="162" r="5" fill="#64748b"/>
    <circle cx="50" cy="162" r="5" fill="#64748b"/>
  </g>
  <!-- Frame 2: Flexion, brazos atras -->
  <g class="f2">
    <circle cx="46" cy="66" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="46" y1="78" x2="46" y2="136"/>
      <line x1="28" y1="92" x2="64" y2="92"/>
      <line x1="28" y1="92" x2="16" y2="132"/>
      <polyline points="40,136 30,172 28,205"/>
      <line x1="64" y1="92" x2="76" y2="132"/>
      <polyline points="52,136 62,172 64,205"/>
