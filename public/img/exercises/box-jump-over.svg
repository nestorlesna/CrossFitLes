  <g class="f7">
    <circle cx="156" cy="38" r="12" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="156" y1="50" x2="156" y2="114"/>
      <line x1="138" y1="64" x2="174" y2="64"/>
      <line x1="138" y1="64" x2="130" y2="108"/>
      <polyline points="150,114 150,162 148,205"/>
      <line x1="174" y1="64" x2="182" y2="108"/>
      <polyline points="162,114 162,162 164,205"/>
