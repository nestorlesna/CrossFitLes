<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<defs><style>
.f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
@keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
@keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
@keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="200" height="230" fill="#111827" rx="12"/>
<line x1="25" y1="195" x2="175" y2="195" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

<!-- f1: On all fours, neutral spine (side view, facing left) -->
<g class="f1" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="40" cy="72" r="13" fill="#94a3b8" stroke="none"/>
  <!-- Spine horizontal -->
  <line x1="53" y1="76" x2="145" y2="82"/>
  <!-- Near arm going down to floor -->
  <line x1="53" y1="76" x2="50" y2="132"/>
  <line x1="50" y1="132" x2="46" y2="170"/>
  <line x1="36" y1="170" x2="56" y2="170"/>
  <!-- Near knee going down to floor -->
  <line x1="132" y1="80" x2="134" y2="140"/>
  <line x1="134" y1="140" x2="130" y2="168"/>
  <line x1="120" y1="168" x2="140" y2="168"/>
  <!-- Back/butt hint -->
  <line x1="145" y1="82" x2="148" y2="95"/>
</g>

<!-- f2: Hips moving back halfway toward heels -->
<g class="f2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="52" cy="88" r="13" fill="#94a3b8" stroke="none"/>
  <!-- Spine now angled, hips higher/back -->
  <line x1="64" y1="94" x2="148" y2="112"/>
  <!-- Arms still forward -->
  <line x1="64" y1="94" x2="56" y2="140"/>
  <line x1="56" y1="140" x2="48" y2="170"/>
  <line x1="38" y1="170" x2="58" y2="170"/>
  <!-- Knee under body, hips moving back -->
  <line x1="135" y1="108" x2="132" y2="148"/>
  <line x1="132" y1="148" x2="128" y2="170"/>
  <line x1="118" y1="170" x2="138" y2="170"/>
</g>

<!-- f3: Fully rocked back, hips near heels, arms extended forward -->
<g class="f3" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
  <circle cx="72" cy="115" r="13" fill="#94a3b8" stroke="none"/>
  <!-- Spine sharply angled down toward hips -->
  <line x1="84" y1="122" x2="143" y2="145"/>
  <!-- Arms stretched forward low -->
  <line x1="84" y1="122" x2="65" y2="150"/>
  <line x1="65" y1="150" x2="42" y2="172"/>
  <line x1="32" y1="172" x2="52" y2="172"/>
  <!-- Knee under body (hips on heels) -->
  <line x1="140" y1="142" x2="138" y2="162"/>
  <line x1="138" y1="162" x2="132" y2="172"/>
  <line x1="122" y1="172" x2="142" y2="172"/>
</g>

<text x="100" y="212" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">QUADRUPED ROCK BACK</text>
</svg>
