<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
<rect width="200" height="230" fill="#111827" rx="12"/>
<style>
  .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
  @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
  @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
</style>
<line x1="24" y1="206" x2="176" y2="206" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
<text x="100" y="222" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#475569">STIFF-LEG DEADLIFT</text>

<!-- F1: De pie, barra en la cadera, piernas rectas -->
<g class="f1">
  <line x1="36" y1="118" x2="164" y2="118" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="36" cy="118" r="8" fill="#64748b"/>
  <circle cx="164" cy="118" r="8" fill="#64748b"/>
  <circle cx="100" cy="34" r="12" fill="#94a3b8"/>
  <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="100" y1="46" x2="100" y2="112"/>
    <line x1="82" y1="58" x2="118" y2="58"/>
    <line x1="82" y1="58" x2="78" y2="118"/>
    <line x1="118" y1="58" x2="122" y2="118"/>
    <line x1="100" y1="112" x2="88" y2="160"/><line x1="88" y1="160" x2="86" y2="206"/>
    <line x1="100" y1="112" x2="112" y2="160"/><line x1="112" y1="160" x2="114" y2="206"/>
    <line x1="78" y1="206" x2="94" y2="206"/>
    <line x1="106" y1="206" x2="122" y2="206"/>
  </g>
  <circle cx="88" cy="160" r="4" fill="#64748b"/>
  <circle cx="112" cy="160" r="4" fill="#64748b"/>
</g>

<!-- F2: Bisagra de cadera, barra a la altura de las rodillas -->
<g class="f2">
  <line x1="36" y1="156" x2="164" y2="156" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="36" cy="156" r="8" fill="#64748b"/>
  <circle cx="164" cy="156" r="8" fill="#64748b"/>
  <circle cx="100" cy="56" r="12" fill="#94a3b8"/>
  <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="100" y1="68" x2="100" y2="124"/>
    <line x1="82" y1="78" x2="118" y2="78"/>
    <line x1="82" y1="78" x2="78" y2="156"/>
    <line x1="118" y1="78" x2="122" y2="156"/>
    <line x1="100" y1="124" x2="88" y2="166"/><line x1="88" y1="166" x2="86" y2="206"/>
    <line x1="100" y1="124" x2="112" y2="166"/><line x1="112" y1="166" x2="114" y2="206"/>
    <line x1="78" y1="206" x2="94" y2="206"/>
    <line x1="106" y1="206" x2="122" y2="206"/>
  </g>
  <circle cx="88" cy="166" r="4" fill="#64748b"/>
  <circle cx="112" cy="166" r="4" fill="#64748b"/>
</g>

<!-- F3: Maxima flexion de cadera, barra a media canilla, rodillas casi bloqueadas -->
<g class="f3">
  <line x1="36" y1="186" x2="164" y2="186" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="36" cy="186" r="8" fill="#64748b"/>
  <circle cx="164" cy="186" r="8" fill="#64748b"/>
  <circle cx="100" cy="82" r="12" fill="#94a3b8"/>
  <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="100" y1="94" x2="100" y2="138"/>
    <line x1="82" y1="102" x2="118" y2="102"/>
    <line x1="82" y1="102" x2="78" y2="186"/>
    <line x1="118" y1="102" x2="122" y2="186"/>
    <line x1="100" y1="138" x2="89" y2="174"/><line x1="89" y1="174" x2="86" y2="206"/>
    <line x1="100" y1="138" x2="111" y2="174"/><line x1="111" y1="174" x2="114" y2="206"/>
    <line x1="78" y1="206" x2="94" y2="206"/>
    <line x1="106" y1="206" x2="122" y2="206"/>
  </g>
  <circle cx="89" cy="174" r="4" fill="#64748b"/>
  <circle cx="111" cy="174" r="4" fill="#64748b"/>
</g>
</svg>
