<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <style>
    .f1{animation:sh1 4s linear infinite}.f2{animation:sh2 4s linear infinite}.f3{animation:sh3 4s linear infinite}
    @keyframes sh1{0%,27%{opacity:1}33%,90%{opacity:0}100%{opacity:1}}
    @keyframes sh2{0%,33%{opacity:0}40%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes sh3{0%,66%{opacity:0}72%,93%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="200" height="230" fill="#111827" rx="12"/>
  <!-- Pared (detrás, lado derecho) -->
  <line x1="150" y1="16" x2="150" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- Piso -->
  <line x1="30" y1="210" x2="170" y2="210" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">WALL SHOULDER STRETCH</text>

  <!-- Frame 1: de pie junto a la pared, brazo en alto apoyado -->
  <g class="f1">
    <circle cx="128" cy="36" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="128" y1="50" x2="126" y2="118"/>
      <line x1="128" y1="58" x2="150" y2="24"/>
      <line x1="128" y1="58" x2="108" y2="86"/>
      <line x1="122" y1="118" x2="120" y2="164"/><line x1="120" y1="164" x2="118" y2="208"/>
      <line x1="130" y1="118" x2="132" y2="164"/><line x1="132" y1="164" x2="134" y2="208"/>
    </g>
    <circle cx="150" cy="24" r="4" fill="#64748b"/>
  </g>

  <!-- Frame 2: rodillas semiflexionadas, el brazo desliza a media altura -->
  <g class="f2">
    <circle cx="122" cy="66" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="122" y1="80" x2="120" y2="140"/>
      <line x1="122" y1="88" x2="150" y2="88"/>
      <line x1="122" y1="88" x2="100" y2="110"/>
      <line x1="116" y1="140" x2="104" y2="172"/><line x1="104" y1="172" x2="106" y2="208"/>
      <line x1="124" y1="140" x2="132" y2="172"/><line x1="132" y1="172" x2="130" y2="208"/>
    </g>
    <circle cx="150" cy="88" r="4" fill="#64748b"/>
  </g>

  <!-- Frame 3: sentadilla profunda junto a la pared, brazo desliza abajo (estiramiento máximo) -->
  <g class="f3">
    <circle cx="116" cy="96" r="14" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="116" y1="110" x2="118" y2="160"/>
      <line x1="116" y1="118" x2="150" y2="152"/>
      <line x1="116" y1="118" x2="94" y2="134"/>
      <line x1="112" y1="160" x2="90" y2="176"/><line x1="90" y1="176" x2="94" y2="208"/>
      <line x1="122" y1="160" x2="138" y2="178"/><line x1="138" y1="178" x2="132" y2="208"/>
    </g>
    <circle cx="150" cy="152" r="4" fill="#64748b"/>
  </g>
</svg>
